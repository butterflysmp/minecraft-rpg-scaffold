# THE DRAGON FIGHT'S NUMBERS (PLAN-dragon-fight.md section 2, the quantity table). Every number the ring, the
# lightning and the Mage cycle run on is here, and none is in Java: FightLoader reads this file into core's
# FightSettings and RingLook. Every key is REQUIRED; a missing or malformed one refuses the whole file by name.
#
# WHOSE EACH NUMBER IS, as of 2026-11-18:
#   Ben's:                  border 48, mage ring 12, a strike every 40 ticks, first strike 20 (then doubling).
#   SEAT PLACEHOLDERS:      v_fast, v_slow, e_kill, the crystals. Not Ben's; he sets them at the first boot.
#   The seat's starting look: everything under ring_look. Ben judges it at the boot.

settings:
  # Ben's ("Keep the 48 block border ring").
  border_radius_blocks: 48.0
  # Ben's ("to 12 blocks around the Mage").
  mage_ring_radius_blocks: 12.0
  # SEAT PLACEHOLDER, not Ben's; he sets it at the first boot. The fastest point of the ring, blocks per second
  # (Ben: "Slightly slower than a player sprinting").
  fast_close_blocks_per_second: 5.0
  # SEAT PLACEHOLDER, not Ben's; he sets it at the first boot. The slow close's radius, blocks per second.
  slow_close_blocks_per_second: 0.4
  # SEAT PLACEHOLDER, not Ben's; he sets it at the first boot. Radius one counted kill adds back, blocks.
  kill_expansion_blocks: 1.0
  # SEAT PLACEHOLDER, not Ben's; he sets it at the first boot. How many crystals power the Mage.
  crystal_count: 10
  # SEAT PLACEHOLDER, not Ben's; he sets it at the first boot. Ticks between crystals, from the slow close's start.
  crystal_interval_ticks: 80
  # Ben's ("Yes", every 2 s, as cfde822's storm struck).
  strike_interval_ticks: 40
  # Ben's ("start at 20, 40, 80 and keeps doubling"). Not reduced by armour and wearing no element: a SEAT
  # PLACEHOLDER for the mitigation question, flagged to Ben (GATE-fight-ring.md asks him).
  first_strike_damage: 20.0

# THE SEAT'S STARTING LOOK, judged by Ben at the boot. Particles sent with force (Ben: "I would like to keep particles.
# We can try forced particles if that helps. I don't care about the minimal particle setting.").
ring_look:
  # Only dust is supported.
  particle: dust
  # cfde822's border colour, StormSystem.STORM_PURPLE_DUST at cfde822: Color.fromRGB(170, 0, 255), size 1.6.
  color: [170, 0, 255]
  dust_size: 1.6
  # The largest gap between neighbouring points round the ring, blocks. At radius 48 that is 302 points a height.
  point_spacing_blocks: 1.0
  # Heights above the ground at C (C's block y), blocks: one ring of points at each.
  height_offsets_blocks: [0.2, 1.2, 2.2]
  # Ticks between redraws.
  redraw_period_ticks: 4

# The dev fixture's own rule (GATE-fight-ring.md): who takes part.
fixture:
  # Players in C's world within this many blocks of C, in survival or adventure.
  participant_radius_blocks: 128.0
