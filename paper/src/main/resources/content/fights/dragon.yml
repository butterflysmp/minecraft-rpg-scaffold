# THE DRAGON FIGHT'S NUMBERS (PLAN-dragon-fight.md section 2, the quantity table). Every number the ring, the
# lightning, the Mage cycle, the Mage's gate and the crystals run on is here, and none is in Java: FightLoader reads
# this file into core's FightSettings and RingLook. Every key is REQUIRED; a missing or malformed one refuses the whole
# file by name.
#
# WHOSE EACH NUMBER IS, as of 2026-11-18:
#   Ben's:                  border 48, mage ring 12, v_fast 3.8, v_slow 0.6, a strike every 40 ticks, first strike 20
#                           (then doubling), the strike through armour, the wall's six rows 1.5 apart with alternate
#                           rows turning the other way, a crystal every 12 seconds, the refused-hit cue.
#   THE BRIEF'S READING:    the crystal count stays 10 (Ben changed only their pace).
#   SEAT PLACEHOLDERS:      e_kill, the crystals' spots, the lit cue. Not Ben's.
#   The seat's starting look: the colour, size, spacing, the row shift and the turn. Ben judges them at the boot.

settings:
  # Ben's ("Keep the 48 block border ring").
  border_radius_blocks: 48.0
  # Ben's ("to 12 blocks around the Mage").
  mage_ring_radius_blocks: 12.0
  # Ben's, 2026-11-18: "Let's lower it to 3.8 blocks a second to allow players to react and catch up when struct".
  # The fastest point of the ring, blocks per second.
  fast_close_blocks_per_second: 3.8
  # Ben's, 2026-11-18: "I think it should be a little faster. Maybe .6 blocks per second". Blocks of radius a second.
  slow_close_blocks_per_second: 0.6
  # SEAT PLACEHOLDER, not Ben's. Radius one counted kill adds back, blocks (Ben kept the jump: "the jump is fine").
  kill_expansion_blocks: 1.0
  # The brief's reading (2026-11-18: Ben changed the pace, not the count). How many crystals power the Mage.
  crystal_count: 10
  # Ben's, 2026-11-18: "no make it 12 seconds each crystal". Ticks between crystals, from the slow close's start.
  crystal_interval_ticks: 240
  # Ben's ("Yes", every 2 s, as cfde822's storm struck).
  strike_interval_ticks: 40
  # Ben's ("start at 20, 40, 80 and keeps doubling"). Reduced by armour (Ben, 2026-11-18: "yes"). It wears no element:
  # whether Void resistance or any element applies is OPEN.
  first_strike_damage: 20.0

# THE WALL. Particles sent with force (Ben: "I would like to keep particles. We can try forced particles if that
# helps. I don't care about the minimal particle setting."). Six rows 1.5 apart (Ben, 2026-11-18: "yes, maybe another
# row or 2"), each shifted round from the one below, every other row turning the other way (Ben: "maybe alternate
# twists on every other row"). At radius 48: 302 points a row, 1812 a redraw, 9060 packets a second per player.
ring_look:
  # Only dust is supported.
  particle: dust
  # cfde822's border colour, StormSystem.STORM_PURPLE_DUST at cfde822: Color.fromRGB(170, 0, 255), size 1.6.
  color: [170, 0, 255]
  dust_size: 1.6
  # The largest gap between neighbouring points round the ring, blocks. At radius 48 that is 302 points a row.
  point_spacing_blocks: 1.0
  # Heights above the ground at C (C's block y), blocks: one row of points at each. Six rows 1.5 apart (Ben).
  height_offsets_blocks: [0.2, 1.7, 3.2, 4.7, 6.2, 7.7]
  # The seat's starting value: each row starts this far further round the ring than the row below, blocks.
  row_shift_blocks: 0.25
  # The seat's starting value: the whole wall turns at this speed along the circumference, blocks per second.
  turn_blocks_per_second: 1.0
  # Ben's, 2026-11-18 ("maybe alternate twists on every other row"): rows 1, 3, 5 (the lowest is 0) turn the opposite
  # way at the same speed. The shift is not alternated.
  alternate_turns: true
  # Ticks between redraws.
  redraw_period_ticks: 4

# THE MAGE'S GATE (step F6). A hit while he cannot be hurt is refused whole, and the attacker hears this.
mage:
  # The mob file the fixture spawns (content/mobs/).
  mob: dark_mage
  # SEAT PLACEHOLDER: the refused-hit cue, at the Mage.
  refused_sound: item.shield.block
  refused_volume: 1.0
  refused_pitch: 0.8
  # Ben's, 2026-11-19: "Add a lightning strike to the mage landing". A bolt struck at the spot he lands on, on the
  # landing's tick: an EFFECT ONLY (SEAT READING: it hurts nobody and sets nothing alight). false turns it off.
  landing_lightning: true

# THE DRAGON (step F9). The arena's fight only: an ordinary-world fight has none.
dragon:
  # The mob file it is spawned from (content/mobs/), at gear score 100.
  mob: ender_dragon
  # Ben's, 2026-11-18 ("let's do 80 60 40 and 20 percent"): each fraction of its maximum it falls STRICTLY BELOW lands
  # one Mage. One hit across two lands two, one after the other: the next only once no Mage is alive and the ring is
  # home (the seat's mechanism ruling). Strictly falling, each strictly between 0 and 1.
  mage_thresholds: [0.80, 0.60, 0.40, 0.20]
  # Its death is the win: the participants are told at once, and this many ticks later the arena's normal end returns
  # them (SEAT PLACEHOLDER, the brief's 200).
  win_return_ticks: 200
  # The boss bar every participant sees, titled with its name and tracking our store (SEAT PLACEHOLDER: purple).
  boss_bar_color: purple
  # ITS ATTACKS (F9b, section 4). Ben, 2026-11-19: "Yes those numbers are fine to start with" (the seat's suggestion).
  # Each is a mob's base hit: scaled by its gear score as any mob's hit is (at 100, as written) and reduced by armour.
  # A bite is a hit from its head or neck; a wing, from a wing (its push stays vanilla's).
  bite: 80.0
  wing: 40.0
  # The perched breath, per second of standing in it: each of the cloud's hits is this x its interval / 20.
  breath_per_second: 30.0
  # F9b fix A (the seat's brief of 2026-11-19; SEAT PLACEHOLDER, FLAGGED FOR BEN, his to change): a player takes at
  # most ONE bite or wing hit (together) from the dragon per this many ticks. The first boot's bite landed twice a tick
  # and killed him in four. The breath is not counted here: it keeps its cloud's own cadence.
  contact_hit_interval_ticks: 20

# THE CRYSTALS (step F7). SEAT PLACEHOLDER spots, standing in for the pillars until the arena exists: crystal_count
# spots evenly round a circle about C.
crystals:
  ring_radius_blocks: 40.0
  height_above_ground_blocks: 12.0
  # SEAT PLACEHOLDER: the cue as each crystal lights, at the crystal, heard by every participant.
  lit_sound: block.beacon.power_select
  lit_volume: 1.0
  lit_pitch: 1.0

# THE FIGHT'S OWN WORLD AND ITS GENERATED STAND-IN ARENA (step F8b; Ben, 2026-11-18: "Yes that's fine for now"). One
# temporary world per fight, deleted at its end; replaceable later by a file Ben builds (the template source is not built
# yet). EVERY NUMBER HERE IS A SEAT PLACEHOLDER. The world's namespace, folder prefix and marker are in Java on purpose:
# a typo here must never be able to point a delete at another namespace.
arena:
  # The arena's centre column: (0, 0) of its world, because the dragon orbits (0, 0) whatever we set (PLAN section 4 c).
  centre_x: 0
  centre_z: 0
  # The floor's TOP block. A player stands at 65.
  floor_y: 64
  # An end-stone disc: every column with dx^2 + dz^2 <= radius^2, this many blocks thick.
  disc_radius_blocks: 56
  disc_thickness_blocks: 3
  # Obsidian pillars, square, this wide (odd), their centres round this circle, pillar 1 due east; crystal n on pillar n,
  # so the count must equal settings.crystal_count.
  pillar_count: 10
  pillar_ring_radius_blocks: 40.0
  pillar_width_blocks: 3
  # Their top block this far above the floor's top.
  pillar_top_above_floor_blocks: 12
  # The sky, in a NORMAL world: fixed at midnight, weather clear. An END world's time is fixed by its type (READ:
  # the_end has has_fixed_time), so this is not applied there.
  time_of_day_ticks: 18000
  # F9c (Ben, 2026-11-19: "yes let's try it"): the fight world's environment. end gives the End's sky; vanilla's own
  # dragon fight is made inert by a per-world Paper switch written before the world is made, checked after it, and if
  # the check fails the fight runs in a normal world instead. normal is the night-sky arena.
  environment: end
  # F9d c (the seat's brief of 2026-11-19; SEAT PLACEHOLDER): when no participant is alive inside and at least one
  # is down, the fight has FAILED, and this many seconds later everyone is sent home in the mode he entered in (Ben:
  # "they are all in spectator mode for a few seconds and get sent back to the normal world").
  all_down_seconds: 5
  # Where an entering player stands, blocks from the centre [dx, dz].
  entry_offset_blocks: [0.0, 0.0]

# THE REVIVE (step F9e). Ben, 2026-11-18 (PLAN-dragon-fight.md section 1, 0d and 0e): "When they die, a copy of them is
# on the floor. Another player has to hold shift/crouch on top of that players copy for 3 seconds to respawn them."
# "2. 50% health / 3. No / 4. No but we will add modifiers to change that later".
revive:
  # SEAT PLACEHOLDER (Ben's "on top of"): how near the copy a reviver must sneak, blocks.
  revive_radius_blocks: 1.5
  # Ben's "3 seconds": unbroken sneaking that revives. Taking damage is not a break (Ben: "No").
  revive_seconds: 3
  # Ben's "50% health": his health on revive, of his maximum.
  revive_health_fraction: 0.5
  # Ben's "No" (no limit yet): max_revives is absent, so a player may be revived any number of times. A whole number
  # here would be the most revives per player per fight.
  # SEAT PLACEHOLDER wording: the line above his copy. {player} and {seconds} are filled in.
  label: "{player} is down: sneak on them for {seconds} seconds to revive"

# The dev fixture's own rule (GATE-fight-ring.md): who takes part in an ORDINARY world.
fixture:
  # Players in C's world within this many blocks of C, in survival or adventure.
  participant_radius_blocks: 128.0
