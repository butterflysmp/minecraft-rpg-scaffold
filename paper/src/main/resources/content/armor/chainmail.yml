# Chainmail armor.
#
# See diamond.yml for the file shape and for what 'defense:' is: the piece's Defense (A1, 2026-11-25).

rarity: common

flavor:
  - "Ten thousand rings, and every one of them someone's afternoon."

# THE SET BONUS (B1): all four of this file's pieces worn. Not scaled by gear score (B4, Ben: "No it's flat").
# A PERCENT of the held weapon's quiver, half-up (Ben: ".5s round up"), applied after its flat bonuses (SEAT PLACEHOLDER):
# the Breacher's 2 becomes 3, Dragon's Breath's 5 becomes 8. (It was STOPPED until 2026-11-25, the quiver stat being
# additive only; the seat's Q1 gave it a percent term.)
set_bonus:
  - type: quiver_size_percent
    value: 50                      # BEN 2026-11-25

pieces:
  head:
    material: chainmail_helmet
    craft_result: chainmail_helmet
    display_name: "Chainmail Helmet"
    defense: 5  # BEN 2026-11-25 (was vanilla's 2)
  chest:
    material: chainmail_chestplate
    craft_result: chainmail_chestplate
    display_name: "Chainmail Chestplate"
    defense: 8  # BEN 2026-11-25 (was vanilla's 5)
  legs:
    material: chainmail_leggings
    craft_result: chainmail_leggings
    display_name: "Chainmail Leggings"
    defense: 7  # BEN 2026-11-25 (was vanilla's 4)
  feet:
    material: chainmail_boots
    craft_result: chainmail_boots
    display_name: "Chainmail Boots"
    defense: 4  # BEN 2026-11-25 (was vanilla's 1)
