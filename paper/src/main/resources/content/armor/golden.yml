# Golden armor.
#
# See diamond.yml for the file shape and for what 'defense:' is: the piece's Defense (A1, 2026-11-25).
#
# The MATERIAL TOKEN IS 'golden_', not 'gold_'. Minecraft's item ids say golden_helmet while the
# block and ingot say gold. Getting this wrong does not crash: ArmorItems.materialOf falls back to
# the leather item for the slot, so the tier would quietly mint as leather with a golden name.
# ArmorConsistency is what catches it, by reporting a material that does not resolve.
rarity: common

flavor:
  - "It buys goodwill from things that cannot spend it."

# THE SET BONUS (B1): all four of this file's pieces worn. FLAT (Ben: "No it's flat").
# mana_regen is per second (Ben: "this is every second"). Its TOOLTIP reads in the stats sheet's unit, "+10 Mana Regen/5s"
# (Ben, 2026-11-27: "The golden set should also"; the seat's U1): the strength is unchanged, 2 per second.
set_bonus:
  - type: mana_regen
    value: 2                      # BEN 2026-11-25

pieces:
  head:
    material: golden_helmet
    craft_result: golden_helmet
    display_name: "Golden Helmet"
    defense: 5  # BEN 2026-11-25 (was vanilla's 2)
  chest:
    material: golden_chestplate
    craft_result: golden_chestplate
    display_name: "Golden Chestplate"
    defense: 8  # BEN 2026-11-25 (was vanilla's 5)
  legs:
    material: golden_leggings
    craft_result: golden_leggings
    display_name: "Golden Leggings"
    defense: 7  # BEN 2026-11-25 (was vanilla's 3)
  feet:
    material: golden_boots
    craft_result: golden_boots
    display_name: "Golden Boots"
    defense: 4  # BEN 2026-11-25 (was vanilla's 1)
