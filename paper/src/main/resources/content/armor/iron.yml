# Iron armor -- the middle of the starter band.
#
# See diamond.yml for the file shape and for what 'defense:' is: the piece's Defense (A1, 2026-11-25).

# Common. The four starter tiers (leather, chainmail, iron, golden) all sit here: they are what a
# player has before they have anything, and a rarity tier that everything starts with is not a
# distinction worth colouring differently. RarityColors maps COMMON to WHITE.
rarity: common

flavor:
  - "Honest plate. It has no opinion about who wears it."

# THE SET BONUS (B1): all four of this file's pieces worn. FLAT (Ben: "No it's flat").
# Max health: gaining it is headroom, losing it clamps (HealthState).
set_bonus:
  - type: max_health
    value: 100                      # BEN 2026-11-25

pieces:
  head:
    material: iron_helmet
    craft_result: iron_helmet
    display_name: "Iron Helmet"
    defense: 10  # BEN 2026-11-25 (was vanilla's 2)
  chest:
    material: iron_chestplate
    craft_result: iron_chestplate
    display_name: "Iron Chestplate"
    defense: 16  # BEN 2026-11-25 (was vanilla's 6)
  legs:
    material: iron_leggings
    craft_result: iron_leggings
    display_name: "Iron Leggings"
    defense: 14  # BEN 2026-11-25 (was vanilla's 5)
  feet:
    material: iron_boots
    craft_result: iron_boots
    display_name: "Iron Boots"
    defense: 8  # BEN 2026-11-25 (was vanilla's 2)
