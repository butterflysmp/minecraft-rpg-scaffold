# THE SKREEL'S MOUNT, a big spider (PLAN-dragon-mobs.md). R1 built its BODY; step R8 pairs it: /rpg spawn skreel spawns
# a Skreel riding one. /rpg spawn withered_mount alone still spawns a plain mount, with its own speed.
#
# ITS ID AND NAME ARE THE OLD GAME'S AND ARE BEN'S TO CHANGE: the plan's question Q25 asks whether "Withered Mount"
# should stay now that the fight is Void.

base_entity: spider
display_name: "Withered Mount"

# THE QUANTITY: authored health, x GS/100 and never x5 (M4). The seat's 160, accepted by Ben 2026-11-17 (cfde822 120).
max_health: 160

# scale: the value of the SCALE attribute, 1.5x a spider (cfde822's).
scale: 1.5

# THE RIDDEN SPEED: a MULTIPLIER of its movement speed that applies ONLY ONCE A RIDER OF OURS HAS BEEN ON IT. The seat's
# 1.3x with its rider (cfde822's "x1.3 while paired"). It is a TRANSIENT modifier added when the pair is made (never
# saved onto the mob, never its base), so a mount spawned alone moves at a spider's own speed. If its rider dies or is
# separated from it, it KEEPS the 1.3x: Ben's accepted text says the mount "carries on as a plain fast spider" (the
# seat's reading of "fast"). R1 authored this as a permanent base speed; that ends here.
ridden_speed: 1.3

# NO ELEMENT, on purpose. Ben, 2026-11-15: "No it's no element". (A spider is not in content/mob_elements.yml, so it
# has none from the table either.) Its death feeds no Phage.
