# THE PHAGE: one name, five stages, on a creeper (PLAN-dragon-mobs.md, Ben's rework of 2026-11-15).
#
# Ben: "Both are called Phage. The distinction is between size." Stage 1 is small and fast; stage 5 is about three
# blocks tall and very slow. A stage is STATE ON THE LIVE MOB (its mob_stage tag), never a separate file. Spawn one
# at a chosen stage with /rpg spawn phage stage <n> (default 1).
#
# WHAT R1 BUILT: the five stage bodies. R2 added the split, the growth step its growth, and R3 its blast (below).
#
# IT EXPLODES OURS, FROM R3. Vanilla's swell is still its fuse (Ben kept vanilla's numbers), but vanilla's explosion
# is refused every time, and ours runs in its place: no blocks broken, players hurt, the Phage removed without dying.
# Flint and steel cannot ignite it and lightning cannot charge it, as in R1.

base_entity: creeper
display_name: "Phage"

# ELEMENT: Void. IDENTITY ONLY today. A Phage is Void and is fed by Void deaths (Ben, H).
element: void

# STAGES. Content gives the count and the FIRST and LAST bodies; every stage between is linear (G3, confirmed by Ben):
#
#   stage:   1      2      3      4      5
#   height:  1.0    1.5    2.0    2.5    3.0    blocks
#   speed:   1.5x   1.25x  1.0x   0.75x  0.5x
#   health:  80     100    120    140    160
#
# NAME THE QUANTITY:
#   height      the body's HEIGHT IN BLOCKS, the unit Ben ruled in ("from 1 block to 3 blocks in height"). The plugin
#               turns it into the SCALE that produces it from the creeper's own unscaled height (1.7), so 1.0 is
#               scale 1/1.7 and 3.0 is 3/1.7; the width scales with it.
#   speed       a MULTIPLIER of a creeper's DEFAULT movement speed, never an absolute speed.
#   max_health  authored health: x GS/100, never x5 (PLAN-mob-scaling.md M4, GS from M25).
#
# A staged mob authors NO top-level max_health, scale or speed: its stages own them, and the loader refuses both.
stages:
  count: 5
  first: { height: 1.0, speed: 1.5, max_health: 80 }
  last:  { height: 3.0, speed: 0.5, max_health: 160 }

# THE SPLIT (dragon-mobs step R2). When a Phage at its LAST stage dies, of ANY cause (Ben: "Any deaths"), it leaves
# `count` children at `child_stage`, each at FULL health for that stage and with the parent's gear score (Ben:
# "gearscore should be the same as the parent Phage"). Its own death does not grow them (Ben: "No,").
#
# NAME THE QUANTITY:
#   at           which stage splits. Only `last` is accepted: Ben ruled "Only the 5th stage Phage splits".
#   count        how many children, a whole number of mobs.
#   child_stage  the stage each child is born at; one of the stages above.
#   spread       BLOCKS from the parent to each child, along one axis: two children stand at -0.5 and +0.5. The old
#                game's offset, put to Ben as a starting number; NOT YET CONFIRMED by him. A child whose spot is
#                inside a block is born at the parent's own spot instead.
#
# NOT A DEATH, so no split: a despawn, a chunk unload, or being removed by a command or a plugin. An EXPLOSION never
# splits it either (Ben, E: "it only splits when killed, not exploding"): every vanilla explosion is refused, and our
# own detonation (blast, below) removes the Phage without a death.
split:
  at: last
  count: 2
  child_stage: 1
  spread: 0.5

# GROWTH (the plan's step R4). When a creature of `element` dies within `radius` of a living Phage below its last
# stage, of ANY cause (Ben: "Any deaths"), that Phage gains `stages_per_death` stages; EVERY such Phage in range does
# (G2). Ben: "Start with 4, let's try 6 block radius." One death is one stage (G1), so four deaths take a stage 1 to 5.
# A grown Phage keeps the SAME SHARE of its health (Ben: "Same share"), its gear score, and its target. A stage 5 does
# not grow, and a Phage that grows to 5 splits when it dies like any other. Nothing caps it (Ben, answer D).
#
# NAME THE QUANTITY:
#   element            whose deaths count: void. Our Void mobs by their own file; a vanilla Enderman by
#                      content/mob_elements.yml (Ben: "normal Vanilla Enderman are also Void"). The mount, a zombie
#                      and a player count for nothing.
#   radius             BLOCKS, the straight-line distance between the two creatures' feet, INCLUSIVE at exactly 6,
#                      same world only. A sphere, never a cube.
#   stages_per_death   stages gained per counted death; capped at the last stage.
#
# A stage 5's own death splits it AND counts as a Void death: it grows the OTHER Phages near it, never its own two
# children (Ben: "No,"). A Phage's self-destruct counts too (Ben, I): one blast is one Void death, and the Phage that
# blew never grows itself.
growth:
  element: void
  radius: 6
  stages_per_death: 1

# THE BLAST (dragon-mobs step R3). Ben: "for the explosion keep vanilla creeper numbers for everything except the
# damage". The damage is the seat's PROVISIONAL proposal (P-a, P-b), NOT YET BEN'S RULING.
#
#   stage:   1      2      3      4      5
#   damage:  20     27.5   35     42.5   50     before gear score; linear between first and last (as G3 has the body)
#
# NAME THE QUANTITY:
#   radius       BLOCKS, the straight-line distance between the Phage's FEET and the victim's FEET, INCLUSIVE at exactly
#                3, same world. A sphere. 3 is vanilla's creeper number, but vanilla's 3 is an explosion POWER whose
#                damage reaches twice as far with falloff (PLAN-dragon-mobs.md section 8 F2, Q33). Here, every victim
#                inside it takes the FULL damage and nothing outside takes any (P-c): no falloff, no cover, no push.
#   damage       AUTHORED damage at the first and last stage, x gear score / 100 as the Phage's health is (P-b), never
#                x5. It lands on the same path a mob's melee hit takes, so the player's defence cuts it as it cuts a
#                melee hit. It wears NO element today (whether it is Void damage is Ben's question, Q31).
#   fuse_ticks   TICKS from the swell's start to the blast, vanilla's 30 (1.5 seconds), written to the creeper with
#                Creeper#setMaxFuseTicks at spawn. The swell starts within 3 blocks of a target and cancels past 7 or
#                out of sight: those two distances are vanilla's own and are NOT authored here (they cannot be until
#                the swell is replaced; the seat's ruling 20).
#
# VICTIMS: players only, today (Ben: "Only players and Summons"). No mob is hurt, a Phage included. A creative or
# spectator player is not hurt.
blast:
  radius: 3
  damage: { first: 20, last: 50 }
  fuse_ticks: 30
