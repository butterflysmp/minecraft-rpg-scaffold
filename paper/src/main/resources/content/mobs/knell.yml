# The first custom mob, and the proof of the whole mechanism: an identity that is DISTINCT from the
# vanilla entity it spawns as.
#
# The Knell is a wither skeleton with 360 HP. An ordinary wither skeleton is still an ordinary wither
# skeleton with 20 -- because a custom mob is keyed by the mob_id PDC tag on the SPECIFIC entity that
# was spawned, never by its entity type. Keying on type would scale every wither skeleton on the
# server, which is the bug this design exists to make impossible.
#
# Spawn it with /rpg spawn knell. That path tags the entity BEFORE it enters the world, which is
# load-bearing: the seed runs on the entity-add event, and a tag applied afterwards would arrive to
# find the mob already seeded from vanilla.

# The id is the filename (knell.yml -> knell), as with every other content type.

# REQUIRED, and deliberately not defaulted. Rarity defaults to common and material defaults to a
# sword because a wrong guess there is cosmetic; a wrong guess at which creature to spawn is not.
# Must name a LIVING entity -- `arrow` is a real entity type and would spawn nothing killable, so
# ContentValidator rejects it by name at boot rather than at the first /rpg spawn.
base_entity: wither_skeleton

# Set as the entity's REAL CustomName at spawn, so death messages and /data read "Knell". Its HP is
# NOT part of the name -- the health bar stays a per-viewer packet override, so a nameplate can never
# leak into a death message.
display_name: "Knell"

# The custom health store is uncapped, so this is the same mechanism at 360 as at 5000 -- vanilla's
# 1024 attribute cap does not apply, because nothing here touches the vanilla attribute. A boss is
# a bigger number in this field, not a different feature.
#
# THE QUANTITY: authored health. The seed multiplies it by GS/100 and never by 5 (PLAN-mob-scaling.md M4), so in
# the End within 1,000 blocks of (0, 0) it is x3 (M25). UNCHANGED by dragon-mobs step R1: Ben did not choose between
# the old game's 480 and this 360, so the seat ruled it stays as it ships (PLAN-dragon-mobs.md, K3).
max_health: 360

# BODY (dragon-mobs step R1; Ben's starting values from the old game, 2026-11-15, his to tune).
# scale: the value of the SCALE attribute. 1.6 is 1.6x a wither skeleton in every dimension, hitbox included.
scale: 1.6
# speed: a MULTIPLIER of a wither skeleton's DEFAULT movement speed, never an absolute speed.
speed: 0.6

# ELEMENT: an id in content/elements/. IDENTITY ONLY today: it types none of the Knell's damage and resists nothing.
# What asks it first is the Phage's growth (a Void death nearby grows a Phage). Ben, 2026-11-15: the whole fight is
# Void.
element: void

# THE BEAM (dragon-mobs step R5). Ben, 2026-11-17, asked whether it may start from the old game's numbers (every 5 to
# 10 seconds, a 0.6-second warning, 40 blocks, 35 damage): "yes". Each is his starting number to tune. Every behaviour
# he did not re-rule is the old game's, listed with its mark in PLAN-dragon-mobs.md section 3.R.1.a.
beam:
  # TICKS from the Knell appearing (a spawn or its chunk loading), from a fire, or from an attempt that found no one,
  # to its next attempt: a whole number drawn evenly from min to max, both included. 20 ticks = 1 second.
  cycle_ticks: { min: 100, max: 200 }
  # TICKS from the lock (the line is fixed: the Knell's eye through the target) to the fire. The Knell is rooted for
  # all of it. Ben, 2026-11-17 (KNELL 3): "change the warning shot time from 1.3s to 1s" = 20 ticks (was 26).
  telegraph_ticks: 20
  # The telegraph TICKS (0 = the lock) on which the purple warning line is drawn. The seat's 0 and 15, NOT BEN'S: the
  # second flash three quarters through, as before. Each must be inside the telegraph.
  flash_at: [0, 15]
  # BLOCKS from the Knell's EYE. A target is in range when its aim point is at most this far away; the fired beam
  # runs this far along the locked line unless a block stops it.
  range: 40
  # A FRACTION of the target's height above its feet: the point the line is locked through (the old game's 0.6).
  aim_height: 0.6
  # BLOCKS the target's body (its hitbox) is grown by on EVERY side before the beam is tested against it. The old
  # game's 1.0. NOT ASKED of Ben (K9): a starting number, recorded as such.
  tolerance: 1.0
  # The AUTHORED damage, before gear score and before the victim's defence. Ben, 2026-11-17, after the boot: "For
  # damage I think 65 is good" (was 35). It is x gear score / 100, as a custom mob's hit is (the seat's provisional, as
  # the Phage's blast). No element, no knockback, no shield block.
  damage: 65
  # THE SOUNDS (KNELL 3, 2026-11-17). Ben: "Start playing the resonance at the same time as the bell". Each is a sound
  # EVENT key as vanilla's sounds.json names it (an unknown key is refused at load, by name), the VOLUME and the PITCH
  # passed to the client. The client picks one of the event's files and multiplies our pitch by that file's own; the
  # server cannot know which it drew. Both lists play at a fixed POSITION (the Knell's, at that tick): a sound already
  # sent keeps ringing whatever then happens to the beam or the Knell.
  sounds:
    # Played at the telegraph's tick 0, the lock: the bell STRIKE and the RESONANCE (3.780 s, 4.200 s or 4.447 s as the
    # client draws it), together; the resonance rings whether or not the beam will hit. BEN'S (2026-11-17): the first
    # bell is LOWER ("Maybe even lower the pitch of the initial bell"); the 0.8 is THE SEAT'S starting value (was 1.0).
    # A lower pitch LENGTHENS a sound and a higher one shortens it: the bell's file is 2.492 s, so 2.492 / 0.8 = 3.115 s
    # here, still assuming playback speed equals pitch (not read). Volumes kept (1.0 and 1.4).
    telegraph:
      - { key: block.bell.use, volume: 1.0, pitch: 0.8 }
      - { key: block.bell.resonate, volume: 1.4, pitch: 1.0 }
    # Played at the fire: a SECOND, HIGHER bell, then the amethyst chime. BEN'S: that there is one ("Add a second,
    # higher pitched bell for the actual shot"); the 1.5 is THE SEAT'S starting value (2.492 / 1.5 = 1.661 s, the same
    # assumption), at the first bell's volume. The chime is the seat's, as before.
    fire:
      - { key: block.bell.use, volume: 1.0, pitch: 1.5 }
      - { key: block.amethyst_block.chime, volume: 1.0, pitch: 1.0 }

# THE TELEPORT AFTER THE BEAM LANDS (dragon-mobs step R6). Ben: "The Knell can only teleport when it's Knell Beam hits
# a target"; "a degree arc from the player would be nice. Maybe between 30 and 70 degrees"; "The hit itself is the
# warning". A miss, an arrow, melee or any other damage moves nothing. It lands on the circle around its TARGET's feet,
# at the horizontal distance it stood, turned 30 to 70 degrees to a random side (PLAN-dragon-mobs.md section 5.R.6).
teleport:
  # TICKS from the beam's FIRE (the hit) to the move. BEN'S 28, 2026-11-17 (KNELL 4): "let's try 1.4 seconds after the
  # shot" = 28 ticks, after he heard the seat's 44 land about a second after the ringing stopped. Counted from the
  # FIRE, and NOT derived from any sound's length: it is his number, tuned by ear. It must be shorter than
  # cycle_ticks.min (100; 72 to spare), so a move never falls inside the next telegraph; a longer one is refused at
  # load.
  delay_ticks: 28
  # DEGREES around the target, measured at the target's feet from the Knell's own bearing, both included. Ben's 30
  # and 70, starting numbers.
  arc_degrees: { min: 30, max: 70 }
  # How many landing spots are tried on the chosen side before the other: one random angle, then the rest spread
  # evenly across the arc. If none on either side will do, the Knell stays put. The seat's 5, NOT YET BEN'S (T-a).
  spots_per_side: 5
  # Whole BLOCKS above or below the target's feet the landing may stand; the nearest standing height wins. The
  # seat's 3, NOT YET BEN'S (T-b).
  level_tolerance: 3
  # A landing must SEE the target (from the Knell's eye there to the target's aim point; blocks stop sight as they
  # stop the beam), so it never lands behind a wall. The seat's yes, NOT YET BEN'S (T-c, Q18).
  require_sight: true
#
# NOT YET HERE: gear (the old game's diamond set and sword) is deferred past R1, so the Knell still spawns bare and
# hits like a bare wither skeleton (M17, parked).
