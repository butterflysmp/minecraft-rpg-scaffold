# THE CASCADING LOOT TABLE (PLAN-loot.md; Ben, 2026-11-19: "First the rarest rarity is rolled. then if that doesn't
# land, the next rarest rarity is rolled and so on. In our world today, that would look something like this: Exotic 1%
# then Legendary 3% then Epic 8% then Rare 12% and so on. Numbers are place holders.").
#
# NOTHING IN THE GAME ROLLS THIS YET: no mob, chest, fight or command is wired to it. The Loaded line prints each tier's
# written chance and its TRUE odds (its chance times every miss above it), so the written 3% and the real 2.97% are both
# visible.
#
# Layout (CC's proposal, flagged):
#   default:  the one cascade, rarest to commonest, each a rarity and a chance in [0, 1]. Only the last tier may be
#             guaranteed (chance 1.0).
#   sources:  each drop source by id. Its own `tiers:` override the default's chances (absent: the default's), and its
#             `pools:` name, per rarity, the item ids it can give. A rarity that lands with no pool falls through to the
#             next tier.
default:
  tiers:
    # Ben's placeholders.
    - rarity: exotic
      chance: 0.01
    - rarity: legendary
      chance: 0.03
    - rarity: epic
      chance: 0.08
    - rarity: rare
      chance: 0.12
    # SEAT PLACEHOLDERS (Ben's "and so on"), not Ben's.
    - rarity: uncommon
      chance: 0.20
    - rarity: common
      chance: 0.40
sources: {}

# DEV ONLY (the seat's queue, item 6): an EXAMPLE source for `/rpg loot roll`, loaded ONLY on a dev server and used by
# nothing in the game. It is named so it cannot be mistaken for a drop source: every dev source starts dev_, and no real
# source may. Its pools are existing items, each under its own rarity, for every rarity that has any. There is NO EPIC
# pool, because no content is epic today, so an epic that lands is SKIPPED and the roll goes on (Ben, 2026-11-19:
# "general skip that rarity"), where the command's counts show it. The four dev weapons (hunters_bow, ironblade,
# quiver_stone and emberblade) were deleted 2026-11-21 and are not in any pool: emberblade was in the rare pool until
# then, and LootLoader refuses the WHOLE file for an item id that does not ship. volley_stone is the only exotic left,
# and is on its way out by another route. ember_staff, a dev weapon too, was deleted the same day on Ben's word ("The
# Ember staff is also a dev weapon and should be slated for deletion", feat/ember-staff-deleted) and left the rare
# pool, which holds four. knell_beam (2026-11-21, feat/knell-beam) is the first EPIC item, so "no content is epic
# today" above is no longer true; it joins NO pool (Ben: "It will be a dragon drop later"), so this source still has no
# epic pool and an epic that lands is still skipped.
dev_sources:
  dev_example_not_a_drop:
    pools:
      exotic: [volley_stone]
      legendary: [blaze_kings_staff, dragons_breath, dragons_plume]
      rare: [locust, brawlers_gauntlet, fletchers_quiver, sages_scroll]
      uncommon: [boltor, cursed_emerald, lapis_staff, withered_shortbow, keen_charm, mending_charm, ward_charm]
      common: [flint_staff, short_bow]
