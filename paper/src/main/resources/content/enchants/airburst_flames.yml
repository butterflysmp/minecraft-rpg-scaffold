# AIRBURST FLAMES -- Ben's first WEAPON-SPECIFIC enchant, the Living Lantern's (the seat's brief of 2026-11-23, PR E).
# Ben, verbatim: "The enchant is called Air Burst Flames. It splits into three faster not homing projectiles after 12
# blocks of travel." / then: "I want air burst flames to go to 14 blocks instead then. ... The Air Burst Flames projectile
# goes the 14 blocks and then those projectiles go an additional 14 blocks." / "3. 25/30/35 damage each burst" / "5.
# Doesn't split if it hits something first" / "Also side note: The name of the enchantment is Airburst Flames".
#
# WHAT IT DOES (core CastExecutor.launchToSplit, while it is the ACTIVE candidate of the lantern's weapon slot at level 1
# or more): the lantern's shot homes as it always does (living_lantern.yml) until it has TRAVELLED 6 blocks (BEN, 2026-11-23; was 14), which at
# its 0.35 a tick is 18 steps, 6.3 blocks (EnchantBehaviour.Airburst.ticksToTravel, executed). If it has hit nothing -- no mob, no
# block -- it ends there and three bursts leave that point, each seeking for itself (BEN, 2026-11-23; was never homing), each a further 14 blocks at 0.7 a tick (20
# steps), each a PRIMARY hit of the level's damage in fire IN PLACE of the 45, with the shot's other on_hit effects (its
# hit visual) and fire's burn. A shot that hits anything first lands its 45 and never splits. The bursts never split.
#
# SIDEWAYS (SplitBasis.sidewaysOf): horizontal and perpendicular to the shot's direction of travel at the split, on his
# right-hand side; straight up or down, the right of the aim he fired with. The three are the centre (straight on) and
# one 12 degrees either side (SpreadPattern, count 3).
#
# NAME THE QUANTITY: it reads the lantern's projectile SPEED (0.35, authored, non-zero) and replaces its damage; the
# eligibility half is `weapon: living_lantern`, the one weapon whose shot it was designed for (W1).
display_name: "Airburst Flames"            # BEN: "The name of the enchantment is Airburst Flames"
icon: fire_charge                          # SEAT PLACEHOLDER 2026-11-23 (B7)
max_level: 3                               # BEN: three damages, so three levels
effect: airburst
class: universal                           # the loader holds a weapon-specific enchant to its weapon's class or universal
weapon: living_lantern                     # W1: weapon-specific, the Living Lantern's slot 0
ability_description:                       # T7 (2026-11-26): replaces the Lantern's Breath prose while active. SEAT PLACEHOLDER 2026-11-26, OPEN FOR BEN
  - "A seeking flame that splits"          # "three" is this enchant's own count, which no enchant changes: authored, not a token
  - "into three after 6 blocks."
airburst:
  travel_blocks: 6                         # BEN, 2026-11-23: "B" -- "Split after 6 blocks into 3 pieces; pieces keep their 14." (was 14)
  count: 3                                 # BEN: "three ... projectiles"
  angle_degrees: 12                        # SEAT PLACEHOLDER 2026-11-23: the old repo's spread, 12 degrees apart
  speed: 0.7                               # SEAT PLACEHOLDER 2026-11-23: "faster" (BEN) read as double the lantern's 0.35
  burst_travel_blocks: 14                  # BEN: "an additional 14 blocks"
  damage_by_level: [25, 30, 35]            # BEN: "25/30/35 damage each burst"
  element: fire                            # the lantern's element
  homing:                                  # BEN, 2026-11-23: "I want the Airburst Flames to seek as well." Each burst seeks for itself
    lerp: 0.45                             # SEAT PLACEHOLDER 2026-11-23: the Living Lantern's own
    activation_blocks: 0                   # SEAT PLACEHOLDER 2026-11-23: the Living Lantern's own (from the split point)
    search_radius: 7                       # SEAT PLACEHOLDER 2026-11-23: the Living Lantern's own
