# DEV ONLY (the seat's brief of 2026-11-23, THE UNIQUE ENCHANT SLOT): an EXAMPLE unique enchant, so a gate can read a
# FILLED unique slot before Ben designs the real ones (Ben: "I will get to this" / "I will give you unique enchants soon").
#
# NOT CONTENT. It loads ONLY on a dev server: EnchantLoader skips every file whose id starts dev_ unless the dev-server
# marker (-Drpg.dev=true, SelfTestGuard.DEV_PROPERTY, set only by scripts/dev-server.sh) is set, in the manner of loot/cascade.yml's dev_sources, and no
# real enchant may start dev_. On a real server it is not registered at all: it cannot roll, be granted or be named.
#
# Kinetic, so every kinetic weapon's unique slot offers it and nothing else (the unique pool holds this one enchant, so
# the cascade's count is capped at one). Universal class, and an existing effect (damage, the effect Sharpness, Power and
# Attunement share), so no new mechanism exists for it. Its name and numbers are a dev fixture's, not Ben's, and are
# deleted with this file when his first unique enchants land.
