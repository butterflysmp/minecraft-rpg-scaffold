# LAPIS CRYSTAL -- the Lapis Staff's weapon-specific enchant (the seat's brief of 2026-11-23, PR D; split D1/D2/D3 approved
# the same day). Ben, verbatim: "I have a weapon specific enchant for the Lapis Staff: Lapis Crystal. This adds a new left
# click ability to the lapis staff that throws an orb out about 12 blocks in the direction the player is looking and it
# floats there for 15s. Shooting this crystal with the Right Click ability will cause the crystal to shoot all enemies
# within a 8 block range for 20/30/40% of the damage of the right click. That number should be displayed in the actual
# number not the percentage." / "1. The orb stays for the entire duration 2. One orb at a time cooldown of 30s 3. Costs 30
# mana"
#
# D1, THIS FILE'S FIRST SHAPE: THE GRANTED TRIGGER. While Lapis Crystal is the ACTIVE candidate of the staff's weapon slot
# at level 1 or more, a LEFT CLICK with the staff casts the ability below (GrantedTriggers, WeaponFire). lapis_staff.yml
# declares no left_click and is not edited (READ: a left click with the staff did nothing of ours; WeaponFire returned
# empty and vanilla swung the breeze rod). The ability's id is lapis_crystal/left_click, so its 600-tick cooldown is its
# own, apart from the Lapis Beam's 20.
display_name: "Lapis Crystal"              # BEN
icon: heart_of_the_sea                     # SEAT PLACEHOLDER 2026-11-23 (B7)
max_level: 3                               # BEN: three percentages, so three levels
effect: grant_trigger
class: universal                           # the loader holds a weapon-specific enchant to its weapon's class or universal
weapon: lapis_staff                        # W1: weapon-specific, the Lapis Staff's slot 0
grant_trigger:
  input: left_click                        # BEN: "a new left click ability"
  ability:
    name: "Lapis Crystal"                  # SEAT PLACEHOLDER 2026-11-23: the enchant's name
    description:                           # SEAT PLACEHOLDER 2026-11-23
      - "Throws a lapis crystal"
      - "that floats where it lands."
    cooldown_ticks: 600                    # BEN: "One orb at a time cooldown of 30s" = 600 ticks
    cost:
      resource: mana
      amount: 30                           # BEN: "Costs 30 mana"
    # D2: THE ORB (CastSpec.Orb, CastExecutor.throwOrb). Thrown along his aim to 12 blocks, stopping 0.5 short of the
    # first solid block (a mob does not stop it); it flies 10 ticks, then rests 300 ticks counted from its arrival; one
    # per player, a new throw removing the old. Its body is an item marker (never saved, never picked up); removed on
    # expiry, his quit, his death, a world change and server stop, and swept where it appears if no live orb owns it.
    cast:
      type: orb
      range: 12                            # BEN: "throws an orb out about 12 blocks"
      flight_ticks: 10                     # SEAT PLACEHOLDER 2026-11-23: "about 10 ticks"
      life_ticks: 300                      # BEN: "it floats there for 15s", counted from arrival (SEAT PLACEHOLDER: from arrival)
      radius: 0.6                          # SEAT PLACEHOLDER 2026-11-23: how close a beam must pass to meet it (D3)
      item: heart_of_the_sea               # SEAT PLACEHOLDER 2026-11-23: its look
      # D3: THE CRYSTAL'S SHOTS (CastExecutor.meetsOrb, orbShots). HIS OWN Lapis Beam (a trigger of lapis_staff, the
      # weapon that granted the orb) passing within 0.6 of his resting orb BEFORE it reaches a mob or block stops there,
      # and the orb strikes every mob within 8 of itself (a true sphere, centre to its feet) that it has a clear line to,
      # each for the level's percent of the beam's AUTHORED damage read from the beam itself (21 today: never copied
      # here): 4.2 / 6.3 / 8.4. Secondary damage (B4): source lapis_crystal/crystal, never a hit, never himself, never a
      # player; it carries every term of the beam that set it off. The orb is not used up.
      shot:
        radius: 8                          # BEN: "all enemies within a 8 block range"
        percent_by_level: [20, 30, 40]     # BEN: "20/30/40% of the damage of the right click"
        element: kinetic                   # the beam's element (the seat's ruling)
