# SOLAR FLARE, THE FIRE RANGER'S ULTIMATE (Ben, 2026-11-27; the seat's Solar Flare brief F1 to F14, the same day).
# Replaces ultimate_placeholder_ranger, which is deleted (ranger_fire.yml names this as its ultimate and its default).
#
# BEN'S WORDS, VERBATIM, 2026-11-27: "It fires 3 giant fireballs in an arc that travel straight for about 15 blocks.
# Each fireball deals 250 damage and explodes in a 6 block range either when it hits something or at the end of its
# range". "2. That is the explosion damage, the whole area takes that damage. 3. Yes it takes all the damage." "1. 80
# mana and 3.5 minutes".
#
# CHANGED, BEN, 2026-11-28 (relayed by the seat, N1 to N7): "3. The Ranger Ultimate, instead of a fan of three fireballs,
# I want 3 fireballs one after another. 4. Increase the Fireball speed they're too slow, Increase the range to 32 blocks.
# 5. I want to change the particles to a firework-style explosion." Asked: "2. .5 seconds 3. 0.8 seconds for the 32
# blocks 4. yes 5. Instant, I'd like to mention I don't want a firework, I want a fireball that explodes like a
# firework".
#
# ONE AFTER ANOTHER (N1): `salvo:` below, three shots 10 ticks apart, launched on the cast's tick and 0.5 and 1 second
# after it, exact on the server's tick (X6 (a)). Each flies straight down HIS AIM AT THE MOMENT IT LEAVES (Ben: "yes"),
# from his eye at that tick: shot 1 the cast's aim, shots 2 and 3 his aim read on his own thread on their own ticks. Mana
# and the cooldown are taken ONCE, at the cast; the crit is rolled once, at the cast, for all three. Numbered 1 to 3 in
# launch order. NOT the engine's volley (READ: it re-rolls the crit per shot and its shots are no run's to end): the
# pulses' own scheduling, inside the burst's run, so his death, quit, world change, the stop, the selftest's clear and
# the pad's clean end the shots still to come.
#
# THE FLIGHT (N2): straight (gravity 0.0), 32 blocks in 0.8 seconds: speed 2.0 a tick, max_lifetime_ticks 16. READ,
# ProjectileFlight.step: the step at elapsed e traces from launch + 2e to launch + 2(e + 1) on the launch tick + e (the
# first inline), and the flight ends at launch + 32.0 on the launch tick + 15. Each step is ONE trace of its whole 2-block
# segment (READ, PaperCombatWorld.castRay -> CraftWorld.rayTrace: ServerLevel.clip over the segment for blocks, a ray
# against each body's box along the segment for bodies), so a step cannot pass through a thin wall or a body.
#
# WHAT STOPS IT (F2, unchanged): the first live body or solid block on a step. Fluids and passable blocks do not stop it;
# the caster never; a summon never (the sides table passes it). EVERY other living body does, a passive animal or another
# player included: OPEN FOR BEN.
#
# THE BURST (N3): INSTANT. ONE pulse front where the shot stopped with travel_ticks 0: every hostile within 6 blocks
# (horizontal, in the burst's box) is struck on the burst's own tick, 250 FIRE damage each, one struck set per burst. So
# three bursts in one place give a body 250 three times (Ben, 2026-11-27: "Yes it takes all the damage"); the 250 is
# unchanged (Ben was not asked to change it). The origin: on a MOB, the struck mob's own position; on a BLOCK, the point
# the trace met it; at the END OF RANGE, the end of the last step.
#
# THE LOOK (N4, F9): the body stays the fireball (a fire charge at scale 2.5, SEAT PLACEHOLDER) with its flame trail and
# its launch sound (SEAT PLACEHOLDERS). "A fireball that explodes like a firework": ROUTE B, built from particles and
# sounds, with NO firework entity (solar_flare_burst.yml says what it draws and why not a real firework).
#
# SCORCH: by the element (no status step here): each burst's 250 is FIRE damage, so its burn's cap is half the hit as
# declared, 125 for an uncrit 250 (a crit does not raise it), window 120, restarted by each hit. Ignite and the water rule
# apply as to every fire hit.
#
# WHO IT HITS (Ben: "7. Yes", hostile mobs only, no players, no summons, as Smolder): the sides table,
# MobHostility.PvpPath.PULSE (spared), and PLAYER -> SUMMON's "no". Never the caster.
#
# cooldown_ticks is a multiple of 4 (PLAN-build-system.md 2.4.1). 4200 ticks = 3.5 minutes.

id: solar_flare
display_name: "<gold>Solar Flare</gold>"
element: fire
cooldown_ticks: 4200

# THE BUILD MENU'S PROSE (F12, N7): SEAT PLACEHOLDER 2026-11-28, OPEN FOR BEN. Every number in it is this file's own, and
# SolarFlareContentTest holds each sentence to the number it states.
description:
  - "Fire three great fireballs, one after another."
  - "Each bursts within 6 blocks for 250 fire damage and scorches."

cost:
  resource: mana
  amount: 80

on_cast:
  - type: visual
    visual_id: solar_flare_cast   # the launch sound, at his eye, on the cast (SEAT PLACEHOLDER)

cast:
  type: projectile
  speed: 2.0
  gravity: 0.0
  max_lifetime_ticks: 16
  trail: solar_flare_trail        # SEAT PLACEHOLDER
  item: fire_charge               # SEAT PLACEHOLDER
  body_scale: 2.5                 # SEAT PLACEHOLDER
  salvo:
    count: 3
    interval_ticks: 10            # Ben: ".5 seconds"
  burst:
    radius: 6.0
    travel_ticks: 0               # instant (N3)
    pulse: solar_flare_burst      # its own firework burst and sound (N4, N5)

on_hit:
  - type: damage
    amount: 250
    element: fire
