# SMOLDER, THE FIRE MAGE'S ULTIMATE (Ben, 2026-11-27: "a rework of the old repo's Blaze Kings Staff secondary
# ability"; the seat's Smolder brief Z1 to Z11 and its rulings A1 to A6, the same day). Replaces
# ultimate_placeholder_mage, which is deleted (mage_fire.yml names this as its ultimate and its default).
#
# BEN'S NUMBERS, VERBATIM: "1. 160 Damage Per pulse. 2. 12 Block Radius 3. Mana Cost is 80, Cooldown is 300 Seconds
# 4. Each Pulse originates from the caster ... 8. Instead of one burst, it's a burst of 4 pulses every 3 seconds."
#
# RETUNED, BEN, 2026-11-28 (relayed by the seat, M1): "the mage ultimate is too slow, I want to double the speed the
# circle goes out as well as reduce the pulse times to every 1.5 seconds." So interval_ticks 30 (pulses at the cast and
# 1.5, 3 and 4.5 seconds: ticks 0, 30, 60 and 90 from the cast, exact on the server's tick since X6 (a)) and travel_ticks
# 15 (the 12 blocks in 0.75 seconds, 0.8 a tick; it was 30). count, radius, damage, mana and cooldown are unchanged.
#
# THE LOOK, BEN'S, 2026-11-28 (M2, M3): "a triple spiral originating from the player's feet", "One full turn to start",
# "I also want the particles to disappear faster". So `spiral:` below: three arms (NINE since Ben's next word, below),
# each winding one whole turn between his feet and the edge, drawn tick by tick AT THE FRONT'S OWN RADIUS (core.combat.PulseFront.spiralPoints, the radius
# function the hit compares), from the pulse's FIXED origin. Arm 0 starts due east and the arms wind clockwise seen from
# above (CC'S CALL, SEAT PLACEHOLDER 2026-11-28). The full ring is no longer drawn. The particles are TRAIL, which the
# server times: each lives 8 ticks (smolder_spiral.yml, SEAT PLACEHOLDER).
#
# NINE ARMS, BEN, 2026-11-28 (after the boot of 4f26ca31, SM7R: "yes, but there isn't enough particles now. Can we try 9
# spirals."; the seat's V1): `arms` 3 -> 9, and ONLY that number moved. Each arm is still one whole turn, its points 0.4
# apart along it, arm 0 due east, winding clockwise from above, the same particle for 8 ticks; the front, the hits and
# the pulse's puff are untouched. The arms are 40 degrees apart. EXECUTED (SmolderContentTest): 1027 points a pulse
# (three arms drew 343), 117 in the busiest tick, at most 738 alive at once.
#
# THE HIT IS STILL THE WHOLE CIRCLE, NOT THE ARMS (M2, OPEN FOR BEN): a body is struck once per pulse, on the tick the
# front's radius first reaches its horizontal distance from that pulse's fixed origin, wherever the arms are. Before
# Ben's change this was "the damage travels WITH the ring" (the seat's Z2, OPEN FOR BEN); the spiral is drawn with the
# same front, so the damage still arrives with the arms' tips, at every angle.
#
# SCORCH (Ben: "7. Yes it applies scorch"; the seat's A1): MET BY THE ELEMENT, with no status step here. Each pulse's
# 160 is FIRE damage, and fire damage applies Scorch by the element (content/elements/fire.yml applies_status scorch;
# ElementAccrual), as on every fire ability: the burn's cap is half the hit as declared (Scorch.CAP_FRACTION 0.5, so 80
# for an uncrit 160, and a crit does not raise it: the cap is taken with the crit divided out), its window
# Scorch.DEFAULT_DURATION_TICKS 120 (six seconds), restarted by each hit. DO NOT add `type: status, status_id: scorch`:
# that is a second route, capped at the UNHALVED 160, and the two would apply together.
#
# WHO IT HITS (Ben: "Every hostile. No Summons and No players for now just like the summoner weapon"): the sides table,
# MobHostility.PvpPath.PULSE (spared), and PLAYER -> SUMMON's "no". Never the caster.
#
# cooldown_ticks is a multiple of 4 (PLAN-build-system.md 2.4.1). 6000 ticks = 300 s.

id: smolder
display_name: "<gold>Smolder</gold>"
element: fire
cooldown_ticks: 6000

# THE BUILD MENU'S PROSE (Z9, N7): SEAT PLACEHOLDER 2026-11-28, OPEN FOR BEN. Every number in it is this file's own, and
# SmolderContentTest holds each sentence to the number it states.
description:
  - "Four pulses, 1.5s apart, burst from your feet."
  - "Each deals 160 fire damage within 12 blocks and scorches."

cost:
  resource: mana
  amount: 80

cast:
  type: pulses
  count: 4
  interval_ticks: 30
  radius: 12.0
  travel_ticks: 15
  pulse: smolder_pulse      # once at each pulse's origin, on its tick (the sound is here)
  spiral:
    arms: 9                 # Ben, 2026-11-28: "Can we try 9 spirals" (was 3)
    turns: 1.0
    visual: smolder_spiral  # drawn at every point of every arm, each tick of the travel (no sound: ContentValidator)

on_hit:
  - type: damage
    amount: 160
    element: fire
