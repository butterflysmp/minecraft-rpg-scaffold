# THE SWORD LADDER (PLAN-weapon-tiers.md 1.4). Ben, 2026-11-20, verbatim: "Gold - 20".
#
# The ladder's shape is ironblade's basic attack (the vanilla-driven left click, weapon_damage, kinetic), with no
# special. Attack speed 1.6, reach and durability are vanilla's; the sweep 0.5 is ironblade's (Ben: "Yes all swords
# should have the built in sweep"). The name is vanilla's, coloured by rarity (Ben: "vanilla names with the rarity
# color"). No flavor: Ben has given none, and a weapon loads cleanly without it (SwordTiersContentTest).
#
# craft_result: crafting a vanilla golden_sword mints this weapon. Exactly one gear claims each sword (the seat's brief,
# part b), and a bad or contested claim is refused at boot (fail closed, 2026-11-20).

id: golden_sword
display_name: "Golden Sword"
element: kinetic
rarity: common
class: melee
material: golden_sword
attack_damage: 20
attack_speed: 1.6
sweep: 0.5
craft_result: golden_sword
triggers:
  left_click:
    cast:
      type: melee
      reach: 3.0
      arc_degrees: 120
    on_hit:
      - type: weapon_damage
        element: kinetic
