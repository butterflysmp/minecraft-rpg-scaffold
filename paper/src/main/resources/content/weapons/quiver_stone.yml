# The Quiver Stone -- a FIXTURE for the quiver mechanism, not a weapon. It exists so the magazine,
# the reload and the two refusals have something to gate against, and it is owned by the mechanism
# rather than by any content slice.
#
# PERMANENT, like ability_stone and volley_stone -- NOT a _TEMP fixture. Ships in NO kit, has NO
# recipe file, and so is uncraftable and unreachable by a normal player. Gated only by /rpg give
# needing rpg.command.give. The argument is volley_stone's, unchanged: gating a mechanism REQUIRES
# a content file that uses it, and a content file whose only purpose is to exercise a mechanism is
# a test fixture. Shipping the Boltor early "just to test with" would be the content slice arriving
# through the back door with none of its decisions made -- its damage in particular is UNRULED, and
# GATE-boltor.md (slice B) is the authority that will rule it.
#
# ITS NUMBERS ARE DELIBERATELY NOBODY ELSE'S, and the set they were checked against is named rather
# than merely claimed. Swept: every file in content/weapons/ (ability_stone, cursed_emerald,
# ember_staff, emberblade, flint_staff, hunters_bow, ironblade, lapis_staff, volley_stone) and
# content/abilities/ (arc_surge, ember_step, rekindle, solar_grenade, solar_lance, void_slash).
# Every numeric value authored across those fifteen files:
#
#   0 0.03 0.05 0.3 0.5 0.6 1 1.2 1.4 1.6 2 2.3 2.5 3.0 3.5 4.0 5 6 7 8 10 12 15 16
#   20 21 24 25 26 27 30 32 35 40 60 64 80 100 120 200 300
#
# None of 9, 11, 13, 23 or 34 appears there, and none of them repeats within this file. Two earlier
# proposals were withdrawn ON this sweep rather than by inspection: quiver_size 3 (3.0 is authored)
# and reload_ticks 20 (cursed_emerald's windup_ticks). A collision-avoidance claim with no named set
# is the same defect as a count against an unnamed set.
#
# AND quiver_size IS DELIBERATELY NOT 8, which is the Boltor's. If the fixture and the weapon shared
# a capacity, a gate row staging "fires N then refuses" could not tell the stat from the constant --
# two equal quantities in one row, and at least one of them measuring the fixture.

id: quiver_stone
display_name: "Quiver Stone"

# Neutral: declares no applies_status, so nothing accrues and no glyph competes with the numbers a
# gate row has to count. volley_stone's reasoning, and for the same reason.
element: kinetic

# Exotic for VISIBILITY -- the name's colour is the rarity tier's, so a `common` dev tool mints
# plain white and reads as an Ironblade in a crowded hotbar. THREE dev tools now share the tier
# (ability_stone, volley_stone, this); none is in any kit or loot roll, so the tier is not cheapened
# anywhere a player can reach.
rarity: exotic

# RANGER, unlike the other two fixtures' `mage`, and that is not decoration: the quiver is the
# Ranger's brake and this is the first file to exercise it. It also means a Power enchant can reach
# this weapon, which is worth knowing before A2 lets an enchant touch quiver size.
class: ranger

# THE MATERIAL IS LOAD-BEARING, AND MATCHING IT IS ONLY HALF OF WHAT THE INSTRUMENT NEEDS.
#
# Verified present in the pinned 26.1.2 jar, the check volley_stone.yml records:
#   unzip -p run/versions/26.1.2/paper-26.1.2.jar \
#     net/minecraft/world/item/Items.class | grep -a -o -E '\bcrossbow\b|\bbow\b' | sort -u
# printed both, `bow` being the control we already ship (hunters_bow).
#
# This file is the INSTRUMENT that measures the held-right-click repeat interval, which is a floor
# under every fire rate and has never been measured. A crossbow is a use-animation item, and its
# repeat behaviour is not a bow's -- so the material has to match what the Boltor will be. BUT THE
# MATERIAL IS NOT SUFFICIENT: the interval also depends on whether the weapon BINDS right_click,
# because binding is what cancels vanilla (hunters_bow.yml: "binding the shot to right_click is
# what suppresses the vanilla draw"). This file binds right_click and therefore cancels vanilla
# exactly as the Boltor will, and THAT is why its number transfers. A fixture matching on material
# but differing on the binding would measure a different configuration and yield a plausible,
# wrong figure with nothing looking wrong.
material: crossbow

# AUTHORED 0, NOT OMITTED -- volley_stone's rule, and it applies verbatim. WeaponLoader reads
# getDouble("attack_damage", 0.0), so the absence would resolve to exactly the value the omission
# meant, which is the trap: it works, it is invisible, and it hides a decision. There is no basic
# attack here; the right_click trigger is the whole instrument.
attack_damage: 0

# THE MAGAZINE. Nine rounds and a reload just under two seconds.
#
# reload_ticks is 34 rather than the operator's ruled 3s (60) for the same reason quiver_size is not
# 8: 60 is authored by emberblade, and a fixture sharing a number with a shipped weapon is a row
# that cannot tell them apart. The BOLTOR gets 3s; this measures the mechanism, not the balance.
quiver_size: 9
reload_ticks: 34

flavor:
  - "An instrument, not a weapon."
  - "It measures how long you spend not shooting."

triggers:
  # THE ONLY TRIGGER, and left_click is conspicuously absent BY REFUSAL rather than by choice:
  # WeaponDefinition rejects a weapon that declares both a quiver and a left_click trigger, because
  # a quiver spends left-click on its reload and two owners for one press would race silently.
  right_click:
    name: "Loose"
    description:
      - "One bolt, and one fewer"
      - "than you had a moment ago."
    # THE FIRE RATE. Deliberately short, because this trigger's job is to let the held-input repeat
    # interval become the limiter if the repeat is slower than this -- which is exactly the number
    # the gate is trying to find. If the observed interval exceeds 11 ticks, the repeat rate IS the
    # measurement, and the Boltor's 14-single / 7-dual numbers have to be judged against it.
    cooldown_ticks: 11
    cast:
      # A RAY, like the Boltor and unlike either other fixture -- so the thing being measured is the
      # cast shape the quiver will actually ship on. Range 23 keeps it inside the 32-block client
      # particle cap GATE-volley V3 measured, so visible reach equals real reach.
      type: ray
      range: 23
      beam: lapis_beam
    on_hit:
      # A LITERAL, not weapon_damage, and that is a decision rather than laziness. weapon_damage
      # would make this a basic attack, which silences the right-click refusal path in RpgListeners
      # and scales the cooldown by the wielder's ATTACK_SPEED -- both of which would obscure the two
      # things this fixture exists to show: the refusals speaking, and the authored fire rate.
      #
      # *** DO NOT CHANGE THIS TO weapon_damage WITHOUT RE-CHECKING GATE-quiver.md V2. ***
      #
      # V2 distinguishes a correct gate ordering from a broken one BY WHICH MESSAGE PRINTS: the
      # empty notice on a pass, "On cooldown for ..." on a fail. That second string is rendered by
      # RpgListeners' switch, and the switch is only reached because DamagePayload.isBasicAttack is
      # FALSE for a plain `damage` effect. Make this weapon_damage -- which is what hunters_bow does,
      # and the obvious way to make this fixture "more realistic" -- and firesABasicAttack returns
      # early, the switch never runs, and THE FAIL MESSAGE STOPS RENDERING.
      #
      # Nothing would look wrong. The row still reads correctly and a pass still shows the empty
      # notice; the only change is that V2 can no longer fail. That is the whole hazard, and it is
      # written at both ends -- here and in the gate -- because a one-ended note is the half read by
      # whoever is not editing that file.
      - type: damage
        amount: 13
        element: kinetic
