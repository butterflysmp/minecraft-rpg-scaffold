# THE BLAZE KING'S STAFF -- a port from the old project (cfde822, StaffListener), LEGACY-A
# (PLAN-legacy-port.md 2.6).
#
# MECHANISM, NOT STRUCTURE: left-click throws a fireball. The old fireball was a SmallFireball entity; this
# engine's projectiles are an item or an arrow, so it throws a fire charge. Its burn is Scorch, which
# fire.yml's applies_status puts on every fire hit.
#
# ONE INPUT, BY RULING. cfde822's staff also had a right-click, "Smolder", a burst that set everything near the
# wielder burning. Ben, 2026-09-29: "Let's remove the smolder ability on the blaze kings staff". So this staff
# has no right_click, and PLAN-legacy-port.md's Q-P5 (should a caster-centred burst hit players) is moot for it.
#
# ================== EVERY NUMBER IS PROVISIONAL (Ben, 2026-09-29) ==================
#
#   Fireball  amount  30    cfde822's GS-1 base (power), carried direct as flint_staff's 20 was.
#             cost     8    cfde822's mana.
#             cooldown 8    cfde822's 400 ms = 8 ticks, already on the 4-tick grid.
#             speed    1.5  cfde822's velocity.
#             gravity  0.05, lifetime 40: flint_staff's thrown item (no cfde822 figure in this port's record).
id: blaze_kings_staff
display_name: "Blaze King's Staff"
element: fire
rarity: legendary
class: mage
material: blaze_rod
flavor:
  - "The Blaze King kept it lit."
  - "It has not gone out since."
triggers:
  left_click:
    name: "Fireball"
    description:
      - "Throws a burning charge."
    cooldown_ticks: 8
    cost:
      resource: mana
      amount: 8
    cast:
      type: projectile
      speed: 1.5
      gravity: 0.05
      max_lifetime_ticks: 40
      item: fire_charge
    on_hit:
      - type: damage
        amount: 30
        element: fire
