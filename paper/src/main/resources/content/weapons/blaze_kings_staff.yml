# THE BLAZE KING'S STAFF -- a port from the old project (cfde822, StaffListener), LEGACY-A
# (PLAN-legacy-port.md 2.6).
#
# MECHANISM, NOT STRUCTURE: left-click throws a fireball; right-click, "Smolder", sets everything around the
# wielder burning. The old fireball was a SmallFireball entity; this engine's projectiles are an item or an
# arrow, so it throws a fire charge. The old Smolder ignited, then hit each burning body once a second; here
# the burn is Scorch, which fire.yml's applies_status puts on every fire hit.
#
# ================== EVERY NUMBER IS PROVISIONAL (Ben, 2026-09-29) ==================
#
#   Fireball  amount  30    cfde822's GS-1 base (power), carried direct as flint_staff's 20 was.
#             cost     8    cfde822's mana.
#             cooldown 8    cfde822's 400 ms = 8 ticks, already on the 4-tick grid.
#             speed    1.5  cfde822's velocity.
#             gravity  0.05, lifetime 40: flint_staff's thrown item (no cfde822 figure in this port's record).
#   Smolder   amount   1    cfde822 BLAZE_SMOLDER_DPS_BASE, its GS-1 per-second base, carried direct.
#             cost    40    cfde822's mana.
#             cooldown 400  cfde822's 20 s, on the grid.
#             radius  10    cfde822's.
#
# SMOLDER'S BURN IS SMALL, AND THAT IS THE CARRIED NUMBER, NOT A BUG. Scorch is capped by the damage of the hit
# that applied it (StatusDefinition.Scorch), and this hit is 1. A burst with no damage at all would burn for
# nothing (PLAN-legacy-port.md F12). Ben: "everything will be getting tuned later".
#
# A CASTER-CENTRED BURST HITS OTHER PLAYERS today (PLAN-legacy-port.md F6); whether it should is Ben's open
# Q-P5. cfde822's Smolder skipped party members.
id: blaze_kings_staff
display_name: "Blaze King's Staff"
element: fire
rarity: legendary
class: mage
material: blaze_rod
flavor:
  - "The Blaze King kept it lit."
  - "It has not gone out since."
triggers:
  left_click:
    name: "Fireball"
    description:
      - "Throws a burning charge."
    cooldown_ticks: 8
    cost:
      resource: mana
      amount: 8
    cast:
      type: projectile
      speed: 1.5
      gravity: 0.05
      max_lifetime_ticks: 40
      item: fire_charge
    on_hit:
      - type: damage
        amount: 30
        element: fire
  right_click:
    name: "Smolder"
    description:
      - "Everything near you starts to burn."
    cooldown_ticks: 400
    cost:
      resource: mana
      amount: 40
    cast:
      type: self
    on_hit:
      - type: burst
        radius: 10
        effects:
          - type: damage
            amount: 1
            element: fire
