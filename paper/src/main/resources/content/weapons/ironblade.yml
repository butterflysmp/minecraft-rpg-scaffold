# The first weapon. A plain sword: one trigger, free, no special element.
#
# A weapon is a container of triggers, and each trigger is an ability body -- the
# same cast / cost / cooldown / on_hit grammar an ability uses -- bound to an input.
# So `left_click` below reads exactly like an ability, minus the id/element the
# weapon supplies. The trigger's cooldown keys on ironblade/left_click, so it is
# independent of every ability and every other weapon's triggers.
#
# element and rarity are inert in Phase 1: they load and colour the item name and
# nothing else. `kinetic` is the neutral element -- unflavoured, never absent.

id: ironblade
display_name: "Ironblade"
element: kinetic
rarity: common
# The mechanical class -- a required, fixed axis (melee, ranger, mage). Labels the tooltip now;
# future class-typed stat modifiers will key on it.
class: melee
# The melee attack damage a basic swing deals. This is now a real STAT (the weapon contributes it as
# a MAIN_HAND modifier on the wielder's ATTACK_DAMAGE), read back by the weapon_damage on_hit below --
# not a literal buried in the effect. One source of truth the lore tooltip can later display.
attack_damage: 8

# The melee cadence, in ATTACKS PER SECOND, authored directly rather than derived from a tick
# count -- every vanilla sword is 1.6 and 20/n cannot produce 1.6 for any integer n. It is
# reconciled onto the wielder's vanilla attack-speed attribute (times their attack-speed stat),
# so it paces the swing, fills the crosshair indicator, and sets the charge AttackCharge scales by.
attack_speed: 1.6

# The SWEEP fraction. Vanilla already decides WHEN a sweep happens (a full-charge sword swing) and
# WHICH mobs it catches; this is only how hard each of them is hit -- 0.5 means a bystander takes
# half of whatever the primary target took on that same swing. Because it is a share of the
# primary's FINAL number, the enchant percentage, the class damage bonus and the charge are all
# inherited for free; there is no second multiplier chain here to keep in step.
#
# PRESENCE is the opt-in: omit this key and the weapon does not sweep at all, which is how the bow
# and the staff have none without anything hard-coding a list of what may sweep.
sweep: 0.5

# Authored tooltip prose, rendered italic/gray beneath the derived stats. MUST be a YAML list
# (one '- ' item per line); a scalar is ignored with a warning. Optional -- omit for stats only.
flavor:
  - "Forged plain and true."
  - "The first blade any recruit is handed."

triggers:
  # Left-click swing. No `cost:` section means free -- mana regenerates while you
  # swing, rather than competing with your abilities.
  left_click:
    # No name/description: a weapon_damage trigger IS the basic attack, and the tooltip renders it
    # as a stat block ("Melee Damage: 8" / "Attack Speed: 1.6" -- the weapon-level attack_speed above),
    # not an ability section. Prose here would never be read. A costed special (see emberblade's
    # right_click) still authors both. NOTE there is no cooldown_ticks: a melee basic's cadence is
    # the attack_speed above, and a second throttle here would make every allowed swing fully
    # charged, which would render AttackCharge dead code.
    # RETAINED, and NOT vestigial. Vanilla's crosshair attack owns reach -- about 3 blocks, which
    # the number below now states honestly -- and there is no arc at all: it hits what the
    # crosshair is on.
    # But `type: melee` is the discriminator BasicMelee.isVanillaDriven reads to decide that this
    # trigger belongs to the vanilla damage event rather than the arm-swing packet. Delete this
    # block and the trigger silently goes back to the 120-degree cone.
    cast:
      type: melee
      reach: 3.0
      arc_degrees: 120
    on_hit:
      # Deals the wielder's ATTACK_DAMAGE stat (= this weapon's attack_damage), not a literal amount.
      - type: weapon_damage
        element: kinetic
