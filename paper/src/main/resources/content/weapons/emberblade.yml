# The second weapon: a free + costed sword. Left-click is a free swing like ironblade;
# right-click is a costed special that spends the SAME mana pool an ability does, and is
# blocked when that pool runs dry. That shared-resource tension is the whole point of it.
#
# The special reuses the already-shipped solar_detonation visual and scorch status, so it
# adds no new visual/status files and dangles no references.
#
# element/rarity remain inert reserved data: solar is the fire-theme placeholder (re-elemented
# in Phase 2), rare colours the name BLUE.

id: emberblade
display_name: "Emberblade"
element: fire
rarity: rare
class: melee
# Melee attack damage as a stat -- see ironblade. Lower than ironblade (7 vs 8): the emberblade trades
# a little swing damage for its costed fireball special below.
attack_damage: 7

# Authored prose (YAML list required; a scalar is ignored with a warning).
flavor:
  - "Its edge remembers the forge-fire."
  - "Swing to cut; loose to burn."

triggers:
  # Free swing. No cost section -> free; mana regenerates while you swing.
  left_click:
    # No name/description -- this is the basic attack, rendered as a stat block. See ironblade.
    cooldown_ticks: 10
    # RETAINED, and NOT vestigial. Vanilla's crosshair attack owns reach (~3 blocks, slightly
    # shorter than the 3.5 below) and there is no arc at all -- it hits what the crosshair is on.
    # But `type: melee` is the discriminator BasicMelee.isVanillaDriven reads to decide that this
    # trigger belongs to the vanilla damage event rather than the arm-swing packet. Delete this
    # block and the trigger silently goes back to the 120-degree cone.
    cast:
      type: melee
      reach: 3.5
      arc_degrees: 120
    on_hit:
      # The wielder's ATTACK_DAMAGE stat (= this weapon's attack_damage). The costed special below
      # keeps a LITERAL amount -- an ability payload, not a basic swing.
      - type: weapon_damage
        element: fire

  # The costed special: a fireball that bursts on impact. Spends 40 mana (about two casts
  # on a full 100 bar) and waits 3 seconds. A drained pool blocks it -- that is the proof.
  right_click:
    name: "Fireball"
    description:
      - "Hurl a bursting ember"
      - "that scorches all it catches."
    cooldown_ticks: 60
    cost:
      resource: mana
      amount: 40
    cast:
      type: projectile
      speed: 1.6
      gravity: 0.03
      max_lifetime_ticks: 100
    on_hit:
      - type: visual
        visual_id: solar_detonation
      - type: burst
        radius: 3.0
        effects:
          - type: damage
            amount: 12
            element: fire
          - type: status
            status_id: scorch
            duration_ticks: 40
