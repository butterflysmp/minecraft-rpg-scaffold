# THE SWORD LADDER (PLAN-weapon-tiers.md 1.4). Ben, 2026-11-20, verbatim: "Netherite - 31".
#
# The ladder's shape is ironblade's (deleted 2026-11) basic attack (the vanilla-driven left click, weapon_damage, kinetic), with no
# special. Attack speed 1.6, reach and durability are vanilla's; the sweep 0.5 is ironblade's (deleted 2026-11) (Ben: "Yes all swords
# should have the built in sweep"). The name is vanilla's, coloured by rarity (Ben: "vanilla names with the rarity
# color"). No flavor: Ben has given none, and a weapon loads cleanly without it (SwordTiersContentTest).
#
# NO craft_result: a netherite sword is not crafted. It comes from the smithing table (feat/sword-smithing) and,
# found in loot, by convert-on-arrival (feat/sword-convert).

id: netherite_sword
display_name: "Netherite Sword"
element: kinetic
rarity: uncommon
class: melee
material: netherite_sword
attack_damage: 31
attack_speed: 1.6
sweep: 0.5
triggers:
  left_click:
    cast:
      type: melee
      reach: 3.0
      arc_degrees: 120
    on_hit:
      - type: weapon_damage
        element: kinetic
