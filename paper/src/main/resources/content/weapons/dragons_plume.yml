# THE DRAGON'S PLUME -- the Ranger's third weapon, and the first in this project whose INPUT IS NOT
# A CLICK.
#
# ================== COMPLETE. BOTH SHOTS ARE AUTHORED AND THE WEAPON FIRES. ==================
#
# ~~FIRST PASS. IT AUTHORS ONLY WHAT THE BOOT NEEDS... SO THE RELEASE IS DELIBERATELY ABSENT.~~
# That header was true for one slice. H1 read the draw, H2 built the release, and this file now
# carries FOUR casts -- the charged shot under `draw:` and R4'''s three tap bands.
#
# ================== EVERY NUMBER HERE WAS RULED BY THE OPERATOR ==================
#
#   attack_damage 34   quiver_size 25   reload_ticks 60   cooldown_ticks 0 (on each tap band)
#   tap damage 9/17/26 legendary        void              ranger, material bow
#   speed 2.5          gravity 0.05     max_lifetime_ticks 120
#
#   UNRULED AND MARKED AS SUCH: the three homing figures (INHERITED AND UNJUDGED, gate rows P1-P3).
#   THE BODY IS RULED AND LANDED: every cast authors `body: arrow` -- a real arrow, oriented along
#   its travel, that cannot hit, stick or be picked up. `item: arrow` is GONE, not superseded-in-
#   place; the two keys are mutually exclusive and the loader refuses a file that authors both.
#
# THREE OF THESE MOVED TOGETHER IN ONE RULING: attack_damage 48 -> 34, reload_ticks 90 -> 60, and
# the tap 12 -> 8. One answer to one dialog, read as one -- PLAN-dragons-plume.md
# 7.1. Changing any one alone re-opens arithmetic the other two were balanced against.
#
# AND TWO LATER RULINGS MOVED THINGS AGAIN: R14 (c 20 -> 16, the charge second) and R4''' (the tap
# 8 -> three bands, 9 / 17 / 26). Those are SEPARATE rulings, not part of that answer.
#
# NOTHING below is a proposal. PLAN-dragons-plume.md carries the derivations and the arithmetic each
# was ruled against; this file carries the values and the consequences a reader of THIS file needs.

id: dragons_plume
display_name: "Dragon's Plume"

# ================== THE PROJECT'S FIRST LEGENDARY ==================
#
# Measured before authoring: `grep -n "^rarity:" content/weapons/*.yml` returns common x2, uncommon
# x4, rare x3, exotic x3 and LEGENDARY x0. So this weapon is the first thing to render that tier's
# colour on a client at all -- which is a reason to look at the tooltip on the boot rather than a
# reason to change anything here.
rarity: legendary

# VOID, AND IT DRAWS A GLYPH ON EVERY DAMAGE NUMBER. void.yml is two lines and its damage_symbol is
# "<dark_purple>✧</dark_purple>", so once H2 fires, a five-arrow release puts FIVE purple-sparkled
# numbers up at once. It accrues nothing: the anchored sweep
# `grep -n "^applies_status" content/elements/*.yml` returns fire.yml ALONE, so the worry a
# five-projectile burst would otherwise raise -- a status accruing five times in one frame -- does
# not arise. That is a discharged concern, not an overlooked one.
element: void

# The Ranger's third weapon. The quiver is the class's brake, and Power (enchants/power.yml,
# effect: damage, class: ranger) reaches this weapon's attack_damage once a payload reads it.
class: ranger

# BOW, AND THE ENTIRE WEAPON RESTS ON THIS ONE WORD. R1 keeps the VANILLA DRAW as the input device:
# the animation, the charge state and a real release event all come from vanilla's bow, and slice H1
# reads them. A different material would have no draw to read.
material: bow

# ============ 34: RULED, AND THE DIALOG THAT RE-OPENED 48 IS CLOSED ============
#
# R8 ruled 48 against a FIVE-SECOND release cycle. R1' amended the charge to 1/3/5, and the flag
# raised here -- ruled-against-a-superseded-cycle -- WAS ANSWERED: 34, with reload_ticks 60 below.
#
# *** AND R14 HAS SINCE MOVED THE CYCLE AGAIN WITHOUT MOVING THIS NUMBER. *** c went 20 -> 16, so
# the figures 34 was ruled against are NOT the figures it now produces. 34 is not re-flagged -- the
# dialog that set it also set the reload, and R14 is a pacing ruling rather than a damage one --
# but the arithmetic below is R14's, not R8''s:
#
#   170 in one instant            5 x 34            UNCHANGED by either ruling
#   sustained 850 / 16.00s        53.13 dmg/s       was 47.22 at c=20, 61.54 at 48/90
#   Locust sustained              32.50 dmg/s       the Plume is 1.63x it, was 1.45x
#
# *** AND THE THING NEITHER RULING ACHIEVED, RECORDED BECAUSE IT IS THE OBVIOUS READING: 34 STILL
# SITS ABOVE BOTH LOCUST ANCHORS, AS 48 DID. *** Recomputed at the 16.00s cycle, sustained parity
# is 20.80 per arrow and instantaneous parity 27.73 -- both LOWER than they were at 18.00s, because
# a shorter cycle lowers the bar the same way it raises the rate. Cutting the damage never brought
# the weapon between them, and R14 moved it further above. A reader who assumes 48 -> 34 was a move
# toward parity will be wrong, and more wrong than before.
#
#   THE FLAG IS GONE BECAUSE THE QUESTION WAS ASKED AND ANSWERED, WHICH IS THE DISTINCTION THE FLAG
#   EXISTED TO MAKE. A number left in place because nobody re-asked is the defect this project keeps
#   finding; a number in place because the operator was asked and answered is a ruling, and the two
#   are indistinguishable in a content file unless the file says which.
#
# Per ARROW. Five arrows at full charge is 170 DAMAGE IN ONE INSTANT, and both rulings were taken with
# that consequence in front of the operator -- against the 104 the Locust lands in its first two
# seconds. A number that reads modest as a rate reads extreme as a spike, and this weapon is all
# spike: the release lands in a single frame and then costs a full draw plus 1.6 seconds (R14).
#
#   IT NOW RENDERS, AND THE COMMENT THAT SAID IT DID NOT IS REPLACED RATHER THAN LEFT. This used to
#   read: "IT RENDERS NOWHERE ON THE TOOLTIP YET... the 'Ranged Damage: 48' line appears when H2
#   authors the payload, not before." H2 has authored it -- `draw:` below carries a weapon_damage
#   on_hit, which is exactly what WeaponLore's stat block is gated on -- so the line is on the
#   tooltip and the old sentence became false in the same commit that authored the payload.
#
#   THE MODIFIER WAS NEVER WAITING, WHICH IS THE HALF THAT DID NOT CHANGE: WeaponItems.mint derives
#   the wielder's ATTACK_DAMAGE attribute from this value regardless of triggers, so the stat has
#   been real since the file shipped and only the tooltip line was ever missing.
attack_damage: 34

# ================== THE MAGAZINE ==================
#
# 25 rounds, ONE PER ARROW -- so five arrows is five rounds and 25 is five maximum-charge releases.
# An empty quiver does nothing: the weapon is dead until reloaded, ruled previously.
#
# AN AUTHORED BASE, NOT THE VALUE THE GAME USES. The capacity a wielder packs at is
# QuiverSize.resolve(quiver_size, their gear); what is written here is what a player with no such
# gear gets, and what a craft preview shows. A GATE ROW MUST READ WHAT IS ON SCREEN, NEVER THIS LINE.
#
# 25 is deliberately unlike every other magazine in the project -- 8, 9 and 12 -- so a gate row
# reading a capacity cannot be measuring the fixture by coincidence.
quiver_size: 25

# ================== 60 TICKS, 3.0s -- RULED. *** AND IT IS A RULING, NOT A DERIVATION. *** ==========
#
# *** THIS VALUE RESTS ON A FEEL JUDGEMENT AND ON NOTHING ELSE. SAY SO, BECAUSE A NUMBER WITH NO
# *** DERIVATION IS ONE SOMEBODY LATER "FIXES".
#
# 90 HAD THREE SUPPORTS. TWO ARE GONE AND THE THIRD IS WHAT 60 STANDS ON:
#
#   1. THE RATE COUPLING       DEAD, and it died twice. "Below reload_ticks ~= 71 the tap retakes
#                              the lead" was true at one arrow per second. R1' killed it; the
#                              re-derivation at d=9 (R4'''s floor band) KILLED IT HARDER: the tie
#                              is at reload_ticks = -4.32 -- see PLAN 7.3.
#   2. TICKS PER ROUND         OVERTURNED BY THE OPERATOR, with the consequence in front of him.
#                              This file used to argue 3.60 was "deliberately just UNDER
#                              quiver_stone's 3.78" and that "at the 60 first proposed it would have
#                              been 2.40, cheapest by 36%". 60 IS THAT VALUE. The Plume is now the
#                              cheapest ammunition in the project by 36.5%, and that is chosen.
#   3. PACING                  "Longer than anything shipped, but not punishing." A FEEL JUDGEMENT,
#                              and the only support 60 has.
#
#   ticks per round:  boltor 7.50   locust 5.00   quiver_stone 3.78   PLUME 2.40
#
# *** SO DO NOT RE-DERIVE THIS NUMBER FROM THE AMMUNITION COMPARISON. *** That comparison was the
# argument for 90 and it was heard and overruled. Anyone who recomputes it will find 2.40 sitting
# well under 3.78, will read that as a defect, and will be reversing a ruling rather than fixing an
# oversight. THE ONLY THING THAT CAN MOVE THIS NUMBER IS ANOTHER FEEL JUDGEMENT.
#
#   AND THE RATE COUPLING IS DEAD IN A STRONGER SENSE AGAIN, RE-DERIVED RATHER THAN CARRIED FORWARD
#   FOR THE THIRD TIME: at R14's c=16 and R4'''s band-1 floor of 9 damage over 3 ticks, the tie is at
#   reload_ticks = -4.32 (fencepost A) and -8.40 (B). It was -1.85 / -5.77 at d=8 and c=20, and
#   +4.00 at the original set, meaning a zero reload would once have handed the lead back to the tap.
#   THE SIGN AT R=0 FLIPPED AT R8' AND HAS MOVED FURTHER FROM ZERO SINCE: even a zero reload leaves
#   the charge ahead, so this field has stopped bearing on the rate comparison at all. The higher
#   bands are further out still, -172 and -685, because their hold floors cost more than their damage
#   buys. PLAN-dragons-plume.md 7.3 carries the working.
#
#   AND THE TAP TAX SURVIVES AS AN AMMUNITION ARGUMENT, WHICH IS NOT A RATE ONE -- BUT IT IS WEAKER
#   THAN IT WAS, AND THIS COMMENT USED TO SAY IT COULD NOT BE. With cooldown_ticks at 0 (R7, below)
#   the reload is still the whole price of tapping: the same 25 rounds are worth 850 damage charged
#   against 225 / 425 / 650 tapped -- 3.78x / 2.00x / 1.31x BY BAND.
#
#     *** THIS READ "200 tapped -- 4.25x ... THAT ratio is untouched by any of this, because it is
#     damage per ROUND and every ruling here moved time." R4''' MOVED DAMAGE PER ROUND. *** A
#     sentence asserting its own figure is immune to change is the one to re-check first, because
#     nobody re-checks it afterwards. At band 3 a tapper gets 76% of the magazine's charged value
#     and the ammunition brake barely brakes; what holds band 3 back is the RATE table, which does
#     rest on an inter-click gap nobody has measured. Flagged for gate row P7.
#
# NOT ON THE TOOLTIP. WeaponLore renders a quiver line and NO RELOAD LINE AT ALL, so this number
# reaches a player only as the wait itself -- which is exactly why a feel judgement is the right kind
# of support for it, and why no arithmetic here can check it.
reload_ticks: 60

# THE FLAVOUR NAMES NO NUMBER AND NOTHING A STAT CAN MOVE, which is locust.yml's rule rather than
# boltor.yml's. "Eight bolts, then three seconds" quotes a quiver_size that QuiverSize.resolve can
# change for a wielder carrying the right gear, at which point the line is false to the player
# reading it. A FALSIFIED COMMENT MISLEADS A READER WHO CAN CHECK IT; A FALSIFIED FLAVOUR LINE
# MISLEADS A PLAYER WHO CANNOT.
#
# Both halves below are permanently true of the ruled design: the charge, and the sight gate.
flavor:
  - "Patience is the only string it answers to;"
  - "what it cannot see, it lets pass."

# ================== THE OFF-HAND ARROW IS NOT IN THE FLAVOUR, AND THAT IS A DECISION ==================
#
# THE PLUME WILL NOT DRAW WITHOUT A PLAIN ARROW SOMEWHERE ON THE PLAYER. That is vanilla, measured
# out of the pinned server jar: BowItem.use returns FAIL when getProjectile finds nothing, so the bow
# never pulls back and no release event is delivered. The Plume's ammunition is its own 25-round
# quiver, so a player can be FULLY LOADED AND UNABLE TO DRAW -- and a reload leaves them in exactly
# that state, because reloading is what consumes their loose arrows.
#
# R5: the player carries ONE ARROW IN THE OFF-HAND, where no reload can take it -- vanilla checks the
# off-hand first while QuiverAmmo.sources walks getStorageContents(), which excludes it. Recorded as a
# KNOWN WORKAROUND WITH NO TRIGGER: a better solution is wanted and nobody has designed one.
#
#   IT IS NOT A FLAVOUR LINE, FOR THE REASON THE FLAVOUR BLOCK ABOVE GIVES. This file will outlive the
#   workaround. emberblade.yml shipped "Swing to cut; loose to burn", which became false the day melee
#   started accruing scorch, and nothing but a person reading it would ever have said so. A mechanical
#   instruction that is TEMPORARY BY DESIGN is the worst possible candidate for permanent italic text.
#
#   THE SURFACE IT BELONGS ON IS A NOTICE, on the failed draw, in QuiverNotice's form -- which says
#   what to DO because "a refusal with no remedy reads as a bug". It is detectable: H1's tick is
#   scheduled one tick after the interact and finds hasActiveItem() false when the draw never started.
#   That is H1/H2 code rather than content, so it is named here and not authored here.
#
#   *** THE GAME NOW TEACHES IT. THIS IS THE GAP CLOSING, AND THE OLD SENTENCE IS REPLACED. ***
#
#   This used to read: "NOTHING IN THE GAME TEACHES THIS TODAY. A legendary bow that silently
#   refuses to draw is indistinguishable from a broken item." That was true when it was written and
#   became false in slice b3. PlumeNotice.noArrow fires from H1's scheduled tick when the draw never
#   started -- "This bow needs a plain Arrow in your off-hand to draw -- a reload cannot take it."
#
#   THE GAP WAS RECORDED AS OPEN RATHER THAN ABSORBED, WHICH IS WHY IT GOT CLOSED. A content file
#   stating a true thing about a missing surface is what makes the surface get built; the same note
#   written as "this is fine" would still be here.
#
#   AND THE NOTICE CARRIES R5'S OWN DELETION TRIGGER, in its javadoc rather than in a plan: the day
#   the off-hand requirement is replaced, that method and its throttle key go in the same commit. A
#   surface explaining a workaround stops being true exactly when the workaround dies, and that is
#   the moment nobody is looking at it. If this comment outlives the workaround, it is wrong too.

triggers:
  # ================== `draw`: THE PROJECT'S FIRST NON-CLICK INPUT ==================
  #
  # NOT A WORKAROUND AGAINST THE SCHEMA -- the designed extension point, and TriggerBinding's own
  # javadoc says so: "A List<TriggerBinding> rather than a fixed two-key map keeps the input set
  # open: a third input, or a right-click added later, needs no schema change." The input is a free
  # String, not an enum.
  #
  # NO CORE CHANGE WAS NEEDED AND THE INVARIANT IS NOT RELAXED. WeaponDefinition still refuses a
  # weapon with no triggers -- "a weapon is a container of triggers" -- and the Plume simply acquires
  # the trigger it actually has. Its input was never a click; the model already had room to say so.
  #
  # WHY NOT THE OTHER TWO, MEASURED BY CONSTRUCTION RATHER THAN ASSUMED:
  #
  #   left_click    REFUSED: "weapon 'dragons_plume' declares a quiver, which binds left_click to
  #                 the reload, so it may not also declare a left_click trigger"
  #   right_click   LOADS, AND DEFEATS THE WEAPON: RpgListeners cancels the vanilla interaction for
  #                 any weapon that binds it, so BowItem.use never runs, the draw never starts, and
  #                 PlumeDraw's gate excludes such a weapon by name.
  #
  # THE NAME IS THE GESTURE, which is the convention left_click and right_click already follow --
  # named for what the PLAYER DOES, not for when the code runs. Dispatch happens at RELEASE; if
  # `release` reads better on the tooltip that is a one-word change and the operator's to make.
  draw:
    # ================== NO cooldown_ticks HERE, AND ITS ABSENCE IS THE DECISION ==================
    #
    # R7's `cooldown_ticks: 0` LIVED ON THIS BINDING AND HAS MOVED TO `tap:` BELOW. It was always a
    # ruling about the TAP -- PLAN-dragons-plume.md 7.2 is entirely an account of this field pricing
    # tapping and nothing else -- and until slice b2b there was only one binding to put it on.
    #
    # COOLDOWNS KEY ON (player, weaponId, input), so with two bindings the field can finally sit on
    # the shot it governs. That makes "this timer prices the tap" STRUCTURAL rather than an
    # arithmetic coincidence of the two shots sharing one key.
    #
    #   CONSEQUENCE ON THE TOOLTIP, PREDICTED BEFORE THE GOLDEN WAS REGENERATED AND CONFIRMED BY IT:
    #   WeaponLoreLines.rangedAttackSpeedLabel returns "" at or below zero, so THIS WEAPON RENDERS NO
    #   "Attack Speed" LINE, where boltor and locust both do. That is correct rather than a
    #   regression: a charged release's cadence is a 2.6-SECOND HOLD, not a cooldown, and 20/0 is
    #   not a rate. A number there would be a lie the tooltip tells.
    #
    # DO NOT ADD A cooldown_ticks BACK HERE. A timer on the charged release would price the shot the
    # draw already prices, and 7.2's whole finding is that the draw is the gate.

    # ================== THE CHARGED SHOT: 1, 3 OR 5 ARROWS THAT SEEK ==================
    #
    # R11 ruled the reach at ~300 blocks: speed 2.5 over max_lifetime_ticks 120. R12 ruled the arrow
    # drops like a normal one -- gravity 0.05, which is hunters_bow's value and the only BOW
    # precedent in the project; the 0.03 figures belong to staves.
    cast:
      type: projectile
      speed: 2.5
      gravity: 0.05
      max_lifetime_ticks: 120

      # ================== `body: arrow` -- THE BODY RULING, LANDED. `item:` IS GONE. ==================
      #
      # ~~item: arrow~~ -- carried as an UNRULED DERIVATION until slice K, authored only because
      # ProjectileFlight spawns a marker for a bolt with a rendered body, so without it the arrows
      # were invisible and gate rows P1-P4, P8 and P9 could not be read at all.
      #
      # THE RULING RETIRED THE QUESTION RATHER THAN ANSWERING IT: the arrow is a real arrow that
      # VANISHES ON RESOLVE -- no pickup, no sticking, no damage. That is not an ITEM at all, so
      # `item:` was never the key that could express it. The derivation did not need ruling, it
      # needed DELETING, and this is the line that deleted it.
      #
      # WHAT THE TWO KEYS ACTUALLY DIFFER BY, since "it renders the body" is true of both:
      #
      #   item:  a dropped ITEM entity, driven along the path. It TUMBLES, because it is one.
      #   body:  a real ARROW, which orients along its own velocity -- so it flies POINT-FIRST, for
      #          free, with no orientation code of ours. That look is the entire reason for K.
      #
      # THEY ARE MUTUALLY EXCLUSIVE AND THE LOADER REFUSES BOTH. A bolt has one body; authoring
      # `item:` and `body:` together is a named, skipped file rather than a silent pick. Checked in
      # AbilitySchema (is the key present) AND in CastSpec.Projectile's own constructor (does the
      # combination mean anything) -- the same split CastSpec.Homing already uses.
      #
      # *** AND THE VALUE IS CHECKED, WHICH `item:` IS NOT. *** `body: arow` is a named, skipped
      # file; `item: blaze_ppowder` warns once and falls back to BLAZE_POWDER. That asymmetry is
      # deliberate: `item` names a Material out of a huge open set, `body` names one of OURS out of
      # a set of exactly one. See AbilitySchema.parseBody, which is where the second body kind will
      # turn this into a switch.
      #
      # WHAT MAKES IT INERT -- AND setNoPhysics(true) IS NOT IT. THIS NOTE SAID IT WAS, UNTIL
      # 2026-09-23, AND THAT ONE CALL WAS THE DEFECT RATHER THAN THE MECHANISM.
      #
      # #144 measured it: noPhysics also handed the arrow's motion to the CLIENT, which simulated it
      # and drew it wrongly oriented for the first stretch of every shot. Spike modes B and E differ
      # in that single line and nothing else; Ben read B as "still has the problem" and E as
      # "perfect, exactly what we're looking for". The body now spawns with physics AND gravity ON
      # and is driven every tick. PaperCombatWorld.spawnBoltMarker carries the standing
      # "DO NOT ADD setNoPhysics(true) BACK. IT IS THE DEFECT, MEASURED."
      #
      # WHAT MAKES IT INERT INSTEAD IS A LIST, NOT A SWITCH: setDamage(0), setKnockbackStrength(0),
      # setCritical(false), setShooter(null), setPersistent(false), an armed lifetime that retires a
      # stuck body in one tick, and a cancelled ProjectileHitEvent for any PDC-tagged body.
      # setPickupStatus(DISALLOWED) is SEPARATE and load-bearing on its own. All of them are in
      # PaperCombatWorld.spawnBoltMarker with the bytecode that says so.
      body: arrow

      # ================== THE TRAIL: BEN'S REQUEST, AND ITS NUMBERS ARE PROVISIONAL ==================
      #
      # A very slight dark-violet dust trail behind each arrow. ONE DUST mote per tick at a bolt's
      # live position: the sparsest trail in the project PER BOLT -- and, because this weapon fires
      # 1/3/5, the densest thing on master PER RELEASE at full charge. Both figures and the 595-mote
      # shot total are in dragons_plume_trail.yml; this line is the pointer, that file is the account.
      #
      # THE NUMBERS ARE ARITHMETIC, NOT A BOOT: colour [60, 20, 90] and size 0.6, where 0.6 is below
      # EVERY other authored size in content/visuals/. dragons_plume_trail.yml carries the density
      # table, the colour-ownership check, and which value moves first if it reads wrong. The
      # convention is flint_staff.yml's: the trail is authored first so the reading comes before the
      # tuning.
      #
      # ALL FOUR CASTS NAME THE SAME FILE rather than one each. The four differ in damage and in
      # homing, not in what the arrow looks like in the air -- and one id is what lets a tuning pass
      # move all four at once.
      trail: dragons_plume_trail

      # ================== THE HOMING FIGURES ARE INHERITED AND UNJUDGED ==================
      #
      # A DIFFERENT GAME'S NUMBERS, tuned against an INSTANT FAN OF THREE. R1' makes this a charged
      # weapon firing up to five. NOTHING CARRIES OVER AUTOMATICALLY -- marked exactly as
      # locust_beam.yml marks its own provisional density, and for its stated reason: "a number that
      # has been copied once looks more settled than the number it was copied from."
      #
      # They are AUTHORED RATHER THAN BAKED precisely so a boot row can move one without a rebuild.
      #
      #   AND THE SEARCH RADIUS CROSSED A SHAPE CHANGE THE NUMBER DOES NOT SHOW. The old repo's
      #   search was getNearbyEntities(10, 10, 10) -- a 20x20x20 BOX, whose corner is
      #   sqrt(3) x 10 = 17.32 blocks out. CombatWorld.combatantsNear is a SPHERE. The same 10 is a
      #   strictly SMALLER search everywhere except along the axes, so do not report P3 as "the old
      #   radius held".
      homing:
        lerp: 0.65               # INHERITED, unjudged -- discharged by PLAN row P1
        activation_blocks: 15    # INHERITED, unjudged -- discharged by P2
        search_radius: 10        # INHERITED, unjudged, and a SPHERE not a box -- discharged by P3

    # weapon_damage, NOT a literal -- so attack_damage above is a stat a modifier can grip, and so
    # Power (enchants/power.yml, effect: damage, class: ranger) reaches this shot.
    #
    # THIS IS THE LINE THAT MAKES "Ranged Damage: 34" RENDER. WeaponLore's stat block is gated on
    # DamagePayload.isBasicAttack, which is exactly this effect type -- see the attack_damage comment
    # above, which said the line "appears when H2 authors the payload, not before". This is that.
    on_hit:
      - type: weapon_damage
        element: void

  # ============ `tap1` / `tap2` / `tap3`: R4''', AND THE PARTIAL DRAW IS THREE BANDS ============
  #
  # A partial draw -- released after vanilla's 3-tick floor but before full charge. ONE arrow, NO
  # seeking, and a damage that depends on HOW FAR THE BOW WAS PULLED. DrawRelease.decide picks the
  # band and PlumeDraw dispatches the matching input by name; none of the three is reachable from a
  # click.
  #
  #   held  3 - 8 ticks   ->  tap1    9 damage
  #   held  9 - 14 ticks  ->  tap2   17 damage
  #   held 15 - 19 ticks  ->  tap3   26 damage
  #   held 20+            ->  `draw:` above, the charged release
  #
  # THE BOUNDARIES ARE VANILLA'S OWN POWER CURVE CUT IN THIRDS, derived rather than chosen:
  # solving (x^2+2x)/3 against 1/3 and 2/3 with x = t/20 gives t = 8.2843 and t = 14.6410, so the
  # integer bands are the floors. DrawRelease.bandFor carries the derivation and a test re-solves it.
  #
  #   THE REJECTED ALTERNATIVE, ON THE RECORD: the bow's three VISIBLE pull textures, which change
  #   at pull 0.0 / 0.65 / 0.9 -- t = 0 / 13 / 18. That would have made the bands match what the
  #   PLAYER SEES, which is a real argument. It was rejected because its top band is TWO TICKS WIDE
  #   (18..19): the highest-damage tap would be unhittable on purpose and hit by accident.
  #
  # THE CHAIN IS FOUR DEEP AND EVERY LINK IS WRITTEN DOWN, because a silently rewritten ruling reads
  # as one nobody ever questioned:
  #
  #   R4     one arrow, AND IT STILL HOMES                 -- superseded
  #   R4'    one arrow, NO homing, 12 damage               -- superseded by R8'
  #   R4''   one arrow, NO homing, 8 damage                -- superseded by R4'''
  #   R4'''  one arrow, NO homing, 9 / 17 / 26 BY BAND     -- RULED
  #
  #   *** THE 8 IS GONE, NOT JOINED. *** 9 does not extend R4'''s predecessor, it RE-RULES it. Ben
  #   was shown that 8 was the already-ruled floor and chose 9 knowingly. When a value changes the
  #   check is not "is the new value right", it is "IS THE OLD VALUE GONE".
  #
  # ================== THE PLAIN LABEL IS RULED. THE ABSENT `name:` IS THE DECISION. ==================
  #
  # No binding authors a `name:`, so each tooltip line reads "Dragon's Plume  Tap1" / "Tap2" /
  # "Tap3" -- the WEAPON's display name beside the input, which is what WeaponLoader falls back to.
  #
  # *** THAT IS CHOSEN, NOT LEFT OVER. *** It went to Ben as the third item of the three-question
  # dialog in PLAN-dragons-plume.md 7.1, with quiver_stone's "Loose" in front of him as the worked
  # alternative -- every other ability block in the project carries a name of its own. HE CHOSE THE
  # PLAIN LABEL.
  #
  #   SO AN ABSENT KEY HERE MEANS THE SAME THING AN AUTHORED 0 MEANS AT cooldown_ticks BELOW: a
  #   ruling that happens to look like an omission. This comment is the only thing separating the
  #   two, which is why it is here and not in the plan alone.
  #
  # *** AND THE RULING WAS TAKEN ON ONE BINDING, NOW APPLIED TO THREE. *** Ben ruled the plain label
  # when there was a single `tap:`. Three bands render three lines. That is the ruling being
  # EXTENDED rather than re-taken, and it is flagged here rather than assumed: if "Tap1 / Tap2 /
  # Tap3" reads worse than one line did, that is a finding for Ben and a `name:` key each is the
  # whole fix.
  #
  # ================== WHAT EVERY BAND SHARES ==================
  #
  # THE SAME FLIGHT AS THE CHARGED SHOT, AND THAT IS A DERIVATION RATHER THAN A RULING. R11 and R12
  # rule the reach and the drop for THE WEAPON; nothing rules the taps separately. Same flight minus
  # the seeking, labelled a derivation so nobody later cites it as a decision Ben made.
  #
  # cooldown_ticks: 0 ON EACH -- R7, "fast shooting arrows is fine". THE TAP IS GATED BY BEING A
  # WORSE SHOT, NOT BY A TIMER, and the 60-tick reload above is what prices spamming it.
  #
  #   *** A 0 LEFT IMPLICIT IS EXACTLY WHAT SOMEBODY LATER "FIXES". *** PLAN-dragons-plume.md 7.2
  #   wrote the condition before the ruling existed: "if the draw is meant to be the only gate, the
  #   answer is 0 and it should be authored as a RULING -- not left at 0 by omission." It renders
  #   nothing: cadenceLine drops a free, instant trigger.
  #
  #   *** AND IT IS NOW THREE BUCKETS, NOT ONE. *** Ability ids are weaponId + "/" + input and
  #   CooldownTracker keys on (player, abilityId), so the three bands are on three separate timers.
  #   INERT TODAY because all three are 0 -- and the moment anyone authors a non-zero cooldown on a
  #   tap they will be authoring one third of the gate they think they are. The symptom would be a
  #   spammer beating the cooldown by ALTERNATING BANDS, which reads as the cooldown not working.
  #   See PlumeDraw.TAP_INPUTS, which is where this property was created.
  #
  # DAMAGE IS AUTHORED, NEVER COMPUTED. Three literals is the point of this shape: every number a
  # player experiences stays in the file Ben can rule on. DO NOT "improve" these into a multiplier
  # on attack_damage -- weapon_damage reads the wielder's ATTACK_DAMAGE (34), and a literal is the
  # only way to say a number that is not the weapon's.
  #
  #   CONSEQUENCE ON THE TOOLTIP: each renders "Void Damage: N", ELEMENT-typed rather than
  #   class-typed, because a literal reads no stat -- so no "+N Ranged Damage" modifier can reach
  #   them, and claiming otherwise would be a lie the tooltip tells.

  # --- BAND 1: held 3-8 ticks, the floor band ---------------------------------------------------
  tap1:
    cooldown_ticks: 0
    cast:
      type: projectile
      speed: 2.5
      gravity: 0.05
      max_lifetime_ticks: 120
      # See `draw:`'s body note above. A real arrow, oriented along travel, inert in every other
      # way -- and mutually exclusive with `item:`, which the loader refuses rather than resolves.
      body: arrow
      # The same trail as `draw:`, and deliberately the same FILE: see its note there.
      trail: dragons_plume_trail
      # NO homing BLOCK, AND ITS ABSENCE IS THE RULING RATHER THAN AN OMISSION. R4''' is "one arrow,
      # WITH NO HOMING". AbilitySchema maps a missing section to null and a null Seek makes
      # ProjectileFlight.steer return the velocity untouched on its first line.
      # DO NOT "COMPLETE" THIS BY COPYING THE BLOCK FROM `draw:`.
    on_hit:
      - type: damage
        amount: 9
        element: void

  # --- BAND 2: held 9-14 ticks ------------------------------------------------------------------
  tap2:
    cooldown_ticks: 0
    cast:
      type: projectile
      speed: 2.5
      gravity: 0.05
      max_lifetime_ticks: 120
      # See `draw:`'s body note above. A real arrow, oriented along travel, inert in every other
      # way -- and mutually exclusive with `item:`, which the loader refuses rather than resolves.
      body: arrow
      # The same trail as `draw:`, and deliberately the same FILE: see its note there.
      trail: dragons_plume_trail
      # NO homing BLOCK, AND ITS ABSENCE IS THE RULING. Same as band 1 and for the same reason;
      # repeated at each binding rather than stated once, because an absence is invisible and a
      # reader checking THIS binding must not have to find the note on another one.
    on_hit:
      - type: damage
        amount: 17
        element: void

  # --- BAND 3: held 15-19 ticks, one tick short of a charged release ----------------------------
  tap3:
    cooldown_ticks: 0
    cast:
      type: projectile
      speed: 2.5
      gravity: 0.05
      max_lifetime_ticks: 120
      # See `draw:`'s body note above. A real arrow, oriented along travel, inert in every other
      # way -- and mutually exclusive with `item:`, which the loader refuses rather than resolves.
      body: arrow
      # The same trail as `draw:`, and deliberately the same FILE: see its note there.
      trail: dragons_plume_trail
      # NO homing BLOCK, AND ITS ABSENCE IS THE RULING -- and it matters most HERE. At 19 ticks held
      # this is one tick from a charged release that DOES home, for 34 rather than 26. The two
      # shots are adjacent in the player's hand and different in every other way; the absent block
      # is what makes that true.
    on_hit:
      - type: damage
        amount: 26
        element: void
