# THE LIVING LANTERN: the Mage's IRON tier, reworked (feat/living-lantern, 2026-11-22).
#
# Ben, 2026-11-22, verbatim (PLAN-weapon-tiers.md 1.8): "I think we'll take the Living Lantern and rework it for the
# iron tier weapon." / "1. The rework: I'm thinking of an almost Flamethrower-like weapon. An area of effect arc in
# front of the player that travels for about 6 blocks dealing a decent bit of damage. / 2. Fire element / 3. 12 mana
# 0.8s second cooldown 14 damage 60 degree arc / 4. Keep the lantern item, what was the old recipe?" Then, having seen
# the old recipe: "Before I sent this I would like to change the recipe" (eight iron nuggets round a fire charge).
#
# BEN'S NUMBERS: fire; 12 mana; 0.8 s = 16 ticks (on the 4-tick grid); 14 damage, a literal damage effect as the other
# staves; a 60-degree arc in front of him; it travels about 6 blocks; the lantern item; his recipe
# (content/recipes/living_lantern.yml).
# SEAT PLACEHOLDERS 2026-11-22, each marked where it sits: the id, the names and description, the rarity, the class,
# the material's use as the item, range 6.0, the 6-tick travel, the 60 degrees read as the FULL angle of a cone,
# one strike per body per cast with no falloff, blocks stopping it, and the old look and sounds.
#
# The old weapon (github.com/CreaperCrusher/Butterfly-SMP at cfde822, summon/weapons/LivingLanternWeapon.java): Common,
# a lantern, "Wandering Wisps", three slow homing wisps at 15 magic each, 12 mana, 2000 ms. BEN REPLACED THAT ABILITY
# AND THE RECIPE; only the item and the look carry over. NOTHING HERE IS TAKEN FROM A DELETED DEV WEAPON.
#
# NOT DURABLE, LIKE THE OTHER STAVES: a lantern has no vanilla durability, so it never wears or breaks, and Unbreaking
# can roll on it and grants nothing (NAME THE QUANTITY's eligibility half fails, as on the flint, crystal and knell
# staves; pinned in LivingLanternContentTest, carried open).
#
# A LANTERN PLACES AS A BLOCK, AND THIS ONE MUST NOT. Its own right-click is the cast: RpgListeners cancels the
# interaction whenever a held weapon binds right_click, fired or refused (READ). The OFF HAND is vanilla's there, so a
# minted weapon is also refused at BlockPlaceEvent (RpgListeners.onWeaponPlace), whatever hand placed it.

# The id is a SEAT PLACEHOLDER 2026-11-22 (kept off its own line: SelfTestWeaponIdsTest reads a bare `id:` line).
id: living_lantern
display_name: "Living Lantern"             # SEAT PLACEHOLDER 2026-11-22: the old weapon's name
element: fire                              # BEN: "Fire element"
rarity: common                             # SEAT PLACEHOLDER 2026-11-22: the iron sword's (and the old lantern's)
class: mage                                # SEAT PLACEHOLDER 2026-11-22
material: lantern                          # BEN: "Keep the lantern item"

# THE REWORK, 2026-11-23 (the seat's brief "THREE ENCHANT COLUMNS' WORTH OF WORK", PR B). Ben, verbatim: "Instead of
# the cone of fire, I want it to shoot a slow moving homing projectile similar to the old repo, only this time 1 shot
# instead of three." / "1. Damage 45 mana 12 cooldown 0.8s" / "2. 7 blocks a second is fine ... Reach increased to 28
# blocks for the normal projectile. ... Homing within 7 is fine." THE CONE IS GONE FROM THIS WEAPON: `type: cone` stays
# in the engine with its tests (CastSpec.Cone, CastExecutor.beginCone), and NO SHIPPED WEAPON USES IT NOW
# (LivingLanternContentTest.noShippedWeaponCastsACone). The 2026-11-22 numbers above (14, the 60-degree arc, 6 blocks)
# are the record of the cone; GATE-living-lantern.md's rows are history and are not edited.
triggers:
  right_click:
    name: "Lantern's Breath"               # SEAT PLACEHOLDER 2026-11-22, kept by the brief
    description:                           # SEAT PLACEHOLDER 2026-11-23: reworded for the homing shot
      - "Looses a slow, seeking flame"
      - "that hunts within 7 blocks."
    cooldown_ticks: 16                     # BEN: 0.8 s. On the 4-tick grid; not a basic attack, so no scaling
    cost:
      resource: mana
      amount: 12                           # BEN
    on_cast:
      - type: visual
        visual_id: lantern_cast            # SEAT PLACEHOLDER 2026-11-22: the old lantern place and allay-with-item
    cast:
      type: projectile
      speed: 0.35                          # BEN: "7 blocks a second" = 7 / 20 ticks = 0.35 blocks a tick
      gravity: 0                           # BEN's brief: no gravity
      # REACH, BEN'S 28 BLOCKS, IS CAPPED BY LIFETIME: the engine has no distance cap on a projectile (READ,
      # ProjectileFlight.step: it ends on a hit, or when its elapsed ticks reach max_lifetime_ticks, and goes off there).
      # Homing turns the velocity but keeps its length (ProjectileFlight.steer rescales to the same speed), so the path is
      # 0.35 a tick whatever it chases: 28 / 0.35 = 80 ticks. The last step lands at 80 x 0.35 = 28.0 blocks of travel.
      max_lifetime_ticks: 80
      trail: lantern_front                 # SEAT PLACEHOLDER 2026-11-23: the cone's front (the old FLAME and orange dust), reused as the trail
      homing:
        lerp: 0.45                         # SEAT PLACEHOLDER 2026-11-23: the old repo's LIVING_LANTERN_HOMING_TURN (READ by the seat at cfde822)
        activation_blocks: 0               # SEAT PLACEHOLDER 2026-11-23: it seeks from the muzzle, as the Crystal Shard Staff's does
        search_radius: 7                   # BEN: "Homing within 7"
    on_hit:
      - type: visual
        visual_id: lantern_hit             # SEAT PLACEHOLDER 2026-11-22: the old lantern break on hit
      - type: damage                       # BEN: 45, fire. A literal damage effect, as the other staves
        amount: 45
        element: fire
    # FIRE'S BURN, NAMED TERM BY TERM (READ: content/elements/fire.yml `applies_status: scorch`; core Scorch): a fire hit
    # accrues SCORCH when it lands (one stack per 2 damage dealt, a yes/no gate). The burn deals min(5% of the victim's
    # MAX health, the cap) every Scorch.PERIOD_TICKS (20), for Scorch.DEFAULT_DURATION_TICKS (120; this ability authors
    # no duration), and the cap is the hit's damage x Scorch.CAP_FRACTION (0.5): 45 x 0.5 = 22.5 at score 100. On a
    # 100-max mob that is min(5.0, 22.5) = 5.0 a burn. A scorched mob that dies Ignites (Ignite.DAMAGE 6, fire, to every
    # non-player within 4, 20 ticks later). None of it is new: the cone's 14 bought the same burn at a cap of 7.

# NO craft_result, as on the other staves: it would claim every vanilla lantern. The recipe claims this weapon:
# content/recipes/living_lantern.yml. It joins NO loot pool.
