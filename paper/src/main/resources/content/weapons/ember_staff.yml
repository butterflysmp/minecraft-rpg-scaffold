# The Mage's primary: a fire staff. Where the bow's shot is FREE and sustained, the staff's
# is COSTED and burst -- high-per-hit, slower, and it spends the same mana pool the Mage's
# spells do. That shared budget is the whole of the Mage identity: the verb is commit. You
# cannot spam the staff and grenade and lance; you pick your moments.
#
# blaze_rod is the staff item (per-weapon material, from the bow commit). Reuses the shipped
# solar_detonation visual and scorch status, so no new visual/status files.
#
# THIS IS A DEV/TEST FIXTURE AND IS NOT BALANCED. It is not meant to be.
#
# Said out loud because from slice 7 the roster contains a COMMON staff -- the Flint Staff, 20
# damage on a 24-tick cooldown for 5 mana -- that out-damages this RARE one (16 in a burst, on a
# 20-tick cooldown, for 30 mana). A rare item doing less than a common one is otherwise a bug report
# waiting to happen, and the answer is that neither number was chosen against the other: the Flint
# Staff's are the old repo's, kept deliberately, and these exist to exercise the burst/cost path.
#
# Do not "fix" the discrepancy by retuning this file in isolation. Rebalancing is its own pass.

id: ember_staff
display_name: "Ember Staff"
element: fire
rarity: rare
class: mage
material: blaze_rod

triggers:
  # Costed burst bolt. cost 30, cooldown 20 (burst, not the bow's sustained 15). Left-click
  # is unbound -- a staff is not a melee weapon.
  right_click:
    name: "Ember Bolt"
    description:
      - "A costed burst of fire —"
      - "commit your mana to cast."
    cooldown_ticks: 20
    cost:
      resource: mana
      amount: 30
    cast:
      type: projectile
      speed: 2.0
      gravity: 0.03
      max_lifetime_ticks: 80
    on_hit:
      - type: visual
        visual_id: solar_detonation
      - type: burst
        radius: 3.5
        effects:
          - type: damage
            amount: 16
            element: fire
          - type: status
            status_id: scorch
            duration_ticks: 60
