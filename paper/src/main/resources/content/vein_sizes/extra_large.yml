# A vein size: a patch's footprint on the wall, and how many weak spots it rolls. Mining S2.
#
# Read by MiningContentLoader (PLAN-mining.md sections 5.3 and 5.12). Every number is REQUIRED.
# NAME THE QUANTITY: width and height are whole blocks of wall; spots.min/max are whole spots per
# patch, rolled uniformly in the range, inclusive. VeinSize refuses a spots.max above the worst-case
# guarantee for the footprint, which for this size is 84 (executed, PLAN-mining.md 5.12).

vein_sizes:

  extra_large:
    # Ben's design doc, relayed by the seat 2026-11-14 (NOT Ben's words in chat): 7 x 4 blocks,
    # 8-9 spots.
    width: 7        # blocks along the face, as the player sees it
    height: 4       # blocks up the face
    spots:
      min: 8
      max: 9
