# The vein sizes: a patch's footprint on the wall, and how many weak spots it rolls.
#
# Read by MiningContentLoader (PLAN-mining.md section 5.3). Every number is REQUIRED; a missing
# one is refused by name rather than defaulted, because a defaulted 0 would load quietly wrong.
#
# NAME THE QUANTITY:
#   width, height   whole blocks of wall. One flat model is scaled to (width, height), so there
#                   is no model-element limit on them.
#   spots.min/max   whole spots per patch, rolled uniformly in the range, inclusive, at every
#                   regrowth. max may not exceed the number of non-overlapping 5 x 5 pixel boxes
#                   the patch can hold (VeinSize refuses it otherwise).
#
# Slice 1 shipped only the small vein (Ben, 2026-11-13: "keep it as the small vein for now"). Mining
# S2 adds the other three of his design, one file each: medium.yml, large.yml, extra_large.yml.
# A slot is placed at a MAXIMUM size, and each patch rolls a size that fits it (both width and height
# at most the maximum's), so the sizes are compared by their width and height here.

vein_sizes:

  small:
    # RULED, Ben 2026-11-13. Asked "Small vein is 3 wide by 2 tall with 2-3 spots, as your doc's
    # table says. Is that right?", he said "yes".
    width: 3        # blocks along the face, as the player sees it
    height: 2       # blocks up the face
    spots:
      min: 2
      max: 3
