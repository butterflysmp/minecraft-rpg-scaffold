# The Living Lantern's front (SEAT PLACEHOLDER 2026-11-22): the old weapon's FLAME and orange dust (DUST RGB 255,140,0,
# cfde822), drawn each tick of the cone's travel at its centre and 8 points round its edge (ConeShell.frontPoints).
# NO SOUND STEP: ContentValidator refuses one in a front, which plays at every point on every tick.
steps:
  - type: particle
    particle: FLAME
    count: 3
    spread: 0.15
    speed: 0.01
  - type: particle
    particle: DUST
    color: [255, 140, 0]
    size: 1.3
    count: 2
    spread: 0.15
    speed: 0.0    # inert for DUST
