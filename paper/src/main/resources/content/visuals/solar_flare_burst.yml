# SOLAR FLARE'S BURST: presented ONCE where each fireball bursts. Ben, 2026-11-28: "I want to change the particles to a
# firework-style explosion", then: "I don't want a firework, I want a fireball that explodes like a firework".
#
# ROUTE B (the seat's N4): BUILT FROM PARTICLES AND SOUNDS, NO FIREWORK ENTITY. READ (javap, the pinned 26.1.2 server,
# FireworkRocketEntity.dealExplosionDamage): a real firework's explosion, when it carries any star, hurts EVERY living
# body within 5 blocks with a clear line, players included, for (5 + 2 x stars) x sqrt((5 - d) / 5), through hurtServer
# with a fireworks damage source; with no star it hurts nothing and draws no coloured burst. Route A (the real effect, its
# damage cancelled) needs its worst case EXECUTED through the real functions at a row's state (S-1), and that path runs
# through vanilla's hurtServer and our own damage routing, which only a live server runs. So Route A's zero could not be
# proven for every body: Route B, as the seat ruled for that case.
#
# WHAT IT DRAWS (every number a SEAT PLACEHOLDER 2026-11-28, OPEN FOR BEN; "orange and yellow, a large ball, a firework
# blast sound"):
# - an ORANGE ball and a YELLOW one: TRAIL particles thrown from the burst point to points spread evenly over a sphere
#   (burst_radius; core.shape.SphereDirections). READ, the client's TrailParticle.tick: each moves 1 / (lifetime - age) of
#   the way to its target every tick, so it flies out in a straight line at a steady speed, reaches the sphere on its last
#   tick, and is gone: the orange ball grows to 6 blocks (the burst's own reach) in 10 ticks, the yellow to 4.5 inside it.
# - white firework sparks thrown outward (FIREWORK, the firework's own spark, no data).
# - the large firework blast and its twinkle (entity.firework_rocket.large_blast and .twinkle, both READ in SoundEvents on
#   the pinned server jar).
#
# SEEN AND HEARD FROM 32 BLOCKS (the seat's Q1, 2026-11-28; every particle step long_distance, both sounds at volume 3.0).
# READ by javap: without force the server sends a particle only within 32.0 of his block's centre (ServerLevel
# .sendParticles) and his client drops one beyond 32 from the camera (ClientLevel.doAddParticle); a range burst's centre is
# 32.0 out at his eye's height, about 32.02 from his block centre, so none of it was sent. long_distance is spawnParticle's
# force: sent to 512, and drawn by the client whatever the distance or his particle setting. A sound reaches 16 x volume
# (the server's send, SoundEvent.getRange; the client's hearing, max(volume, 1) x 16, sounds.json setting no attenuation for
# these): 2.0 and 1.5 reached 32 and 24, short of 32.04; 3.0 reaches 48. How LOUD a volume above 1 plays was not READ.
steps:
  - type: particle
    particle: TRAIL
    long_distance: true
    count: 90
    color: [255, 120, 0]
    duration_ticks: 10
    burst_radius: 6.0
  - type: particle
    particle: TRAIL
    long_distance: true
    count: 60
    color: [255, 220, 40]
    duration_ticks: 10
    burst_radius: 4.5
  - type: particle
    particle: FIREWORK
    long_distance: true
    count: 40
    spread: 0.2
    speed: 0.3
  - type: sound
    key: entity.firework_rocket.large_blast
    volume: 3.0
    pitch: 1.0
  - type: sound
    key: entity.firework_rocket.twinkle
    volume: 3.0
    pitch: 1.0
