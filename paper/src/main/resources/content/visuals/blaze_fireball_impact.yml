# Where the Blaze King's Staff's fireball lands: a burst of flame, a few lava drips, a fire-charge crack.
# Id is the filename: blaze_fireball_impact.
#
# PROVISIONAL (Ben, Q-B6, 2026-09-29: "use the old sounds and effects"). cfde822 StaffListener.onBlazeFireballHit,
# on every ProjectileHitEvent, entity or block, at the fireball:
#   spawnParticle(FLAME, loc, 18, 0.25, 0.25, 0.25, 0.06)
#   spawnParticle(LAVA,  loc,  5, 0.1,  0.1,  0.1,  0)
#   playSound(loc, ITEM_FIRECHARGE_USE, 1.0, 1.3)
# cfde822's offsets were equal on all three axes, so each is one `spread` here; its `extra` is `speed`.
#
# NOTE: it plays on a MISS too, where the 160-tick fuse runs out in mid-air (see blaze_kings_staff.yml).
#
# `speed` is authored on BOTH particle steps: the schema default is 1.0 (VisualSpec.Particles), seventeen times the
# flame's 0.06. The sound key is already shipped in flint_impact.yml, verified there against the pinned jar.

steps:
  - type: particle
    particle: FLAME
    count: 18
    spread: 0.25
    speed: 0.06

  - type: particle
    particle: LAVA
    count: 5
    spread: 0.1
    speed: 0.0

  - type: sound
    key: item.firecharge.use
    volume: 1.0
    pitch: 1.3
