# The ores a patch can be made of.
#
# Read by MiningContentLoader (PLAN-mining.md section 5.3). Every number is REQUIRED; a missing
# one is refused by name rather than defaulted, because 0 is a legal payout and a defaulted 0
# would ship a patch that pays nothing and says nothing.
#
# NAME THE QUANTITY:
#   payout.per_spot.min/max     whole items per spot. Each spot in the patch is rolled on its
#                               own, uniformly in the range, inclusive, at the break.
#   payout.completion_bonus     whole items added once per break, KEYED BY VEIN SIZE. It must
#                               have exactly one entry per size in sizes:, no more and no fewer.
#   regrowth_ticks              SERVER ticks before a broken patch comes back for that player.
#                               Under 20 TPS a "minute" is longer in real time.
#   Every count is flat: no percentages and no multipliers.
#
# THE PAYOUT ITEM IS A PLAIN VANILLA ITEM, NOT MINTED. So the "no custom item stacks above 1"
# standing decision does not reach it, and raw iron stacks to 64 as it always has. A future minted
# drop would re-open that question (PLAN-mining.md, the seat's diff of 2026-11-13).

ores:

  iron:
    # RULED, Ben 2026-11-13: "let's keep it vanilla for now, we'll do iron".
    display_name: "Iron"
    payout:
      # RULED, Ben 2026-11-13: "raw iron".
      item: raw_iron
      # RULED, Ben 2026-11-13: "2-4 per spot with a 5 completion bonus". And for every size, Ben
      # 2026-11-14, asked whether per-spot yield stays 2-4 for every size: "yes".
      per_spot:
        min: 2
        max: 4
      # Keyed by vein size: exactly one entry per size in sizes:. small 5 is RULED (Ben 2026-11-13).
      # medium 6, large 8, extra_large 10: Ben 2026-11-14, "This is fine for now. Tuning will come later".
      # Executed ranges per break (PLAN-mining.md 5.12), spots from the vein size files:
      #   small 2-3 spots: 9..17;  medium 4-5: 14..26;  large 6-7: 20..36;  extra_large 8-9: 26..46.
      completion_bonus:
        small: 5
        medium: 6
        large: 8
        extra_large: 10
    # RULED, Ben 2026-11-13: "1 minute is fine for now". 60 s x 20 ticks. And for every size, Ben
    # 2026-11-14: "Regrowth can be 1 minute across the board".
    regrowth_ticks: 1200
    # S2: each patch ROLLS ITS SIZE when it is created (first show and every regrowth), from these
    # weights, over the sizes that fit the slot (width and height both at most the slot's maximum),
    # renormalised over those. Ben 2026-11-14: "The end goal is for patches to grow of random sizes
    # and ores and types".
    # NAME THE QUANTITY: a relative roll weight, a whole number at least 1. A size's chance at a slot is
    # its weight over the sum of the eligible weights: at a medium slot, small 50/80 and medium 30/80.
    # The weights are Ben's design doc, relayed by the seat: PROVISIONAL.
    sizes:
      small: 50          # PROVISIONAL (design doc, relayed)
      medium: 30         # PROVISIONAL (design doc, relayed)
      large: 15          # PROVISIONAL (design doc, relayed)
      extra_large: 5     # PROVISIONAL (design doc, relayed)
    # item_model ids in the project resource pack. S2: one flat patch model per size, at that size's
    # aspect (the seat's ruling 6); PLACEHOLDER textures, the look is Ben's later.
    models:
      patch:
        small: rpg:mining/iron_patch_small
        medium: rpg:mining/iron_patch_medium
        large: rpg:mining/iron_patch_large
        extra_large: rpg:mining/iron_patch_extra_large
      spot: rpg:mining/spot
      crack: rpg:mining/crack
    # PLACEHOLDER vanilla sounds (the seat's ruling 4, 2026-11-13), played to the one player only.
    # Ben ruled a miss makes a sound ("yes"; his design doc mentions "a dull clink"). An uncharged
    # hit and a click on a regrowing patch play nothing. S2: the miss sound has a cooldown of 8 server
    # ticks per player from the last one that PLAYED (Ben 2026-11-14: "let's say .4 seconds"). It is
    # one value for every ore, so it is code, MiningNotices.MISS_SOUND_COOLDOWN_TICKS, not a key here.
    sounds:
      miss: minecraft:block.stone.hit       # PLACEHOLDER
      break: minecraft:block.stone.break    # PLACEHOLDER
      # S2 (the seat's ruling 8): played to the one player when a DENIED hold STARTS with no hold
      # already live. Ben 2026-11-14: "Placeholder for now is fine".
      denied: minecraft:entity.villager.no  # PLACEHOLDER
    # PLACEHOLDER vanilla particle for the break (the seat's ruling 7), shown to the one player only.
    # It must be a particle that needs no data: a block or dust particle cannot be spawned bare, and
    # ContentValidator refuses one.
    particles:
      break: minecraft:poof                 # PLACEHOLDER
