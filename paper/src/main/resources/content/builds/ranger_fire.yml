# The Fire Ranger's POOL: everything this cell offers, and the loadout it casts until the player
# chooses their own (PLAN-build-system.md section 2.2). Replaces kits/ranger_fire.yml in slice 2.
#
# Ultimate vs Active is decided HERE, by the list an id sits in -- not by the ability file.
#
# `default` is what the Ability Stone casts in slice 1: left = active 1, right = active 2, Q = the
# ultimate (ruling 2). Its choice is a PLACEHOLDER (section 4) drawn from shipped abilities: rekindle's
# only playable route was the old ability_stone weapon, deleted in the same slice, so it becomes an
# Active here.
#
# arc_surge is element: nature, and whether it stays in a FIRE pool is PARKED, unanswered (section 5).
# Until ruled it stays, as the kit carried it, and it is in no default loadout.

class: ranger
element: fire
display_name: "<gold>Fire Ranger</gold>"

ultimates:
  - ultimate_placeholder_ranger
actives:
  - rekindle
  - solar_lance
  - arc_surge

default:
  ultimate: ultimate_placeholder_ranger
  actives: [rekindle, solar_lance]    # left, right
