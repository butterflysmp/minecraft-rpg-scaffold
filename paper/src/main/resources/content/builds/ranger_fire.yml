# The Fire Ranger's POOL: everything this cell offers, and the loadout it casts until the player
# chooses their own (PLAN-build-system.md section 2.2). Replaced kits/ranger_fire.yml, which slice 2 removed.
#
# Ultimate vs Active is decided HERE, by the list an id sits in -- not by the ability file.
#
# `default` is what the Ability Stone casts in slice 1: left = active 1, right = active 2, Q = the
# ultimate (ruling 2). Its choice is a PLACEHOLDER (section 4) drawn from shipped abilities.
#
# recall (was rekindle, ruling 24) is CLASS-WIDE: it is listed in ranger.yml and merged in at load (section 7.1),
# so it is NOT listed below -- listing it here too is refused. The default still names it.
#
# arc_surge -- since deleted -- was a nature placeholder in this pool; ruling 20 (2026-09-26) removed
# it, closing section 5's parked question.

class: ranger
element: fire
display_name: "<gold>Fire Ranger</gold>"

ultimates:
  - ultimate_placeholder_ranger
actives:
  - solar_lance                     # + recall, class-wide (ranger.yml)
# PLACEHOLDER -- Ben designs. Slice 4's fragments (PLAN-build-system.md section 2.3): the same five
# placeholders in both cells, so each cell can fill its four slots. One of each (ruling 11).
fragments:
  - fragment_vigor
  - fragment_focus
  - fragment_keen
  - fragment_mending
  - fragment_ward
  # Section 7.3, ruling 27: a BEHAVIOUR fragment on recall -- Rekindle's three embers.
  - fragment_ember_cache
# PLACEHOLDER -- Ben designs. Slice 5's aspects (PLAN-build-system.md section 2.4): each targets one of
# THIS pool's abilities (the loader refuses one that does not). Two slots; the same aspect twice is refused.
aspects:
  - searing_lance
  # banked_embers -- since deleted (ruling 26). updraft: rulings 28-30, section 7.4.
  - updraft

default:
  ultimate: ultimate_placeholder_ranger
  actives: [recall, solar_lance]      # left, right
