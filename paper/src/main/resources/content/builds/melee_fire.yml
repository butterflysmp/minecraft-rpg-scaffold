# The Fire Melee's POOL (PLAN-melee-class.md section 7, slice M1; ruling A: the first melee cell is fire).
#
# EVERY ABILITY AND ASPECT HERE IS A PLACEHOLDER, and the cell exists now so a Melee player exists to feel
# Sunder when it lands (section 9.1). The display name is Ben's (Q7, 2026-09-29).
#
# SUNDER IS CLASS-WIDE (section 4): it is listed in melee.yml and merged in at load, so it is NOT listed below
# -- listing it here too is refused. The default still names it: [sunder, active_placeholder_melee], left =
# Sunder (Q7). M2 deleted active_placeholder_melee_thrust, which held Active 1 until then. A player whose SAVED
# loadout names it reads that slot as EMPTY until they pick again (LoadoutResolution rule 2), never the default.
#
# The fire element does work: every hit below accrues Scorch (elements/fire.yml, applies_status). Sunder
# is kinetic and will not.

class: melee
element: fire
display_name: "<gold>Fire Melee</gold>"

ultimates:
  - ultimate_placeholder_melee
actives:
  - active_placeholder_melee          # + sunder, class-wide (melee.yml)
# PLACEHOLDER -- Ben designs. The shared five (ruling 11: one of each). NOT fragment_ember_cache: it is a
# behaviour fragment on recall, which this pool does not offer, and the loader refuses it (section 2.3).
fragments:
  - fragment_vigor
  - fragment_focus
  - fragment_keen
  - fragment_mending
  - fragment_ward
# PLACEHOLDER -- Ben designs. Numbers-only, each on one of THIS pool's placeholders; none on Sunder.
aspects:
  - keen_arc
  - restless_quake

default:
  ultimate: ultimate_placeholder_melee
  actives: [sunder, active_placeholder_melee]    # left, right (Q7: left = Sunder)
