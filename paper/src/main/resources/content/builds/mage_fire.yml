# The Fire Mage's POOL (PLAN-build-system.md section 2.2). Replaced kits/mage_fire.yml, which slice 2 removed.
#
# The default loadout is a PLACEHOLDER (section 4), drawn from the three abilities the removed Mage kit granted.
# solar_lance is also a Ranger Active; one ability in two pools is allowed, and its cooldown is shared
# (keyed by ability id, section 2.6).

class: mage
element: fire
display_name: "<gold>Fire Mage</gold>"

ultimates:
  - ultimate_placeholder_mage
actives:
  - ember_step
  - solar_grenade
  - solar_lance
# PLACEHOLDER -- Ben designs. Slice 4's fragments (PLAN-build-system.md section 2.3): the same five
# placeholders in both cells, so each cell can fill its four slots. One of each (ruling 11).
fragments:
  - fragment_vigor
  - fragment_focus
  - fragment_keen
  - fragment_mending
  - fragment_ward
# PLACEHOLDER -- Ben designs. Slice 5's aspects (PLAN-build-system.md section 2.4): each targets one of
# THIS pool's abilities (the loader refuses one that does not). Two slots; the same aspect twice is refused.
aspects:
  - cinder_wake
  - lingering_sun

default:
  ultimate: ultimate_placeholder_mage
  actives: [ember_step, solar_grenade]    # left, right
