# *** FILTERED BY MAVEN. Do not edit the value; edit the property that feeds it. ***
#
# The build this jar was made from, so a server log can say WHICH BUILD RAN.
#
# `build.commit` defaults to `unknown` in the parent pom. `scripts/dev-server.sh` overrides it with
# `git rev-parse --short HEAD`, plus a `-dirty` suffix when the working tree has uncommitted
# changes -- because a jar built from a modified tree is not any commit, and saying a bare hash
# there would be a lie with a plausible shape.
#
# *** SO `unknown` IS INFORMATION, NOT A FAILURE. *** It means the jar was NOT built by
# dev-server.sh -- a hand `./mvnw package`, an IDE build, someone else's tree -- and that is exactly
# the case a boot reading needs to know about. See GATE R0's startup-line convention in
# .claude/rules/verification.md.
commit=${build.commit}
