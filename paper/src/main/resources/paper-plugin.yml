name: Rpg
version: '${project.version}'
main: io.github.butterflysmp.rpg.paper.RpgPlugin
description: Class-based action RPG
authors: [ CreaperCrusher ]

# Minimum server version, not the pinned one. Minecraft moved to year-based
# versioning at 26.1, and Paper accepts the drop-level string here.
#
# Confirmed loading: Paper 26.1.2 build 74. Not assumed -- the plugin enabled and
# logged its content counts. Any other drop is untested.
api-version: '26.1'

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

# An undeclared node defaults to op-only, so a missing entry here silently locks
# players out of their own abilities. Keep this in step with Permissions.java.
permissions:
  rpg.command.cast:
    description: Cast an ability. Everyone -- this is the game.
    default: true
  rpg.command.stats:
    description: Read your own stat sheet. Everyone -- knowing your build is the game too.
    default: true
  rpg.command.admin:
    description: Inspect loaded ability content.
    default: op
  rpg.command.give:
    description: Mint a weapon into your inventory.
    default: op
  rpg.command.dev:
    description: Apply any status to a mob for testing.
    default: op
  rpg.command.menu:
    description: Open the Nexus hub with /menu. Everyone -- it is the door to the game,
      and it is the ONLY route once a player turns the Nexus star off.
    default: true
  # One per Nexus screen (Ben, 2026-09-29: "Names are good"). Everyone; the level gates
  # still apply, in NexusScreens. The names are NexusScreens.Screen's, and
  # ScreenPermissionsTest keeps the two lists in step.
  rpg.command.level:
    description: Open your level screen with /level.
    default: true
  rpg.command.build:
    description: Open the Build screen with /build.
    default: true
  rpg.command.gear:
    description: Open the Equipment screen with /gear.
    default: true
  rpg.command.vault:
    description: Open your vault with /vault (level 20, as from the hub).
    default: true
  rpg.command.anvil:
    description: Open the Nexus anvil with /anvil (level 7, as from the hub).
    default: true
  rpg.command.craft:
    description: Open the Nexus crafting grid with /craft (level 3, as from the hub).
    default: true
  rpg.command.recipes:
    description: Browse what you can craft with /recipes (crafting's level 3).
    default: true
  rpg.command.enchanting:
    description: Open the Nexus enchanting table with /enchanting (level 10, as from the hub).
    default: true
  rpg.command.grindstone:
    description: Open the Nexus grindstone with /grindstone (level 13, as from the hub).
    default: true
  rpg.command.settings:
    description: Open the Nexus settings with /settings.
    default: true
