# GATE-wither-status.md (#173): the CORE rows WS-C (run first, WS3's negative control), WS1, WS2b, WS2c and WS3.
# t is the row's target, n its neighbour. /rpg apply and /rpg mobdamage act on the mob the player looks at, so every
# target is faced with the gate's own tp first.
setup:
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# WS-C: a plain death does not blast. Two knells side by side; the first dies to /rpg mobdamage.
WS-C:
  - cmd: "kill @e[tag=t]"
  - cmd: "kill @e[tag=n]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg spawn knell"
  - cmd: 'data merge entity @e[type=wither_skeleton,tag=!t,tag=!n,sort=nearest,limit=1] {NoAI:1b,PersistenceRequired:1b,Tags:["t","selftest"]}'
  - cmd: "tp @e[tag=t,limit=1] ~4 ~ ~0"
  - cmd: "rpg spawn knell"
  - cmd: 'data merge entity @e[type=wither_skeleton,tag=!t,tag=!n,sort=nearest,limit=1] {NoAI:1b,PersistenceRequired:1b,Tags:["n","selftest"]}'
  - cmd: "tp @e[tag=n,limit=1] ~4 ~ ~2"
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - probe: n
  - cmd: "rpg mobdamage 1000000"
  - wait: 40
  - probe: t
  - probe: n

# WS1: the clock and the percent arm on a GS-20 zombie: five DOTTICK lines, 40 apart.
WS1:
  - cmd: "kill @e[tag=t]"
  - cmd: "kill @e[tag=n]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg spawn zombie 20"
  - cmd: 'data merge entity @e[type=zombie,tag=!t,tag=!n,sort=nearest,limit=1] {NoAI:1b,PersistenceRequired:1b,Tags:["t","selftest"]}'
  - cmd: "tp @e[tag=t,limit=1] ~4 ~ ~0"
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 240
  - probe: t

# WS2b: the cap binds on a GS-100 zombie.
WS2b:
  - cmd: "kill @e[tag=t]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: 'summon zombie ~4 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 240
  - probe: t

# WS2c: immunity. The Knell, then a wither skeleton, each refused with no DOTTICK over 240 ticks; then the zombie
# control, which applies and ticks.
WS2c:
  - cmd: "kill @e[tag=t]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - note: "the Knell"
  - cmd: "rpg spawn knell"
  - cmd: 'data merge entity @e[type=wither_skeleton,tag=!t,tag=!n,sort=nearest,limit=1] {NoAI:1b,PersistenceRequired:1b,Tags:["t","selftest"]}'
  - cmd: "tp @e[tag=t,limit=1] ~3 ~ ~0"
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 240
  - probe: t
  - note: "a wither skeleton"
  - cmd: "kill @e[tag=t]"
  - cmd: 'summon wither_skeleton ~3 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["t","selftest"]}'
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 240
  - probe: t
  - note: "the control: a GS-100 zombie"
  - cmd: "kill @e[tag=t]"
  - cmd: 'summon zombie ~3 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 60
  - probe: t

# WS3: a never-scorched GS-20 zombie at 1/20 dies to Wither; its neighbour two blocks away does not move.
WS3:
  - cmd: "kill @e[tag=t]"
  - cmd: "kill @e[tag=n]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg spawn zombie 20"
  - cmd: 'data merge entity @e[type=zombie,tag=!t,tag=!n,sort=nearest,limit=1] {NoAI:1b,PersistenceRequired:1b,Tags:["t","selftest"]}'
  - cmd: "tp @e[tag=t,limit=1] ~4 ~ ~0"
  - cmd: 'summon zombie ~4 ~ ~2 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["n","selftest"]}'
  - wait: 5
  - cmd: "tp @s ~ ~ ~ facing entity @e[tag=t,limit=1] eyes"
  - probe: t
  - probe: n
  - cmd: "rpg mobdamage 19"
  - wait: 2
  - probe: t
  - cmd: "rpg apply withering 200"
  - wait: 60
  - probe: t
  - probe: n
