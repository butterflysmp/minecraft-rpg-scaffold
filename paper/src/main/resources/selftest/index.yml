# /rpg selftest's gates, in BOOT ORDER (PLAN-selftest.md section 5). `/rpg selftest all` walks them in this order,
# each gate's `setup:` first, then its rows in file order. Each name is a gate file under docs/gates/:
# melee-cell is docs/gates/GATE-melee-cell.md, and its scenarios are selftest/GATE-melee-cell.yml.
# SelfTestScenariosTest pins that every scenario key here is a `### <id> ` heading in its gate.
# ONE EXCEPTION, the seat's ruling of 2026-11-15: dragon-bodies, dragon-split and dragon-growth are paired with
# docs/gates/GATE-dragon-fix.md, not their own gate files (SelfTestScenariosTest.docOf). Their rows since the first boot
# of the dragon stack are that gate's re-predictions, and keeping three files kept Ben's three selftest commands.
# dragon-blast (step R3, 2026-11-15) is paired with its OWN gate file, docs/gates/GATE-dragon-blast.md, by the rule.
# dragon-beam (step R5, 2026-11-17) is paired with its OWN gate file, docs/gates/GATE-dragon-beam.md, by the rule.
# dragon-teleport (step R6, 2026-11-17, stacked on R5) is paired with docs/gates/GATE-dragon-teleport.md, by the rule.
# A SECOND EXCEPTION, the seat's brief of 2026-11-17 (the Knell follow-up): dragon-beam and dragon-teleport are now BOTH
# paired with docs/gates/GATE-dragon-knell-2.md (SelfTestScenariosTest.docOf), as the three dragon gates are with
# GATE-dragon-fix.md: their rows are that gate's re-predictions, and keeping two files kept Ben's two commands.
# THEN, Ben's re-timing of 2026-11-17 (KNELL 3): both are now paired with docs/gates/GATE-dragon-knell-3.md instead.
# THEN, Ben's one more number (KNELL 4): dragon-teleport is paired with docs/gates/GATE-dragon-knell-4.md; dragon-beam stays
# with GATE-dragon-knell-3.md (its lines do not change at a 28-tick delay).
# THEN, Ben's second bell (still KNELL 4): BOTH are paired with docs/gates/GATE-dragon-knell-4.md (the beam rows print
# the new sound lines).
# THEN, the shot in the middle (KNELL 5): BOTH are paired with docs/gates/GATE-dragon-knell-5.md.
# implosion-drag (the drag, 2026-11-18) is paired with its OWN gate file, docs/gates/GATE-implosion-drag.md, by the rule.
# Every dragon-blast row that blows a Phage moved there; dragon-blast stays paired with GATE-void-implosion.md.
