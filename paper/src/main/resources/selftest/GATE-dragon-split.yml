# GATE-dragon-split.md's rows, RE-RUN after the 2026-11-15 boot. The rows here are GATE-dragon-fix.md's (DS1R2 ...),
# each named for the row of GATE-dragon-split.md it re-predicts; SelfTestScenariosTest pairs this file with
# GATE-dragon-fix.md. The old rows' predictions and readings stay in GATE-dragon-split.md, as they are.
#
# 2026-11-16, STEP R3 MOVED FOUR ROWS OUT OF THIS FILE (the seat's brief; GATE-dragon-fix.md's dated note). Every row
# that splits a stage 5 left two LIVE children beside the player, and from R3 a live Phage within 3 blocks blows. DS1R2,
# DS2R2, DS5R2 and DS6R2 are re-predicted in GATE-dragon-blast.md as DS1R3, DS2R3, DS5R3 and DS6R3, where a frozen
# parent's children are born frozen (SelfTestSnapshot.freezeSplitChild) and DS1R3 thaws its own on purpose. Their old
# predictions and readings stay in GATE-dragon-fix.md. DS3R2 and DS4R2 split nothing and stay, unchanged.
#
# WHAT CHANGED (GATE-dragon-fix.md, D2, D3): every Phage is spawned by the SPAWN step, tagged and frozen inside its
# pre-spawn consumer, never by a nearest-mob selector afterwards; the setup declares the difficulty; every row-start
# clean is followed by a LEFTOVER line. DS1R2 kills with the EMBERBLADE, one of our weapons: a vanilla iron sword deals
# NO custom damage to a custom mob by design (RpgListeners.onPlayerMeleeAttack tokens the vanilla hit to 0.01, and
# WeaponFire.landVanillaMelee deals nothing for an item with no weapon id), which is why DS1 did not kill on
# 2026-11-15. DS1R2 also reads S1 and S2 on the server: the two children exist, and each targets the player.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first. The Phage is spawned three blocks east. A split child takes ALL its
# parent's tags (SelfTestSnapshot.tagsForSplitChild) but NOT its NoAI, so the children carry the row's tag, "t" and
# "selftest", move, and are removed by the row-start clean and the restore.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DS3R2: a stage 3 killed: no split.
DS3R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds3 frozen phage stage 3 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=ds3]"
  - wait: 5
  - probe_entities: "creeper 16"

# DS4R2: a stage 1 killed: no split.
DS4R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds4 frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=ds4]"
  - wait: 5
  - probe_entities: "creeper 16"
