# GATE-mana-battery (docs/gates/GATE-mana-battery.md): MANA BATTERY (B1 to B6) and the owed V7 rows, 2026-11-27, typed
# LAST in the one command that re-reads GATE-held-target's S3 and S5 by reference:
#   /rpg selftest held-target.S3.S5+mana-battery
# SURVIVAL. On the pad, at night (18000), difficulty normal. ALL AUTO: this gate asks NOTHING. EVERY ROW STAGES ITSELF:
# level 1, an empty inventory and state, empty accessory slots, a mage, his four armour slots emptied and then filled
# only with the row's own pieces, his mana set by the row. No mob is summoned. SAFETY 0.000: no row deals him damage.
# A minted piece is worn as GATE-armor-sets does: an empty hand, /rpg give (it lands in the hand), the enchant put on it in
# the hand, then `item replace entity @s armor.<slot> from entity @s weapon.mainhand` and the hand emptied. Each wear
# waits 10 (two reconcile passes of 5) before the sheet is read.
setup:
  - pad: ""
  - preflight: "0 -2 2 2"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "item replace entity @s armor.head with minecraft:air"
  - cmd: "item replace entity @s armor.chest with minecraft:air"
  - cmd: "item replace entity @s armor.legs with minecraft:air"
  - cmd: "item replace entity @s armor.feet with minecraft:air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""
  - cmd: "rpg stats"

# AC1, V7 (a): the pad step emptied his accessory slots, so the row's own clear finds nothing to clear. The pad step's
# ACCESSORIES line (this gate's setup, and held-target's) and the run's RESTORED line are this row's other readings.
AC1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - class: "mage"
  - accessory: "clear"
  - wait: 6

