# GATE-true-tooltips (docs/gates/GATE-true-tooltips.md): a weapon's stat and ability lines are its own active enchants'.
# Typed as ONE command with #312's two owed rows, by reference:
#   /rpg selftest true-tooltips+broken-bottle.BB2R+armor-sets.AS15R2
# SURVIVAL. On the pad, facing east, at NIGHT (18000), difficulty normal. ALL AUTO except TT19, the one ASK, last.
# Nothing is asked of his ground, position or inventory: every row clears his storage, his state and his four armour
# slots, gives itself what it holds, and stages its own score (100 unless the row says) and enchants (`rpg enchant clear`
# first, then candidate / level / active on the HELD item). His level is set to 1 in the setup; only TT17 changes it (to
# 13, for the table) and it puts it back. SAFETY (the gate file): NO row deals him damage; every mob is a NoAI zombie.
setup:
  - pad: ""
  - preflight: "-2 -6 45 10"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "item replace entity @s armor.head with minecraft:air"
  - cmd: "item replace entity @s armor.chest with minecraft:air"
  - cmd: "item replace entity @s armor.legs with minecraft:air"
  - cmd: "item replace entity @s armor.feet with minecraft:air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""
  - cmd: "rpg stats"

# TT0, LARGE SPARKS ON THE FLINT STAFF: bare, III, I, deactivated. Also the redraw at the activate, level and deactivate
# write sites (each change is a remint, read by the dump after it).
TT0:
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give flint_staff"
  - wait: 2
  - hold: flint_staff
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg enchant clear"
  - wait: 2
  - dump: held
  - cmd: "rpg enchant candidate 0 large_sparks"
  - cmd: "rpg enchant level 0 0 3"
  - cmd: "rpg enchant active 0 0"
  - wait: 2
  - dump: held
  - cmd: "rpg enchant level 0 0 1"
  - wait: 2
  - dump: held
  - cmd: "rpg enchant deactivate 0"
  - wait: 2
  - dump: held

