# STA4: the enchants a tier sword is offered. A minted iron and a minted netherite sword each show their rolled candidates.
STA4:
  - cmd: "rpg give iron_sword"
  - hold: iron_sword
  - cmd: "rpg enchant show"
  - cmd: "rpg give netherite_sword"
  - hold: netherite_sword
  - cmd: "rpg enchant show"

