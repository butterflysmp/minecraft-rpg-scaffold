# GATE-fight-arena.md: STEP F8b, THE FIGHT'S OWN WORLD AND ITS GENERATED ARENA (feat/fight-arena, 2026-11-18).
# `/rpg selftest fight-arena`. Its R0 and run sheet cover GATE-fight-site.md's rows too (the seat's split: one boot).
#
# THE FIXTURE: `/rpg fight enter | leave | worlds | land <dx> <dz> | play <min> unsafe | probe | stop`. Its lines:
# FIGHTWORLD (created, arena built, entered, left, died-inside, returned, unloaded, deleting, deleted, orphan swept,
# orphan refused, stale login caught), FIGHTWORLDS (the instrument's count), CRYSTALSPOT (where a crystal stood), and
# the fight's own RINGTICK, FIGHTPHASE, STRIKE, FIGHTKILL, MAGEGATE, CRYSTAL, FIGHTPROBE, FIGHT.
#
# Every row ends back in the world he started in, with `rpg fight worlds` reading loaded=0 folders=0 marked=0 (the
# second boot stages no R0e folder), and the end probes.
#
# THREE ROWS KILL HIM ON PURPOSE (AE4, AE5, AE6). Each is a death_rules row, and each death happens inside an
# await_fight, which survives a death: he reappears where he entered.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# AE1: enter: the world created, the arena built; the floor, its edge, beyond it, its thickness, every pillar's top; he
# is in the fight's world. Then leave: returned; with nobody inside the fight ends; the world unloaded; its folder gone.
AE1R2:
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter"
  - wait: 10
  - cmd: "rpg fight worlds"
  - probe_blocks: "END_STONE 0 -1 0 0 -1 0"
  - probe_blocks: "END_STONE 0 -3 0 0 -3 0"
  - probe_blocks: "AIR 0 -4 0 0 -4 0"
  - probe_blocks: "END_STONE 56 -1 0 56 -1 0"
  - probe_blocks: "AIR 57 -1 0 57 -1 0"
  - probe_blocks: "END_STONE 0 -1 -56 0 -1 -56"
  - probe_blocks: "AIR 0 -1 -57 0 -1 -57"
  - probe_blocks: "OBSIDIAN 39 0 -1 41 11 1"
  - probe_blocks: "AIR 40 12 0 40 12 0"
  - probe_blocks: "OBSIDIAN 40 11 0 40 11 0"
  - probe_blocks: "OBSIDIAN 32 11 24 32 11 24"
  - probe_blocks: "OBSIDIAN 12 11 38 12 11 38"
  - probe_blocks: "OBSIDIAN -12 11 38 -12 11 38"
  - probe_blocks: "OBSIDIAN -32 11 24 -32 11 24"
  - probe_blocks: "OBSIDIAN -40 11 0 -40 11 0"
  - probe_blocks: "OBSIDIAN -32 11 -24 -32 11 -24"
  - probe_blocks: "OBSIDIAN -12 11 -38 -12 11 -38"
  - probe_blocks: "OBSIDIAN 12 11 -38 12 11 -38"
  - probe_blocks: "OBSIDIAN 32 11 -24 32 11 -24"
  - cmd: "rpg fight enter"
  - cmd: "rpg fight leave"
  - wait: 60
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# AE2: the ring, the Mage at 6000 and a crystal ON ITS PILLAR in the arena. He stands 1 west of the Mage.
AE2R2:
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter"
  - wait: 20
  - cmd: "rpg fight land 6 0"
  - cmd: "tp @s ~5 ~ ~ -90 0"
  - wait: 2
  - cmd: "rpg fight probe"
  - wait: 470
  - cmd: "rpg fight probe"
  - cmd: "rpg fight leave"
  - wait: 60
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# AE3: the border lightning from the fight's FIRST tick, before any landing: 50 from C at t=40 is struck (k=1, 20).
AE3R2:
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter"
  - wait: 5
  - cmd: "tp @s ~50 ~ ~ -90 0"
  - wait: 40
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~-50 ~ ~ -90 0"
  - wait: 5
  - cmd: "rpg fight leave"
  - wait: 60
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# AE4: CLOSED in the arena: nobody kills, the ring shuts at S+400, and the lightning kills him (DIES ON PURPOSE). He is
# returned where he entered; nobody is inside; the fight fails and ends; the world unloaded; its folder gone.
AE4R2:
  - death_rules: ""
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter"
  - wait: 20
  - cmd: "rpg fight land 0 0"
  - await_fight: 1400
  - wait: 60
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# AE6: falling off the disc is a death like any other (DIES ON PURPOSE): into the void beyond the edge. Returned; the
# fight ends; its folder gone.
AE6R2:
  - death_rules: ""
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter"
  - wait: 10
  - cmd: "tp @s ~60 -130 ~"
  - await_fight: 400
  - wait: 60
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

