  - shot: sq1r2
  - wait: 100
  - watch_swings: "off"
  - ask: "1 1200 Did your swing destroy it before it reached you?"
  - ask: "2 1200 Was it easy enough to hit?"
  - cmd: "kill @e[tag=sq1r2]"
  - wait: 5
