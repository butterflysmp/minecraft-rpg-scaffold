  - spawn: "sh5 frozen phalanx 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - aim_block: "3 -1 0 UP"
  - wait: 2
  - cmd: "rpg cast solar_grenade"
  - wait: 30
  - shot: sh5
  - wait: 70
  - probe_shot: sh5
  - cmd: "kill @e[tag=sh5]"
