  - cmd: "tp @s ~12 ~ ~"
  - spawn: "sh4 frozen phalanx 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - wait: 5
  - shot: sh4
  - wait: 30
  - aim: sh4_shot
  - wait: 2
  - cmd: "rpg cast solar_grenade"
  - wait: 20
  - probe_shot: sh4
  - wait: 40
  - cmd: "kill @e[tag=sh4]"
  - wait: 5

# SH5: one area effect that catches it destroys it: the solar grenade's field (radius 4, a pulse every 20 ticks),
