# THE PHALANX'S SHOT (dragon-mobs step R7a; GATE-dragon-shot.md). `/rpg selftest dragon-shot`.
#
# THE SHOT: every 120 ticks a Phalanx with a target within 30 blocks (its eye to the target's eye) fires a shot from
# its EYE at the target's EYE: 0.2 blocks a tick, turning 10% toward the target's eye each tick, until it meets a
# block, comes inside the target's box grown by 1.2 (40 x GS/100 before defence), reaches 240 ticks, or is more than 35
# blocks from where it was fired. ANY attack destroys it. It is carried by an invisible bat with a glowing block on it.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and air above it, every fill box SAVED
# first. A mob is spawned by stepping the player to its spot, spawning at the feet, and stepping back. The selftest
# tags a tagged Phalanx's shot <tag>_shot at its fire (the SHOTTAG line), so a row can attack or aim at it.
#
# TWO KINDS OF PHALANX:
#   - FROZEN (NoAI): it cannot walk or draw its bow, and its OWN clock never fires (as the Knell's I23). The SHOT step
#     makes it fire on its next tick. Every row but SH10 and SH11.
#   - LIVE (SH10, SH11): AI on, 10 blocks east in the open. It draws its bow at him (vanilla's RangedBowAttackGoal) and
#     every release is cancelled; its own clock fires 120 ticks after it appears.
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row lets more than one 40 (or the Knell's one 65)
# land before the next heal. His floor is 100.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# SH1: a forced shot at a still player, from a frozen Phalanx 8 blocks east: the fired line, two reads of it in flight,
# the hit at age 33, and his HURT line for 40 before defence. Then the Phalanx is killed.
SH1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -4 10 6 4"
  - cmd: "fill ~-4 ~-1 ~-4 ~10 ~-1 ~4 stone"
  - cmd: "fill ~-4 ~ ~-4 ~10 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "sh1 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - shot: sh1
  - wait: 10
  - probe_shot: sh1
  - wait: 10
  - probe_shot: sh1
  - wait: 30
  - probe_shot: sh1
  - cmd: "kill @e[tag=sh1]"
  - wait: 5

# SH2: one melee hit with one of our weapons (the emberblade) destroys it in flight: by=vanilla cause=ENTITY_ATTACK.
SH2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -4 10 6 4"
  - cmd: "fill ~-4 ~-1 ~-4 ~10 ~-1 ~4 stone"
  - cmd: "fill ~-4 ~ ~-4 ~10 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg give emberblade"
  - hold: emberblade
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "sh2 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - shot: sh2
  - wait: 15
  - attack: sh2_shot
  - wait: 40
  - probe_shot: sh2
  - cmd: "kill @e[tag=sh2]"
  - wait: 5

# SH3: one vanilla arrow destroys it: summoned under the shot, rising through it: by=vanilla cause=PROJECTILE.
SH3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -4 10 6 4"
  - cmd: "fill ~-4 ~-1 ~-4 ~10 ~-1 ~4 stone"
  - cmd: "fill ~-4 ~ ~-4 ~10 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "sh3 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - shot: sh3
  - wait: 15
  - cmd: 'execute at @e[tag=sh3_shot,limit=1] run summon arrow ~ ~-0.8 ~ {Motion:[0.0d,1.5d,0.0d],NoGravity:1b,Tags:["selftest","t"]}'
  - wait: 40
  - probe_shot: sh3
  - cmd: "kill @e[type=arrow,distance=..16]"
  - cmd: "kill @e[tag=sh3]"
  - wait: 5

