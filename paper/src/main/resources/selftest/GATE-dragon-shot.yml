  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -6 17 6 6"
  - cmd: "fill ~-4 ~-1 ~-6 ~17 ~-1 ~6 stone"
  - cmd: "fill ~-4 ~ ~-6 ~17 ~6 ~6 air"
