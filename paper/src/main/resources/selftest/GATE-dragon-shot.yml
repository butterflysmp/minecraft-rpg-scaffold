# SQ1: Ben's. Watch one shot come at him from a frozen Phalanx 15 east; then hit the next with the sword the row puts
# in his hand. Three questions.
SQ1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -6 17 6 6"
  - cmd: "fill ~-4 ~-1 ~-6 ~17 ~-1 ~6 stone"
  - cmd: "fill ~-4 ~ ~-6 ~17 ~6 ~6 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~15 ~ ~"
  - spawn: "sq1 frozen phalanx 100"
  - cmd: "tp @s ~-15 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still and watch: the Phalanx 15 blocks east fires one shot at you. Let it hit you.","color":"gold"}'
  - wait: 60
  - shot: sq1
  - wait: 100
  - ask: "1 1200 Could you see the shot coming (light purple, with pink flashes)?"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg give emberblade"
  - hold: emberblade
  - cmd: 'tellraw @s {"text":"Now hit the next shot with the sword in your hand before it reaches you.","color":"gold"}'
  - wait: 60
  - shot: sq1
  - wait: 100
  - ask: "2 1200 Did hitting it destroy it?"
  - ask: "3 1200 Does the Phalanx's shot feel fair now?"
  - cmd: "kill @e[tag=sq1]"
  - wait: 5

