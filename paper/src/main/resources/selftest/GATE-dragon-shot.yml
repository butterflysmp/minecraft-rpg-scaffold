# THE PHALANX'S SHOT, RE-PREDICTED AFTER THE BOOT OF 8ec16e89 (GATE-dragon-shot.md, section RE-PREDICTED). Run by
# `/rpg selftest dragon-shot`. The rows that read as predicted at that boot and whose lines do not change (SH5, SH6,
# SH8, SH10, SH11, KQ1R6) are not here: their readings stand in the gate. Every row here is new, or re-predicts a row
# with the next suffix.
#
# WHAT CHANGED (the seat's rulings on #201): the carrier is a FROG scaled to a 0.8 cube around the 0.4 shape; only an
# attack destroys the shot (a combatant's melee, projectile, explosion, magic), /kill ends it, anything else is refused
# and logged once per cause; a wall ends it "blocked" when the carrier's BOX, swept along its path, meets the wall; the
# carrier is pickable again, so a vanilla arrow can hit it; the instrument watches the player's own swings and can
# strike along his look.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and air above it, every fill box SAVED
# first. Every Phalanx is FROZEN, 8 east at GS 100 unless the row says, and fires only when the SHOT step forces it.
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row lets more than one 40 land before the next
# heal. His floor is 100.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# SH1R2: supersedes SH1 (its probe line now carries the box and the shape). A forced shot at a still player: two reads
# in flight, each with the server's hittable box and the visible shape as numbers, inside=true; the hit at age 33.
SH1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -4 10 6 4"
  - cmd: "fill ~-4 ~-1 ~-4 ~10 ~-1 ~4 stone"
  - cmd: "fill ~-4 ~ ~-4 ~10 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "sh1r2 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - shot: sh1r2
  - wait: 10
  - probe_shot: sh1r2
  - wait: 10
  - probe_shot: sh1r2
  - wait: 30
  - probe_shot: sh1r2
  - wait: 2
  - cmd: "kill @e[tag=sh1r2]"
  - wait: 5

