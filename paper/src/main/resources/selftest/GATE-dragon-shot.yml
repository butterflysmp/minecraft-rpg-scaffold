# SH6: a shot left to expire. 3 ticks after the force he is moved 38 west (a stone pad there), out of its reach; it
# chases him and expires by RANGE at age 176, more than 35 blocks from where it was fired. The LIFE (240) cannot come
# first in shipped content: a shot flies 0.2 a tick and passes 35 from its origin at 176 unless it curls, and it curls
# only round a target it is reaching (the gate's E1). Then he comes back and the Phalanx is killed.
SH6:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-40 -1 -4 10 6 4"
  - cmd: "fill ~-4 ~-1 ~-4 ~10 ~-1 ~4 stone"
  - cmd: "fill ~-4 ~ ~-4 ~10 ~6 ~4 air"
  - cmd: "fill ~-40 ~-1 ~-2 ~-36 ~-1 ~2 stone"
  - cmd: "fill ~-40 ~ ~-2 ~-36 ~4 ~2 air"
  - cmd: "fill ~-35 ~ ~-2 ~-5 ~4 ~2 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "sh6 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - shot: sh6
  - wait: 3
  - cmd: "tp @s ~-38 ~ ~ -90 0"
  - wait: 200
  - return: ""
  - wait: 2
  - probe_shot: sh6
  - cmd: "kill @e[tag=sh6]"
  - wait: 5

