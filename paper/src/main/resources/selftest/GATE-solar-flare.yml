# GATE-solar-flare (docs/gates/GATE-solar-flare.md): SOLAR FLARE (#340), 2026-11-27. Typed as ONE command for the whole
# stack, this gate LAST:
#   /rpg selftest armor-sets.AS1.AS2+mana-battery.MB1+smolder+solar-flare
# SURVIVAL. On the pad, at NIGHT (18000), difficulty normal, no natural spawns. ALL AUTO except SF9, this gate's ONE ASK,
# the command's last step. SF1 picks Ranger, Fire and Solar Flare on Q through the Build screen (the pick is SAVED:
# CARRIED STATE); every later row is SKIPPED unless his cell reads ranger fire. Every row clears his state and storage,
# sets level 1, converges the stone and casts from it in hand (score 100, no enchant, class or level term), facing due
# east, level (yaw -90, pitch 0). Every mob is a frozen NoAI zombie at max_health 600 (3000 custom), placed at the
# coordinates SolarFlareGateArithmeticTest executes; his wolf is frozen with NoAI. SAFETY 0.000: the ring (PULSE) and
# Ignite (IGNITE_SPLASH) spare players, EXECUTED there; no row damages him.
setup:
  - pad: ""
  - preflight: "-2 -13 22 13"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "item replace entity @s armor.head with minecraft:air"
  - cmd: "item replace entity @s armor.chest with minecraft:air"
  - cmd: "item replace entity @s armor.legs with minecraft:air"
  - cmd: "item replace entity @s armor.feet with minecraft:air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# SF1: THE BUILD SCREEN AS HIS SAVED BUILD READS (F11: a saved Q naming the deleted placeholder reads EMPTY, with one
# BUILD unoffered line), then Ranger, Fire and Solar Flare picked: the picker's lore, then the cell's.
SF1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "build"
  - wait: 3
  - dump: menu
  - click: "Class"
  - wait: 3
  - click: "Ranger"
  - wait: 3
  - click: "Element"
  - wait: 3
  - click: "Fire"
  - wait: 3
  - dump: menu
  - click: "Q: "
  - wait: 3
  - dump: menu
  - click: "Solar Flare"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - stone: ""
  - hold: stone
  - dump: held

# SF2: THE FAN AND THE RANGE. No mob in the flight paths; z4 4 past the centre's range origin, z7 7 past it.
SF2:
  - expect_cell: "ranger fire"
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - stone: ""
  - hold: stone
  - cmd: 'summon zombie ~19 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["z4","selftest"],attributes:[{id:"minecraft:max_health",base:600.0}],Health:600.0f}'
  - cmd: 'summon zombie ~22 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["z7","selftest"],attributes:[{id:"minecraft:max_health",base:600.0}],Health:600.0f}'
  - wait: 40
  - probe: "z4 24"
  - probe: "z7 24"
  - cmd: "rpg mana refill"
  - probe_mana: ""
  - drop: selected
  - probe_mana: ""
  - wait: 5
  - probe_entities: "item_display 24"
  - wait: 15
  - probe_entities: "item_display 24"
  - wait: 140
  - probe: "z4 24"
  - probe: "z7 24"

