# SF9 (THE ASK): a cast down the pad, and the question once all three rings have gone out.
SF9:
  - expect_cell: "ranger fire"
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - stone: ""
  - hold: stone
  - wait: 20
  - cmd: "rpg mana refill"
