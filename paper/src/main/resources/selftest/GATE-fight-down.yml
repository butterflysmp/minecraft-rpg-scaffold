# GATE-fight-down.md: STEP F9d, DOWN, ALL DOWN AND THE ENTRY MODE (feat/fight-down, 2026-11-19). `/rpg selftest fight-down`.
# NO BOOT OF ITS OWN: GATE-fight-revive.md (F9e, stacked on this branch) carries the one R0 and run sheet.
#
# A death inside an arena fight is CANCELLED and he goes DOWN: spectator, inventory kept, no death screen, not a
# participant. When nobody is alive inside and at least one is down, the fight has FAILED (FIGHT all-down), and
# all_down_seconds (5) later everyone is returned in the mode he entered in.
#
# EVERY ROW HERE PUTS HIM DOWN ON PURPOSE (FD1 /kill, FD2 the void, FD3 POWERED, FD4 /kill then a teleport out). Each is a
# death_rules row and heals him first; a down player takes no damage at all. Each row ends with him home, in survival,
# healed.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# FD1: A SOLO DEATH INSIDE (DOWN ON PURPOSE): /kill in the arena. Down, spectator, ALL DOWN, FAILED, five seconds, returned
# in survival where he entered, the world unloaded, its folder gone.
FD1:
  - death_rules: ""
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter nodragon"
  - wait: 20
  - cmd: "kill @s"
  - await_fight: 400
  - wait: 60
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# FD2R2: A DEATH IN THE VOID UNDER BEN'S RULE (DOWN ON PURPOSE; the seat's part 2, 2026-11-19; FD2 was read at cb821675
# and is retired). STRAIGHT DOWN from C to y -130, INSIDE the ring's footprint, so no ring strike can reach him (FD2's
# x 60 was outside the 48-block ring and took four). Below the End world's void line (-64) at once: a tenth of his
# MAXIMUM each void tick, every 10 ticks, defence bypassed. Down, lifted above the floor, ALL DOWN, returned.
FD2R2:
  - death_rules: ""
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter nodragon"
  - wait: 20
  - cmd: "tp @s ~ -130 ~"
  - await_fight: 400
  - wait: 60
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# FD4: A DOWN SPECTATOR LEAVES THE FIGHT WORLD (DOWN ON PURPOSE): /kill, then, while he spectates, a teleport into the
# overworld. He is out and returned at once, in survival; with nobody inside, the fight ends.
FD4:
  - death_rules: ""
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight enter nodragon"
  - wait: 20
  - cmd: "kill @s"
  - wait: 20
  - cmd: "execute in minecraft:overworld run tp @s ~ 200 ~"
  - await_fight: 200
  - wait: 60
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight worlds"
  - probe_entities: "end_crystal 48"
  - probe_entities: "wither_skeleton 16"

# FD3: POWERED (DOWN ON PURPOSE): AE5R2's staging (GATE-fight-arena.md), its first wait 20 rather than 5 because an End
# world is checked before he enters (F9c). Sixty-eight kills hold the ring open; the tenth crystal powers the Mage; the
# powered kill lands; he goes down; ALL DOWN; returned. Every step after the landing is AE5R2's, relative to it.
