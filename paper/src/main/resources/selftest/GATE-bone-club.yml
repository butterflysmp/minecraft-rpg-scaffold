# BC6: M2, THE SERVER'S VERDICT ON A RIGHT CLICK ON A WOLF: a NoAI wild wolf w at ~2; the Bone Club, the Bone Whistle and a
# plain bone (the control) each right-click it through interact_entity. Nothing vanilla follows a synthetic event, so the
# row reads the VERDICT only. The wolf is removed by the row's own kill and, at the latest, the next row-start CLEAN.
