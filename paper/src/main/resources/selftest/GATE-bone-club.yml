# GATE-bone-club (docs/gates/GATE-bone-club.md): the Bone Club, Drumming Beat and the one minted-bone guard, 2026-11-26.
# Typed as ONE command for the whole stack, with the Blast Fungus gate and true-tooltips' TT20 to TT27 by reference:
#   /rpg selftest bone-club+blast-fungus+true-tooltips.TT20.TT21.TT22.TT23.TT24.TT25.TT26.TT27
# SURVIVAL. On the pad (the setup's FIRST step stands him on it), at NIGHT (18000), difficulty normal, no natural spawns,
# each put back by the run's restore. ALL AUTO: this gate asks NOTHING. Every row empties his storage and state (his
# Drumming Beat streak included: clear_state logs drum=<n>), heals him, sets his level (1), gives itself what it holds,
# sets the score (100 unless the row says) and the enchant state, turns him block-centred facing east, and waits for a
# full charge before its first hit (25 ticks at attack speed 0.8, READ; every row waits 40). EVERY HIT IS FOLLOWED BY
# reset_charge, the server half of a real click's swing (Player#attack alone never resets the charge, READ), so each next
# hit's charge is the time since. Every mob is a frozen NoAI zombie (max_health 200, so 1000 custom health; the truth row's
# 400, so 2000) at ~2 east, or BC6's NoAI wild wolf. SAFETY (the gate file): NO row deals him damage.
setup:
  - pad: ""
  - preflight: "-2 -2 4 2"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# BC1: THE TOOLTIP, BARE, AND A FRESH ROLL'S SLOTS.
BC1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give bone_club"
  - wait: 2
  - hold: bone_club
  - probe_held: ""
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant clear"
  - wait: 2
  - cmd: "rpg gearscore set 100"
  - wait: 2
  - dump: held

