  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg3 frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
