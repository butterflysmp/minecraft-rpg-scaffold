  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg4 frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: 'summon zombie ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["dg4z","t","selftest"]}'
  - cmd: "kill @e[tag=dg4z]"
  - wait: 2
  - probe_body: dg4
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg4e","t","selftest"]}'
  - cmd: "kill @e[tag=dg4e]"
  - wait: 2
  - probe_body: dg4

# DG5R2: a Phage's own death (a stage 3, which does not split) advances another Phage 2 blocks away.
