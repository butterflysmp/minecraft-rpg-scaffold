  - spawn: "dg7 frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - aim: dg7
  - wait: 2
  - cmd: "rpg mobdamage 120"
  - wait: 2
  - probe: dg7
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg7e","t","selftest"]}'
  - cmd: "kill @e[tag=dg7e]"
