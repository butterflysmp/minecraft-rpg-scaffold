  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
