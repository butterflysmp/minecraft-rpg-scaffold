# GATE-dragon-growth.md's rows, RE-RUN after the 2026-11-15 boot. The rows here are GATE-dragon-fix.md's (DG1R2 ...),
# each named for the row of GATE-dragon-growth.md it re-predicts; SelfTestScenariosTest pairs this file with
# GATE-dragon-fix.md. The old rows' predictions and readings stay in GATE-dragon-growth.md, as they are. WHAT CHANGED
# (GATE-dragon-fix.md, D2): every Phage is spawned by the SPAWN step, tagged and frozen inside its pre-spawn consumer,
# never by a nearest-mob selector afterwards (on 2026-11-15 that selector tagged the last row's Phage, and the new
# one leaked into later rows and was grown there); the setup declares the difficulty; every row-start clean is
# followed by a LEFTOVER line. The text below is the original header, and still describes the staging.
#
# 2026-11-16, STEP R3 MOVED TWO ROWS OUT OF THIS FILE (the seat's brief; GATE-dragon-fix.md's dated note). DG6R2 and
# DG9R2 each split a stage 5 and left two LIVE children beside the player, and from R3 a live Phage within 3 blocks
# blows. They are re-predicted in GATE-dragon-blast.md as DG6R3 and DG9R3, where a frozen parent's children are born
# frozen. Their old predictions and readings stay in GATE-dragon-fix.md. The other seven rows split nothing and stay.
#
# GATE-dragon-growth.md: the Phage's growth (the plan's step R4), read from the SERVER. Each row spawns Phages through
# the shipped /rpg spawn at gear score 300, tags them, freezes them with NoAI, and kills creatures beside them with
# /kill; it then reads each Phage's BODY (and, in DG7, its health) and the GROWTH lines the shipped code logs.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, x from -3 to 12, z from -4 to 4, every fill box SAVED first. A Phage is spawned by stepping the player
# to its spot, spawning at the feet, and stepping back; it stands 3 blocks east unless a row says otherwise. A dead
# creature is SUMMONED with NoAI (so it neither walks nor teleports while it waits) and killed with /kill. Each kill is
# followed by the settle (it is a "kill" step) and then two more ticks, because a stage change is applied on the
# growing Phage's own thread, the tick after the death.
setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DG1R2: four Enderman deaths, 2 blocks from a stage-1 Phage, take it to stage 5, one stage each; a BODY line after each.
DG1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg1 frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - probe_body: dg1
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg1e1","t","selftest"]}'
  - cmd: "kill @e[tag=dg1e1]"
  - wait: 2
  - probe_body: dg1
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg1e2","t","selftest"]}'
  - cmd: "kill @e[tag=dg1e2]"
  - wait: 2
  - probe_body: dg1
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg1e3","t","selftest"]}'
  - cmd: "kill @e[tag=dg1e3]"
  - wait: 2
  - probe_body: dg1
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg1e4","t","selftest"]}'
  - cmd: "kill @e[tag=dg1e4]"
  - wait: 2
  - probe_body: dg1

# DG2R2: one Enderman death advances two Phages, the near one (2.00 away) and the far one (3.61 away).
DG2R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg2a frozen phage 300"
  - cmd: "tp @s ~ ~ ~3"
  - spawn: "dg2b frozen phage 300"
  - cmd: "tp @s ~-3 ~ ~-3 -90 0"
  - wait: 5
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg2e","t","selftest"]}'
  - cmd: "kill @e[tag=dg2e]"
  - wait: 2
  - probe_body: dg2a
  - probe_body: dg2b

