# SM7R (THE ASK): a cast, his move 8 east at P+19, and the question once the fourth pulse's spirals have faded.
SM7R:
  - expect_cell: "mage fire"
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "execute align xz positioned ~10.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - stone: ""
  - hold: stone
  - wait: 20
  - cmd: "rpg mana refill"
  - tell: "Smolder is cast in a moment from your feet. Keep your mouse still and stand still; you will be moved 8 blocks east after the first pulse. Watch the fire spread out."
  - cmd: "tp @s ~ ~ ~ -90 0"
  - wait: 1
  - drop: selected
  - wait: 19
  - cmd: "tp @s ~8 ~ ~"
  - wait: 111
