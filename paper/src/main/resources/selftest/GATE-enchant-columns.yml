# GATE-enchant-columns (docs/gates/GATE-enchant-columns.md): the enchant columns re-cut, the Living Lantern's homing shot,
# Kinetic Tremors and Airburst Flames (2026-11-23; PRs A, B, C and E of the seat's brief "THREE ENCHANT COLUMNS' WORTH
# OF WORK"; PR D, Lapis Crystal, was STOPPED and has no row). `/rpg selftest enchant-columns`. SURVIVAL, every row; ALL
# AUTO; he types nothing. Night (18000) and no natural spawns, both put back by the run's restore; every mob a frozen
# NoAI zombie staged at vanilla max 200 (so 1000 health, nothing here dies); no fight world.
#
# THE STAGING: RPG level 13 first (the enchanting table opens at 10; EC1-EC6 read gear and the table), then level 1 from
# EC7 on, so the level term of every damage sum is 0. Every row that presses a weapon begins from a cleared cooldown
# (each press's wait is stated in the gate). Each row clears the item types it gives (his own included; the restore
# returns them). A `wait:` follows every `rpg enchant` / `rpg give` before the hand changes or a press: those commands
# act on the player's thread a tick later.
setup:
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""
  - hold: empty
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg playerxp set @s 13 levels"
  - wait: 40
  - probe_self: ""

# EC0: THE SPOT (its counts describe the spot, not pass or fail): the corridor 1..32 east, 6 north to 6 south, at his
# feet and head AIR; the floor under it no AIR and no WATER.
EC0:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - probe_self: ""
  - probe_blocks: "AIR 1 0 -6 32 1 6"
  - probe_blocks: "AIR 1 -1 -6 32 -1 6"
  - probe_blocks: "WATER 1 -1 -6 32 -1 6"
  # EC0R2 (2026-11-23, the seat's fix): the ground LC1's F stands on, 7..10 SOUTH (his right as he faces east), measured
  # too; added, the three lines above unchanged.
  - probe_blocks: "AIR 1 0 7 32 1 10"
  - probe_blocks: "AIR 1 -1 7 32 -1 10"
  - probe_blocks: "WATER 1 -1 7 32 -1 10"

