  - cmd: "rpg give iron_sword"
  - wait: 2
  - hold: iron_sword
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant pool"
  - wait: 2

# EC4R2: A PIECE OF ARMOR'S COLUMNS. `hold` cannot match an armor id, so an empty slot is held first and the give lands in
