# GATE-enchant-columns (docs/gates/GATE-enchant-columns.md): the enchant columns re-cut, the Living Lantern's homing shot,
# Kinetic Tremors, Airburst Flames and Lapis Crystal. `/rpg selftest enchant-columns`. SURVIVAL, every row; ALL AUTO; he
# types nothing. Night (18000) and no natural spawns, both put back by the run's restore; every mob a frozen NoAI zombie
# staged at vanilla max 200 (so 1000 health, nothing here dies); no fight world.
#
# THE SECOND FORM (2026-11-23, after the boot of e774d4b8; the seat's brief "FIX THE INSTRUMENT"). The rows that ran and
# read as predicted there (EC0's counts, EC1R2, EC2, EC17's counts) LEFT this file: they are not re-run. Every other row
# is re-written under the seat's four rules and renamed with the next suffix (EC3R2 ... LC4R2):
#   1. NOTHING IS ASKED OF HIS INVENTORY: each row that gives empties his storage first (clear_inventory; the snapshot
#      puts it all back).
#   2. EVERY ROW IS SELF-CONTAINED: each row that fires or probes sets, itself, his level, the weapon in hand, its gear
#      score, its enchant state (cleared, then exactly what the row needs, then shown), mana, a cleared cooldown and a
#      fresh record (clear_state), his facing (a turn east), and its mobs (old ones killed first). No row reads what
#      another staged.
#   3. A WAIT between any turn and the press after it.
#   4. EVERY PROBE'S MOB IS INSIDE ITS REACH: a probe of a mob beyond 15 names its reach ("f 32").
# And the fifth: after `rpg enchant clear` the item has NO slots, and the dev command adds only the next one, so a
# behaviour is staged in slot 0 (or 0 then 1); EnchantState.effective reads every slot alike. ScenarioLint holds all five,
# and the ground: the preflight below, first, measures what every summon stands on.
#
# THE PAD (Ben's ruling A, 2026-11-23: "The test builds its own ground"): the setup's FIRST step builds or checks the one
# stone platform 200 east of world spawn, floor at Y 200, inside a barrier rim, and stands him on it facing east; every
# row stages from there, and the run's restore returns him to where he typed the command. The preflight then checks the
# pad is whole. `gamerule spawn_phantoms false` (restored by the snapshot): the phantom spawner reads that rule, not
# spawn_mobs, and the pad is open sky at night.
setup:
  - pad: ""
  - preflight: "0 -6 32 10"
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 2
  - probe_self: ""

# EC3R2: AN IRON SWORD'S COLUMNS, ROLLED (W2's proof: a fresh give, read untouched).
EC3R2:
