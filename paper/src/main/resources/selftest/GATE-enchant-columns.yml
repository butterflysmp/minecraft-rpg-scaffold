# LC1: LAPIS CRYSTAL'S THROW (D1, D2): the granted LEFT CLICK, driven by `reload`, which is the shipped left-click handler
# (WeaponSwingListener.swing; a Lapis Staff has no quiver, so it goes straight to the trigger). A fresh staff, Lapis
# Crystal staged active at II in slot 0 and Kinetic Tremors active at I in slot 1 (staged by the dev command: these rows
# test BEHAVIOUR, not the roll; EC1R2 is the roll's proof). Mana read either side of the press with no wait between
# (one tick); a second press 20 ticks later meets the 600-tick cooldown, silently (WeaponSwingListener ignores an
# OnCooldown), so it spends nothing and throws nothing. N 5 south of the orb's spot, F 9 south, T the beam's own target
# 22 east on his aim line, 10 beyond the orb. The staff has never been pressed in this run.
LC1:
