# GATE-armor-sets (docs/gates/GATE-armor-sets.md): authored Defense, copper, the set bonuses, the four columns on armor.
# Typed AFTER the summoner gate as ONE run: `/rpg selftest summoner+armor-sets`. SURVIVAL, every row. ALL AUTO except AS16,
# the one ASK, last. On the pad, facing east. Nothing is asked of his ground, position or inventory: every row clears his
# storage, his state AND his four armour slots (clear_inventory never touches armour, READ), heals him full, reads a
# BASELINE sheet, stages its own pieces, and clears the armour again at its end. The run's restore puts his whole
# inventory back, armour included (READ: the snapshot is PlayerInventory.getContents, "all ItemStacks").
# A minted piece is worn by holding an empty slot, /rpg give (the give lands in it), then
# `item replace entity @s armor.<slot> from entity @s weapon.mainhand` and the hand emptied (`hold` cannot match an armor
# id, READ, EC4R2). An UNTAGGED piece is `item replace ... with minecraft:<item>`.
# SAFETY (the gate file): AS9's one `rpg damage 10`, and nothing else touches him. No mob acts on him.
setup:
  - pad: ""
  - preflight: "-2 -6 45 10"
  - difficulty: easy
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# AS0, THE BASELINE: bare, level 1, the sheet and max_summons. Every later row reads its OWN bare sheet first.
AS0:
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg heal 1000000"
  - cmd: "item replace entity @s armor.head with minecraft:air"
  - cmd: "item replace entity @s armor.chest with minecraft:air"
  - cmd: "item replace entity @s armor.legs with minecraft:air"
  - cmd: "item replace entity @s armor.feet with minecraft:air"
  - wait: 10
  - cmd: "rpg stats"
  - cmd: "rpg maxsummons reset"
  - cmd: "rpg maxsummons"
  - probe_self: ""

