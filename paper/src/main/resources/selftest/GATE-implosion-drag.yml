# GATE-implosion-drag.md: THE IMPLOSION'S PULL CONTINUES FOR A SECOND (PLAN-dragon-mobs.md, RULINGS, Ben 2026-11-18:
# "1. yes 2. yes 3. yes 4. yes"), read from the SERVER. `/rpg selftest implosion-drag`.
#
# THE PHAGE NOW: its blast damages as before, ONCE, at the instant it blows; then for the 20 ticks after it, everything
# it is hostile to inside the stage's reach is DRAGGED toward where it stood: 0.28 blocks a tick of velocity added at
# its feet, times 1 - d / reach, added to what the victim already carries, and cut so the slide stops half a block short
# of the Phage's feet. No pull and no lift at the blast. The swirl lasts the same 20 ticks. One DRAG line per victim
# when the second ends: `DRAG source=phage id=<the Phage> victim=player <Ben> start= end= ticks= sent= outcome=`.
#
# ROWS: the blast rows of GATE-dragon-blast.yml whose lines change, MOVED HERE and re-predicted with the next suffix
# (BL1R4-BL9R4, IM1R2-IM6R2, FZ1R2-FZ5R2, DS1R6); DR1 (he leaves the reach mid-drag) and DR2 (two blasts five ticks
# apart); BQ2, Ben's five questions, the first of them the Part D swell. The rows that stayed in GATE-dragon-blast.yml
# blow nothing near him and their lines do not change. SelfTestScenariosTest pairs this file with GATE-implosion-drag.md.
#
# THE STAGING, the same as the blast gate's: the player at a block centre facing east (+x); a stone floor and air above
# it, every fill box SAVED first; a mob spawned by stepping to its spot and back. A drag carries him EAST, toward a
# Phage east of him, and never past half a block short of it.
#
# EVERY DETONATION IS FOLLOWED BY AT LEAST 24 TICKS IN ITS OWN ROW: the drag and the swirl are pending work for 20, and
# the DRAG lines print when the drag's last tick runs. A row that read his feet after a blast reads them 45 ticks after.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-implosion-drag.md, THE PLAYER CANNOT DIE): the most any row can deal before his
# defence after one heal is under 100. The drag itself deals nothing.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# BL1R4: a LIVE stage-1 Phage two blocks east walks in, lights inside its 1-block trigger, and blows; then it drags him
# to half a block from where it stood. 30 ticks more than BL1R3 for the drag.
BL1R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl1 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 150
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

# BL2R4: a LIVE stage-5 Phage at GEAR SCORE 60, two blocks east, inside its 3-block trigger: it lights at once, blows at
# 2.000 (90 x 0.555556, no children), and drags him 1.5 blocks east to its margin.
BL2R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl2 live phage stage 5 60"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 150
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

# BL3R4: a frozen stage-1 Phage blown SEVEN blocks east (outside its 2-block reach: no drag) grows a stage-1 Phage 3.00
# away to stage 2; the Phage that blew is gone. 24 ticks, so the 20-tick swirl ends inside the row.
BL3R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~7 ~ ~"
  - spawn: "bl3x frozen phage 100"
  - cmd: "tp @s ~ ~ ~3"
  - spawn: "bl3b frozen phage 100"
  - cmd: "tp @s ~-7 ~ ~-3 -90 0"
  - wait: 5
  - detonate: bl3x
  - wait: 24
  - probe_body: bl3b
  - probe_body: bl3x
  - probe_entities: "creeper 16"

# BL4R4: a frozen husk and a frozen stage-5 Phage, each 2.00 from a frozen STAGE-5 Phage blown seven blocks east, are
# neither hurt NOR DRAGGED: their velocity is read in the blast's tick, ten ticks into the drag, and twenty. THE
# CONTROL: a third frozen husk (bl4c), given a velocity by a vanilla data merge, reads that velocity back.
BL4R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~7 ~ ~"
  - spawn: "bl4x frozen phage stage 5 100"
  - cmd: "tp @s ~ ~ ~2"
  - spawn: "bl4h frozen husk 100"
  - cmd: "tp @s ~ ~ ~-4"
  - spawn: "bl4p frozen phage stage 5 100"
  - cmd: "tp @s ~-9 ~ ~2"
  - spawn: "bl4c frozen husk 100"
  - cmd: "tp @s ~2 ~ ~ -90 0"
  - wait: 5
  - probe: bl4h
  - probe: bl4p
  - probe_motion: bl4h
  - probe_motion: bl4p
  - cmd: "execute as @e[tag=bl4c] run data merge entity @s {Motion:[0.0d,0.0d,0.5d]}"
  - probe_motion: bl4c
  - detonate: bl4x
  - probe_motion: bl4h
  - probe_motion: bl4p
  - wait: 10
  - probe_motion: bl4h
  - probe_motion: bl4p
  - wait: 14
  - probe_motion: bl4h
  - probe_motion: bl4p
  - probe: bl4h
  - probe: bl4p
  - probe_entities: "creeper 16"

