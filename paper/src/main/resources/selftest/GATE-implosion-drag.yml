# --- BEN'S ROW --------------------------------------------------------------------------------------------------------

# BQ2: five questions, each told BEFORE what it asks about. (1) THE SWELL (Part D): a frozen stage-5 Phage 12 blocks
# east, twice its reach away, is LIT by the instrument (it never lights by distance) and swells for 30 ticks before it
# blows. (2) Standing still, a stage 5 blown 4 blocks east drags him in. (3) Facing a glass wall west, holding W, a stage
# 5 three blocks behind him blows and the wall goes: walking, he is slowed but still dragged in. (4) The same, sprinting,
# from 4.5 behind him: he gets out. (5) How it feels. A heal before every blast.
BQ2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-20 -1 -4 13 5 4"
  - cmd: "fill ~-20 ~-1 ~-4 ~13 ~-1 ~4 stone"
  - cmd: "fill ~-20 ~ ~-4 ~13 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "bq2a frozen phage stage 5 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - tell: "QUESTION 1 IS COMING. Look at the BIG Phage 12 blocks in front of you and keep watching it. It is about to swell up and blow. It is too far away to hurt you."
  - wait: 80
  - light: bq2a
  - wait: 60
  - ask: "1 1200 Did you see the big Phage swell up before it blew?"
  - return: ""
  - wait: 2
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~4 ~ ~"
  - spawn: "bq2b frozen phage stage 5 100"
  - cmd: "tp @s ~-4 ~ ~ -90 0"
  - tell: "QUESTION 2 IS COMING. Stand still and touch nothing. The Phage 4 blocks in front of you will blow in 4 seconds. Let it drag you."
  - wait: 80
  - detonate: bq2b
  - wait: 45
  - probe_self: ""
  - ask: "2 1200 Standing still, did it drag you in toward where it stood, for about a second?"
  - return: ""
  - wait: 2
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ 90 0"
  - cmd: "fill ~-1 ~ ~-1 ~-1 ~1 ~1 glass"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "bq2c frozen phage stage 5 100"
  - cmd: "tp @s ~-3 ~ ~ 90 0"
  - tell: "QUESTION 3 IS COMING. You face a glass wall. HOLD W NOW (walk, do NOT sprint) and keep holding it until the chat says STOP. A Phage behind you will blow in 4 seconds, and the glass will vanish when it does."
  - wait: 80
  - cmd: "fill ~-1 ~ ~-1 ~-1 ~1 ~1 air"
  - detonate: bq2c
  - wait: 30
  - tell: "STOP. Let go of W."
  - wait: 20
  - probe_self: ""
  - ask: "3 1200 Walking away, did the drag slow you down without stopping you, so you still went back toward it?"
  - return: ""
  - wait: 2
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ 90 0"
  - cmd: "fill ~-1 ~ ~-1 ~-1 ~1 ~1 glass"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~4.5 ~ ~"
  - spawn: "bq2d frozen phage stage 5 100"
  - cmd: "tp @s ~-4.5 ~ ~ 90 0"
