# GATE-loot-roll.md: THE DEV ROLL COMMAND (feat/loot-cascade, the seat's queue item 6, 2026-11-19).
# `/rpg selftest loot-roll`. NO BOOT NOW: it boots with a later stack, after #219's rebase onto master.
#
# Nothing here can hurt him or give him anything: /rpg loot rolls and tells, and gives nothing.

setup:
  - close: ""

# LR1: THE ODDS: the written chance and the true odds per tier, for the default table and the dev example source.
LR1:
  - cmd: "rpg loot odds default"
  - cmd: "rpg loot odds dev_example_not_a_drop"

# LR2: 10,000 ROLLS OF THE DEV EXAMPLE SOURCE: each tier's count near its true odds, epic always skipped (no epic item
# exists), and his inventory the same before and after (it gives nothing).
LR2:
  - probe_inventory: "volley_stone"
  - probe_inventory: "locust"
  - cmd: "rpg loot roll dev_example_not_a_drop 10000"
  - probe_inventory: "volley_stone"
  - probe_inventory: "locust"

# LR3: 10,000 ROLLS OF THE DEFAULT TABLE (no pools): each tier's landings near its table true odds, nothing skipped.
LR3:
  - cmd: "rpg loot roll default 10000"

# LR4: ONE ROLL, the count left out: it rolls once.
LR4:
  - cmd: "rpg loot roll dev_example_not_a_drop"

# LR5: AN UNKNOWN TABLE is refused, naming the tables there are.
LR5:
  - cmd: "rpg loot roll no_such_table 5"
