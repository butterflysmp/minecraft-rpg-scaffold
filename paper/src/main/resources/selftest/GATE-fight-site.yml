# GATE-fight-site.md: STEP F8a, ONE RUNTIME AT A SITE, BEN'S SECOND-BOOT TUNING, AND THE INSTRUMENT FIXES
# (feat/fight-site, 2026-11-18). `/rpg selftest fight-site`. NO BOOT OF ITS OWN: run at the one boot of feat/fight-arena
# (GATE-fight-arena.md carries the R0 and the run sheet).
#
# It RETIRES selftest/GATE-fight-mage.yml. Every row there MOVES and is RE-PREDICTED here under its old name with the
# next suffix (FR1R2 -> FR1R3 ... FR9R2 -> FR9R3; MG1 -> MG1R2 ... MG8 -> MG8R2; MQ1 -> MQ1R2):
#   - the wall is six rows now: every RINGTICK reads 1812 points at r=48, not 1208;
#   - a crystal every 240 ticks: FR6, FR9, MG5, MG6, MG7, MG8 move in their crystal lines;
#   - the Mage at 6000: MG1 to MG4 move in their health figures;
#   - the instrument: the ENTITIES line carries dying=, ATTACK carries attack_damage=, mobdamage replies from the store.
# MQ2-MQ7 are RETIRED, not re-predicted: Ben answered them at the second boot. MQ1 is re-asked as MQ1R2, because its
# ring never moved (REFUSED_NO_GROUND): this time the landing has a floor.
#
# New rows: WS1 (the six-row wall turning, read from its points), IP1 (the entity probe leaves a dying body out),
# IA1 (AWAIT_FIGHT's two endings).
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-fight-site.md, THE ARITHMETIC). Every row ends with `rpg fight stop`, then a
# probe of end crystals within 48 (the crystals stand 41.8 from C) and of wither skeletons within 16.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

