# GATE-unique-enchant-slot (docs/gates/GATE-unique-enchant-slot.md): the unique enchant slot, Ben's cascade, the table's
# new layout and the info item at the top right (2026-11-23; PRs #248, #249 and feat/info-top-right). SURVIVAL, every
# row; no mob; ALL AUTO. The dev-only example enchant (dev_kinetic_example) is loaded on this dev server.
#
# THE STAGING (READ): his RPG level 13 opens every Nexus station (NexusStationGate: crafting 3, anvil 7, enchanting 10,
# grindstone 13); 30 VANILLA levels at 0 progress are his wallet at the table (XpCurve over getLevel/getExp; the
# Lifetime XP is a different number). The run's restore returns both (SelfTestSnapshot: lifetime XP, and vanilla level
# and progress since this PR).
#
# EACH ROW clears the item types it works with (his own included; the restore returns them) and gives fresh ones, so
# `hold` and `shift_click` (which match a weapon id) can only find the row's own item. A `wait:` follows every
# `rpg enchant` / `rpg give` before the hand changes: those commands act on the player's thread a tick later
# (PLAN-weapon-tiers.md 6.9 item 5).

setup:
  - close: ""
  - hold: empty
  - cmd: "rpg playerxp set @s 13 levels"
  - wait: 40
  - cmd: "xp set @s 30 levels"
  - cmd: "xp set @s 0 points"
  - wait: 2

# US1: A FRESHLY GIVEN KINETIC WEAPON. Slot 0 offers ONLY the dev unique enchant (the unique pool holds one, so the
# cascade's count is capped at one); slots 1-3 offer none of it.
US1:
  - hold: empty
  - cmd: "clear @s minecraft:iron_sword"
  - cmd: "rpg give iron_sword"
  - wait: 2
  - hold: iron_sword
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant pool"
  - wait: 2

# US2: A FIRE WEAPON: slot 0 empty (no fire unique enchant exists), slots 1-3 roll from its normal pool as before.
US2:
  - hold: empty
  - cmd: "clear @s minecraft:stick"
  - cmd: "rpg give flint_staff"
  - wait: 2
  - hold: flint_staff
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant pool"
  - wait: 2

# US3: A PIECE OF ARMOR: slot 0 empty (armor declares no element). `hold` cannot match an armor id, so the held slot is
# emptied first and the give lands in it; HELDID witnesses that it did.
US3:
  - hold: empty
  - cmd: "clear @s minecraft:iron_chestplate"
  - wait: 2
  - cmd: "rpg give iron_chestplate"
  - wait: 2
  - probe_held: ""
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant pool"
  - wait: 2

# US4: THE CASCADE, READ OVER MANY ROLLS: 10000 rolls of the held gear by the roll's own call, written nowhere. A pool of
# two (iron sword) and a pool of four (iron chestplate); each slot's counts of 0..4 candidates beside the true odds.
US4:
  - hold: empty
  - cmd: "clear @s minecraft:iron_sword"
  - cmd: "clear @s minecraft:iron_chestplate"
  - cmd: "rpg give iron_sword"
  - wait: 2
  - hold: iron_sword
  - wait: 2
  - cmd: "rpg enchant rollstats 10000"
  - wait: 2
  - hold: empty
  - wait: 2
  - cmd: "rpg give iron_chestplate"
  - wait: 2
  - probe_held: ""
  - cmd: "rpg enchant rollstats 10000"
  - wait: 2

# US5: THE TABLE, STAGED FULL: four slots of four candidates each, so every candidate cell is drawn, and every fixture
# index is read (the label, the input, the bookshelf, the info item, Back, Close).
US5:
  - hold: empty
  - cmd: "clear @s minecraft:iron_sword"
  - cmd: "rpg give iron_sword"
  - wait: 2
  - hold: iron_sword
  - wait: 2
  - cmd: "rpg enchant clear"
  - cmd: "rpg enchant candidate 0 dev_kinetic_example"
  - cmd: "rpg enchant candidate 0 sharpness"
  - cmd: "rpg enchant candidate 0 power"
  - cmd: "rpg enchant candidate 0 attunement"
  - cmd: "rpg enchant candidate 1 sharpness"
  - cmd: "rpg enchant candidate 1 power"
  - cmd: "rpg enchant candidate 1 attunement"
  - cmd: "rpg enchant candidate 1 unbreaking"
  - cmd: "rpg enchant candidate 2 sharpness"
  - cmd: "rpg enchant candidate 2 power"
  - cmd: "rpg enchant candidate 2 attunement"
  - cmd: "rpg enchant candidate 2 unbreaking"
  - cmd: "rpg enchant candidate 3 sharpness"
  - cmd: "rpg enchant candidate 3 power"
  - cmd: "rpg enchant candidate 3 attunement"
  - cmd: "rpg enchant candidate 3 unbreaking"
  - wait: 2
  - cmd: "rpg enchant show"
  - wait: 2
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom iron_sword"
  - wait: 2
  - dump: menu
  - close: ""
  - wait: 2

# US6: THE TABLE WITH AN EMPTY UNIQUE SLOT (a fresh fire weapon), and A CLICK ON IT CHANGES NOTHING AND CHARGES NOTHING:
# the screen before and after, and his vanilla level and points before and after.
US6:
  - hold: empty
  - cmd: "clear @s minecraft:stick"
  - cmd: "rpg give flint_staff"
  - wait: 2
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom flint_staff"
  - wait: 2
  - dump: menu
  - cmd: "xp query @s levels"
  - cmd: "xp query @s points"
  - click: "No unique enchant"
  - wait: 2
  - dump: menu
  - cmd: "xp query @s levels"
  - cmd: "xp query @s points"
  - close: ""
  - wait: 2

# US7: BUYING THE UNIQUE CANDIDATE THROUGH THE MENU charges and activates it as a normal one does.
US7:
  - hold: empty
  - cmd: "clear @s minecraft:iron_sword"
  - cmd: "rpg give iron_sword"
  - wait: 2
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom iron_sword"
  - wait: 2
  - cmd: "xp query @s levels"
  - click: "Dev Kinetic Example"
  - wait: 2
  - dump: menu
  - cmd: "xp query @s levels"
  - close: ""
  - wait: 2
  - hold: iron_sword
  - wait: 2
  - cmd: "rpg enchant show"
  - wait: 2
  - dump: held

# US8: THE INFO ITEM AT THE TOP RIGHT ON EVERY SCREEN PR 3 MOVED (crafting, anvil, grindstone; the enchanting table is
# US5's), and the Level screen as the control: listed for Ben and NOT moved, its summary still at 4.
US8:
  - hold: empty
  - close: ""
  - cmd: "craft"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "anvil"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "grindstone"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "level"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2

# BX1 (2026-11-23, feat/boltor-sound-flint-text): THE FLINT STAFF'S TOOLTIP, Ben's new flavor and ability description.
# Its score is staged at 100 so the damage line reads its authored 20 (GATE-breacher-rework RW1's staging).
BX1:
  - hold: empty
  - cmd: "clear @s minecraft:stick"
  - cmd: "rpg give flint_staff"
  - wait: 2
  - hold: flint_staff
  - cmd: "rpg gearscore set 100"
  - wait: 10
  - dump: held

# BX2 (2026-11-23): THE BOLTOR'S SHOT SOUND. A shot that leaves (straight up, at open sky; its ray ignores its caster),
# then a press on an EMPTY quiver (/rpg rounds 0), 40 ticks later (past the 16-tick cooldown, so the refusal is the
# quiver's). The server cannot witness a visual's sound (PaperCombatWorld.present logs none), so Ben's ear reads it: the
# gate's ONE ASK. The empty press plays the empty-quiver notice's own click (block.dispenser.fail), not a shot.
BX2:
  - hold: empty
  - cmd: "clear @s minecraft:crossbow"
  - cmd: "rpg give boltor"
  - wait: 2
  - hold: boltor
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ 0 -90"
  - wait: 20
  - use: right_click
  - wait: 4
  - dump: held
  - cmd: "rpg rounds 0"
  - wait: 40
  - use: right_click
  - wait: 4
  - dump: held
  - ask: "1 1200 yesno Two Boltor presses just happened. Did the FIRST play a crossbow shot sound and the SECOND play no shot sound (only the empty-quiver click)?"
