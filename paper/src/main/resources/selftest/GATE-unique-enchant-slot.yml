# GATE-unique-enchant-slot (docs/gates/GATE-unique-enchant-slot.md): the unique enchant slot, Ben's cascade, the table's
# new layout and the info item at the top right (2026-11-23; PRs #248, #249 and feat/info-top-right). SURVIVAL, every
# row; no mob; ALL AUTO but BX2. Since 2026-11-23 it carries US8, BX1 and BX2 only; the dev example enchant was deleted.
#
# THE STAGING (READ): his RPG level 13 opens every Nexus station (NexusStationGate: crafting 3, anvil 7, enchanting 10,
# grindstone 13); 30 VANILLA levels at 0 progress are his wallet at the table (XpCurve over getLevel/getExp; the
# Lifetime XP is a different number). The run's restore returns both (SelfTestSnapshot: lifetime XP, and vanilla level
# and progress since this PR).
#
# EACH ROW clears the item types it works with (his own included; the restore returns them) and gives fresh ones, so
# `hold` and `shift_click` (which match a weapon id) can only find the row's own item. A `wait:` follows every
# `rpg enchant` / `rpg give` before the hand changes: those commands act on the player's thread a tick later
# (PLAN-weapon-tiers.md 6.9 item 5).

setup:
  - close: ""
  - hold: empty
  - cmd: "rpg playerxp set @s 13 levels"
  - wait: 40
  - cmd: "xp set @s 30 levels"
  - cmd: "xp set @s 0 points"
  - wait: 2

# US1-US7 WERE RETIRED 2026-11-23, NEVER RUN (the columns re-cut: slot 0 is the weapon slot, slot 1 the unique one, and the
# dev example enchant is deleted). Their readings are GATE-enchant-columns.md's EC1-EC6; see GATE-unique-enchant-slot.md.

# US8: THE INFO ITEM AT THE TOP RIGHT ON EVERY SCREEN PR 3 MOVED (crafting, anvil, grindstone; the enchanting table is
# US5's), and the Level screen as the control: listed for Ben and NOT moved, its summary still at 4.
US8:
  - hold: empty
  - close: ""
  - cmd: "craft"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "anvil"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "grindstone"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "level"
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 2

# BX1 (2026-11-23, feat/boltor-sound-flint-text): THE FLINT STAFF'S TOOLTIP, Ben's new flavor and ability description.
# Its score is staged at 100 so the damage line reads its authored 20 (GATE-breacher-rework RW1's staging).
BX1:
  - hold: empty
  - cmd: "clear @s minecraft:stick"
  - cmd: "rpg give flint_staff"
  - wait: 2
  - hold: flint_staff
  - cmd: "rpg gearscore set 100"
  - wait: 10
  - dump: held

# BX2 (2026-11-23): THE BOLTOR'S SHOT SOUND. A shot that leaves (straight up, at open sky; its ray ignores its caster),
# then a press on an EMPTY quiver (/rpg rounds 0), 40 ticks later (past the 16-tick cooldown, so the refusal is the
# quiver's). The server cannot witness a visual's sound (PaperCombatWorld.present logs none), so Ben's ear reads it: the
# gate's ONE ASK. The empty press plays the empty-quiver notice's own click (block.dispenser.fail), not a shot.
BX2:
  - hold: empty
  - cmd: "clear @s minecraft:crossbow"
  - cmd: "rpg give boltor"
  - wait: 2
  - hold: boltor
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ 0 -90"
  - wait: 20
  - use: right_click
  - wait: 4
  - dump: held
  - cmd: "rpg rounds 0"
  - wait: 40
  - use: right_click
  - wait: 4
  - dump: held
  - ask: "1 1200 yesno Two Boltor presses just happened. Did the FIRST play a crossbow shot sound and the SECOND play no shot sound (only the empty-quiver click)?"
