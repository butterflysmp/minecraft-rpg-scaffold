# SM7 (THE ASK): a cast, his move 8 east at C+40, and the question once the fourth ring has gone out.
SM7:
  - expect_cell: "mage fire"
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "execute align xz positioned ~10.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - stone: ""
  - hold: stone
  - wait: 20
  - cmd: "rpg mana refill"
  - tell: "Smolder is cast now from your feet. Stand still; you will be moved 8 blocks east after the first ring. Watch each ring."
  - drop: selected
  - wait: 40
  - cmd: "tp @s ~8 ~ ~"
  - wait: 180
  - ask: "1 3600 Did each ring of fire spread out from your feet to about 12 blocks, and did the first ring stay where it started when you were moved? (yes / no / not sure)"
