# GATE-summoner (docs/gates/GATE-summoner.md): the Summoner slice, the Bone Whistle and its wolf. Typed as ONE run after
# the mage gate: `/rpg selftest mage-guaranteed+summoner`. SURVIVAL, every row. ALL AUTO except SM17, the one ASK, last.
# On the pad, facing east; the preflight measures east -2..45 and z -6..10 (Z3) (the pad's interior is x -2..45, z -13..13).
# Night, no natural spawns, difficulty EASY (CC'S CALL), his health staged full; each put back by the run's restore.
# SAFETY (the gate file, before the rows): at most 5.000 dealt to him, all of it SM3A's one scripted 0.2. Every other
# mob is frozen (NoAI) or has attack 0 (SM3B, the only one set on him).
# X1: EVERY ROW IS SELF-STAGED. Each row that reads a wolf clears his hands and state, gives and holds the whistle, sets
# the score, refills mana, turns him, casts ITS OWN wolf and probes it before acting, and kills its mobs at the end. A
# row that needs a second item switches to it AFTER its own cast. The lint's SUMMON_UNSTAGED holds every row to that.
setup:
  - pad: ""
  - preflight: "-2 -6 45 10"
  - difficulty: easy
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# SM1R (re-predicts SM1, 2026-11-25): the cast; the refused press read against a mana probe IN ITS OWN TICK (before
# and after); the replace in its real order (the new body's spawn, then the old one's removed cause=replace).
SM1R:
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg maxsummons reset"
  - cmd: "rpg give bone_whistle"
  - wait: 2
  - hold: bone_whistle
  - cmd: "rpg gearscore set 100"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - wait: 6
  - cmd: "rpg mana refill"
  - probe_mana: ""
  - use: ""
  - probe_mana: ""
  - wait: 5
  - probe_summon: "8"
  - probe_mana: ""
  - use: ""
  - probe_mana: ""
  - wait: 2
  - cmd: "rpg gearscore set 200"
  - wait: 200
  - cmd: "rpg mana refill"
  - use: ""
  - wait: 5
  - probe_summon: "8"

