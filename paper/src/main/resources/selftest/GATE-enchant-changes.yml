# GATE-enchant-changes (docs/gates/GATE-enchant-changes.md): Ben's five changes to Airburst Flames and Lapis Crystal,
# 2026-11-23 (PR 1 feat/enchant-changes, PR 2 feat/lapis-crystal-block), and his four changes to the crystal after the
# run of 78826389 (feat/lapis-crystal-look). `/rpg selftest enchant-changes`. SURVIVAL, every row; ALL AUTO but one ASK.
# On the pad (Ben's ruling A): the setup's FIRST step stands him on it facing east, the SECOND measures the ground every
# summon stands on. Night (18000), no natural spawns, no phantoms, difficulty normal, each put back by the run's restore.
# Every mob a frozen NoAI zombie staged at vanilla max 200 (so 1000 health; nothing here dies). Every row self-contained
# under GATE-enchant-columns' four rules (ScenarioLint).
#
# THE SECOND FORM (2026-11-23, after the run of 78826389; the seat's brief). AF1-AF4 read as predicted there and LEFT
# this file: they are not re-run. LB1-LB4 were MISS on the orphan sweep's false line (fixed on feat/lapis-crystal-block)
# and are re-predicted for the fixed and changed body as LB1R2, LB4R2, LB2R2 (with THE ASK) and LB3R2; LB5 is new: the
# shots' radius of 15, inside, beyond, and inside the server's box but outside the sphere. The preflight's box is widened
# to the pad's own z (-13..13) for LB5's mob 13 north.
setup:
  - pad: ""
  - preflight: "0 -13 32 13"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 2
  - probe_self: ""

# LB1R2: THE THROW AND ITS BODY, FIXED AND CHANGED: Lapis Crystal II; the throw; its ORBBODY line (no glow); NO orphan line
# and no Paper WARN; it rests 12 out and keeps its look 60 ticks (six beats); the row's end removes it, and the next
# row's clean finds no task and no body.
LB1R2:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give lapis_staff"
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - cmd: "rpg enchant candidate 0 lapis_crystal"
  - cmd: "rpg enchant level 0 0 2"
  - cmd: "rpg enchant active 0 0"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 40
  - probe_self: ""
  - reload: ""
  - wait: 70
  - clear_state: ""

