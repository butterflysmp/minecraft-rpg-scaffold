  - wait: 330

# LB2R2: A BEAM INTO THE ORB AT LEVEL II, AND THE ONE ASK: its own throw, 20 ticks, his beam east into it; the orb
# strikes N for 10.5 and draws one line to it; then, while that crystal still rests, the one question.
LB2R2:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give lapis_staff"
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - cmd: "rpg enchant candidate 0 lapis_crystal"
  - cmd: "rpg enchant level 0 0 2"
  - cmd: "rpg enchant active 0 0"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: 'summon zombie ~12 ~ ~5 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["n","selftest"],attributes:[{id:"minecraft:max_health",base:200.0}],Health:200.0f}'
