# GATE-blink-tome (docs/gates/GATE-blink-tome.md): the Blink Tome and its Blink, 2026-11-26. Typed as ONE command for the
# whole stack, LAST:
#   /rpg selftest bone-club+blast-fungus+true-tooltips.TT20.TT21.TT22.TT23.TT24.TT25.TT26.TT27+healing-tome+blink-tome
# SURVIVAL. On the pad, at night (18000), difficulty normal, no natural spawns, each put back by the run's restore. ALL
# AUTO: this gate asks NOTHING. EVERY ROW STAGES, ITSELF: his level (2), an empty inventory and state, EMPTY ACCESSORY
# SLOTS (accessory: clear; his own come back at the run's end, H15), his class (mage unless the row says), 40 ticks for
# the reconcile. SAFETY 0.000: no row wounds him, and every mob is NoAI (it holds a target and never acts).
#
# THE STAND AND THE BLOCKERS (BlinkPadLandingTest): a row that may blink summons, AT THE PAD'S STAND and before he moves,
# four NoAI blocker zombies at (17, 13), (23, 13), (17, -13), (23, -13) and its trigger three east of where he will stand,
# then moves him 20 east (tp @s ~20 ~ ~). From (20, 0) every spot the Blink can choose is on the pad's interior floor
# inside the preflight's box, whatever lies outside the pad. A zombie summoned AFTER a blink is summoned at his feet
# (~0 ~ ~0), wherever he landed: always in the interior and the box.
setup:
  - pad: ""
  - preflight: "0 -13 36 13"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# BT1: THE TOOLTIP, WHOLE, AND A4'S REFUSALS BY TEXT. A mage at level 2, the tome given and held (NOT equipped).
BT1:
  - cmd: "rpg playerxp set @s 2 levels"
  - clear_inventory: ""
  - clear_state: ""
  - accessory: "clear"
  - class: "mage"
  - wait: 40
  - cmd: "rpg give blink_tome"
  - wait: 2
  - hold: blink_tome
  - probe_held: ""
  - dump: held
  - cmd: "rpg enchant show"
  - wait: 2
  - cmd: "rpg gearscore set 100"
  - wait: 2
  - cmd: "rpg durability damage 1"
  - wait: 2

# BT2: THE BLINK. A mage wearing it; one NoAI zombie three east of him staged as targeting him. The BLINK line within the
# check's period of the mob_target; he stands where to= says; the zombie forgot him; he is invisible; the sheet line.
BT2:
  - cmd: "rpg playerxp set @s 2 levels"
  - clear_inventory: ""
  - clear_state: ""
  - accessory: "clear"
  - class: "mage"
  - wait: 40
  - cmd: 'summon zombie ~17 ~ ~13 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Silent:1b,Tags:["bkb","selftest"]}'
  - cmd: 'summon zombie ~23 ~ ~13 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Silent:1b,Tags:["bkb","selftest"]}'
  - cmd: 'summon zombie ~17 ~ ~-13 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Silent:1b,Tags:["bkb","selftest"]}'
  - cmd: 'summon zombie ~23 ~ ~-13 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Silent:1b,Tags:["bkb","selftest"]}'
  - cmd: 'summon zombie ~23 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Silent:1b,Tags:["bt","selftest"]}'
  - cmd: "tp @s ~20 ~ ~"
  - cmd: "rpg give blink_tome"
  - wait: 2
  - hold: blink_tome
  - accessory: "equip 0"
  - wait: 10
  - probe_self: ""
  - probe_target: bt
  - mob_target: bt
  - wait: 8
  - probe_self: ""
  - probe_target: bt
  - probe_invisibility: ""
  - cmd: "rpg stats"
  - wait: 2
  - clear_state: ""
  - probe_invisibility: ""

