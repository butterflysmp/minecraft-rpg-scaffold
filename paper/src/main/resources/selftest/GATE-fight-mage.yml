# GATE-fight-mage.md: STEPS F6 + F7, THE DARK MAGE AND THE CRYSTALS, AND BEN'S TUNING (feat/fight-mage, 2026-11-18).
# `/rpg selftest fight-mage`.
#
# It RETIRES selftest/GATE-fight-ring.yml: every FR row is RE-PREDICTED here with the next suffix (FR1R2 ... FR9R2);
# BQ1-BQ6 were answered at the first boot and are superseded by MQ1-MQ8.
#
# THE FIXTURE: `/rpg fight start | land <dx> <dz> | land random | play <min> | mage-die | probe | stop`. Its lines:
# RINGTICK, FIGHTPHASE, STRIKE, FIGHTKILL, MAGEGATE (a refused hit on the Mage), CRYSTAL (lit / removed),
# FIGHTCRYSTAL (a refused hit on a crystal), FIGHTPROBE (the probe), FIGHT land|die|mage spawned|stop|ended|FAILED_*.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-fight-mage.md, THE ARITHMETIC). Every row ends with `rpg fight stop`, then a
# probe of end crystals within 48 (the crystals stand 41.8 from C) and of wither skeletons within 16.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and air above it where anything stands,
# every fill box SAVED first. A mob is spawned by stepping to its spot and back.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

