  - wait: 100
  - ask: "3 2400 yesno Is the wall's height right?"
  - ask: "4 2400 yesno Are the gaps between the rows right?"
  - ask: "5 2400 yesno Is the twist right?"
  - cmd: "rpg fight stop"

