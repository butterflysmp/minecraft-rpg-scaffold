  - wait: 10
  - cmd: "rpg fight stop"
  - cmd: "rpg heal 1000000"
  - ask: "1 2400 yesno Did the fast close's speed feel right?"

# MQ2: the slow close at 0.6, watched from 2 blocks west of the Mage (inside every ring this row draws).
