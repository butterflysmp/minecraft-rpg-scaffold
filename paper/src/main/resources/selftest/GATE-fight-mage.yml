# ===== BEN'S ROWS: HIS OWN WORDS, ONE THING PER QUESTION =====

# MQ1: the fast close at 3.8, its fastest point behind him. C is 44 east (its west edge 4 behind him); the Mage lands 36
# east of C. He sprints east for six seconds; healed every 10 ticks.
MQ1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "execute positioned ~44 ~ ~ run rpg fight start"
  - tell: "QUESTION 1 IS COMING. Face EAST. The ring's WEST edge is 4 blocks behind you. When the next gold line says GO, sprint EAST and try to stay ahead of that edge for six seconds."
  - wait: 100
  - cmd: "rpg fight land 36 0"
  - tell: "GO"
  - cmd: "rpg heal 1000000"
  - wait: 10
  - cmd: "rpg heal 1000000"
  - wait: 10
  - cmd: "rpg heal 1000000"
  - wait: 10
  - cmd: "rpg heal 1000000"
