  - save_blocks: "-1 -1 -1 8 3 1"
  - cmd: "fill ~-1 ~-1 ~-1 ~8 ~-1 ~1 stone"
  - cmd: "fill ~-1 ~ ~-1 ~8 ~3 ~1 air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - wait: 10
  - cmd: "rpg fight land 6 0"
  - cmd: "tp @s ~5 ~ ~ -90 0"
  - tell: "QUESTION 8 IS COMING. Stand still beside the Mage. Crystals will appear high up round the arena, one every four seconds, each aiming a beam at him."
  - wait: 560
  - cmd: "rpg fight probe"
  - cmd: "rpg fight stop"
  - ask: "8 2400 yesno Could you see a beam from each crystal to the Mage?"
  - ask: "9 2400 yesno Ten crystals, one every four seconds: is that pace right?"

# MQ6: the Mage's name.
MQ6:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-1 -1 -1 8 3 1"
  - cmd: "fill ~-1 ~-1 ~-1 ~8 ~-1 ~1 stone"
  - cmd: "fill ~-1 ~ ~-1 ~8 ~3 ~1 air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - wait: 10
  - cmd: "rpg fight land 6 0"
  - tell: "QUESTION 10 IS COMING. Walk up to the Mage, 6 blocks east, and look at him to read his name."
  - wait: 120
  - cmd: "rpg fight stop"
  - ask: "10 2400 yesno His name is \"Withered Dark Mage\". Keep it?"

# MQ7: the play row. The Mage lands at a random spot at least 15 blocks away. Ben fights him with his own weapon. The
# fixture heals him every 10 ticks, stops after a third strike in a row, and ends itself at the Mage's death or a
# failure; the row ends it at 90 seconds otherwise.
MQ7:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - tell: "QUESTION 11 IS COMING: THE FIGHT. The Mage is about to land somewhere at least 15 blocks away. Go and kill him with your own weapon. He cannot be hurt until the ring has closed to 12 blocks around him. Stay inside the ring. You have 90 seconds."
  - wait: 60
  - cmd: "rpg fight play 15"
  - wait: 1800
  - cmd: "rpg fight stop"
  - cmd: "rpg heal 1000000"
  - wait: 2
  - probe_entities: "end_crystal 48"
  - ask: "11 2400 yesno For one player, is 1500 health right for the Mage?"
