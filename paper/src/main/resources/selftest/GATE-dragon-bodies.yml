# GATE-dragon-bodies.md's rows, RE-RUN after the 2026-11-15 boot. The rows here are GATE-dragon-fix.md's (DB1R2 ...),
# each named for the row of GATE-dragon-bodies.md it re-predicts; SelfTestScenariosTest pairs this file with
# GATE-dragon-fix.md. DB8 and DB9 read as predicted on 2026-11-15 and are not re-run. The old rows' predictions and
# readings stay in GATE-dragon-bodies.md, as they are.
#
# 2026-11-16, STEP R3 TOOK TWO ROWS OUT OF THIS FILE (the seat's brief; GATE-dragon-fix.md's dated note). From R3 a
# live Phage within 3 blocks of the player swells and BLOWS. DB10R2 (a live Phage beside him for 100 ticks, "never
# explodes") is now false, and GATE-dragon-blast.md BL1 carries the behaviour. DQ1 (two live Phages while Ben walks
# away and back) was answered on 2026-11-15 and would now blow on him; it is not re-asked. Both rows' predictions and
# readings stay in GATE-dragon-fix.md. Every Phage left in this file is FROZEN (SelfTestScenariosTest pins it).
#
# WHAT CHANGED, and why (GATE-dragon-fix.md, D1 and D2):
#   - Every mob is spawned by the SPAWN step: /rpg spawn's own path, with the row's tag, "t" and "selftest" added and
#     NoAI set INSIDE the pre-spawn consumer. The old rows spawned, then tagged the nearest mob within 1.5 blocks, and
#     on 2026-11-15 that tagged the PREVIOUS row's mob, still standing on the same spot because the row-start clean's
#     removals run a tick later on each mob's own scheduler. The new mob was then never frozen or cleaned and leaked.
#   - The setup declares the difficulty (normal). The run logs what it found and restores it at the end.
#   - Every row-start clean is followed by a LEFTOVER line, which the gate predicts as living=0.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first, so the row-start clean and the run's restore put it back. A mob is spawned
# by stepping the player to its spot, spawning at the feet, and stepping back. The run's restore removes every mob
# tagged "selftest".

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DB1R2: the Knell. scale 1.6, speed 0.6 of the wither skeleton's 0.25, health 360, element void.
DB1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "db1 frozen knell 100"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - probe_body: db1

