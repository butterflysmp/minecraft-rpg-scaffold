# GATE-dragon-bodies.md: dragon-mobs step R1, the bodies and their elements, read from the SERVER. Every body row
# spawns one mob through the shipped /rpg spawn at gear score 100 (so its custom max is its authored health x 1.00),
# tags it, freezes it with NoAI so it stands still while it is read, and reads it with PROBE_BODY. DB10 leaves its
# Phage's AI ON, beside the player, for longer than a vanilla fuse.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first, so the row-start clean and the run's restore put it back. A mob is spawned
# by stepping the player to its spot, spawning at the feet, and stepping back. The run's restore removes every mob
# tagged "selftest".
setup:
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DB1: the Knell. scale 1.6, speed 0.6, health 360 (unchanged), element void.
DB1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - cmd: "rpg spawn knell 100"
  - cmd: "tag @e[type=wither_skeleton,distance=..1.5,sort=nearest,limit=1] add db1"
  - cmd: "tag @e[tag=db1] add t"
  - cmd: "tag @e[tag=db1] add selftest"
  - cmd: "data merge entity @e[tag=db1,limit=1] {NoAI:1b,PersistenceRequired:1b}"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - probe_body: db1

