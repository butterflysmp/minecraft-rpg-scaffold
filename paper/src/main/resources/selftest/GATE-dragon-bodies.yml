# DB10: a stage-1 Phage with its AI ON, two blocks from the player in SURVIVAL, for 100 ticks: more than three vanilla
# fuses of 30. It must still be alive, the floor whole, and the player unhurt.
DB10:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - probe_blocks: "STONE -3 -1 -4 8 -1 4"
  - probe_self: ""
  - cmd: "tp @s ~2 ~ ~"
  - cmd: "rpg spawn phage 100"
  - cmd: "tag @e[type=creeper,distance=..1.5,sort=nearest,limit=1] add db10"
  - cmd: "tag @e[tag=db10] add t"
  - cmd: "tag @e[tag=db10] add selftest"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 100
  - probe_body: db10
  - probe_blocks: "STONE -3 -1 -4 8 -1 4"
  - probe_self: ""

# DB11: the spawn command's refusals. A stage the Phage does not have, and a stage on a mob without stages.
DB11:
  - cmd: "rpg spawn phage stage 6"
  - cmd: "rpg spawn knell stage 2"
  - probe_entities: "creeper 8"
  - probe_entities: "wither_skeleton 8"
