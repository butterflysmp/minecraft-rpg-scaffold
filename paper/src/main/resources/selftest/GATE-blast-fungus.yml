  - cmd: "rpg gearscore set 100"
  - cmd: "rpg enchant clear"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: 'summon zombie ~7.5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["ba","selftest"],attributes:[{id:"minecraft:max_health",base:200.0}],Health:200.0f}'
  - cmd: 'summon zombie ~6 ~ ~5.5 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["bo","selftest"],attributes:[{id:"minecraft:max_health",base:200.0}],Health:200.0f}'
