# GATE-blast-fungus (docs/gates/GATE-blast-fungus.md): the Blast Fungus, Fast and Fungal and Cluster Bombs, 2026-11-26.
# Typed as ONE command with true-tooltips' TT20 to TT27 by reference:
#   /rpg selftest blast-fungus+true-tooltips.TT20.TT21.TT22.TT23.TT24.TT25.TT26.TT27
# SURVIVAL. On the pad (the setup's FIRST step stands him on it facing east), at NIGHT (18000), difficulty normal, no
# natural spawns, each put back by the run's restore. ALL AUTO except BF9, this gate's one ASK, last of it. Every row
# empties his storage and state, gives itself what it holds, sets his level (1), its score (100 unless the row says),
# its enchant state, mana and a cleared cooldown, turns him (block-centred, east, or straight down where the row says)
# and waits before the press. Every mob is a frozen NoAI zombie at max_health 200 (so 1000 custom health), placed at the
# coordinates BlastFungusGateArithmeticTest executes; the one summon (BF6's wolf) is frozen with NoAI too.
# SAFETY (the gate file): NO row deals him damage; every blast is spared for players (PvpPath.FUSED_BURST), EXECUTED.
setup:
  - pad: ""
  - preflight: "-2 -8 32 10"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg playerxp set @s 1 levels"
  - wait: 40
  - probe_self: ""

# BF1: THE TOOLTIP, BARE, AND A FRESH ROLL'S SLOT 0.
BF1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give blast_fungus"
  - wait: 2
  - hold: blast_fungus
  - probe_held: ""
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant clear"
  - wait: 2
  - cmd: "rpg gearscore set 100"
  - wait: 2
  - dump: held

# BF2: THE POOLS, 500 ROLLS BY THE ROLL'S OWN CALL.
BF2:
