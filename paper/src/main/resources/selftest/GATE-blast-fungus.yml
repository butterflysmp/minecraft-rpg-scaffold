  - wait: 40
  - probe: "ba 12"
  - probe: "bo 12"
  - probe: "bn 12"
  - cmd: "rpg mana refill"
  - probe_mana: ""
  - use: right_click
  - probe_mana: ""
  - wait: 15
  - probe_positions: "item 12"
  - wait: 10
  - probe_positions: "item 12"
  - wait: 10
  - probe_positions: "item 12"
  - wait: 10
  - probe: "ba 12"
  - probe: "bo 12"
  - probe: "bn 12"
  - probe_positions: "item 12"

