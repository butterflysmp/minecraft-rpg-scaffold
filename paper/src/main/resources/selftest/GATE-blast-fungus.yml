  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give blast_fungus"
  - wait: 2
  - hold: blast_fungus
  - cmd: "rpg enchant rollstats 500"

# BF3: THE THROW. Three zombies: ba inside all three blasts, bo inside one, bn inside none. Mana before and after the
# press, in its tick. The bodies sampled three times while they rest; the zombies read after the fuse.
