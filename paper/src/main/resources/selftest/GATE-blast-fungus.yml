# BF9, THE ONE ASK OF THIS GATE, LAST OF IT: F11 on a flower pot 2 east of him, in both hands, with a plain red mushroom
# as his control. The pot is a saved block, put back at the next row's start and by the run's restore.
BF9:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "2 0 0 2 0 0"
  - cmd: "setblock ~2 ~ ~ minecraft:flower_pot"
  - cmd: "rpg give blast_fungus"
  - cmd: "give @s minecraft:red_mushroom 1"
  - wait: 2
  - hold: blast_fungus
  - cmd: "rpg mana refill"
  - probe_blocks: "POTTED_RED_MUSHROOM 2 0 0 2 0 0"
  - probe_blocks: "FLOWER_POT 2 0 0 2 0 0"
  - probe_inventory: blast_fungus
  - ask: "1 3600 Right-click the flower pot 2 blocks east of you three times: first holding the Blast Fungus; then press F to put the Blast Fungus in your off hand and right-click the pot with your main hand empty; then holding the plain red mushroom. Did only the third click put a mushroom in the pot, and do you still have the Blast Fungus?"
  - probe_blocks: "POTTED_RED_MUSHROOM 2 0 0 2 0 0"
  - probe_blocks: "FLOWER_POT 2 0 0 2 0 0"
  - probe_inventory: blast_fungus
