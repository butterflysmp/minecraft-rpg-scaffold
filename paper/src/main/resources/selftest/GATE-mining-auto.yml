# GATE-mining-auto.md: every mining row the instrument can drive through the SHIPPED path. A click is a
# BlockDamageEvent fired into every listener (the dig verb), so RpgListeners and MiningService judge it as they judge
# Ben's, then the arm swing's server-side reset (Player#resetCooldown). The witnesses are the MINING and HUD lines the
# shipped code logs, and the instrument's DRIVE lines. The instrument reads; it never judges.
#
# THE STAGING, the same in every row (SelfTestMiningAimTest assumes it): the player at a block centre facing south; a
# floor; a deepslate wall 7 wide and 4 high whose NORTH face is 1.5 blocks ahead; every fill box SAVED first, so the
# row-start clean and the run's restore put it back. The main hand is replaced with an iron pickaxe (attack speed
# 1.2); the run's restore puts the inventory back. Every row first removes a slot a skipped row may have left (the
# reply says when there was none), and every row ends by removing the slot it placed.
#
# A charged click is `aim_patch: live`, `wait: 17`, `dig`: the previous dig reset the ticker, and 17 ticks after a
# reset getAttackCooldown() reads (17 + 0.5) / 16.666666 clamped = 1.0 (executed; GATE-mining-auto.md, A7). A row
# that cannot know its spot count (2 or 3, 4 or 5 ...) clicks the maximum; a click after the break reads NOT_LIVE.
setup:
  - mining_trace: on
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# A1: the two roll refusals at a medium slot (a size that does not fit; a size that is not loaded), then the
# control: a size that fits is rolled.
A1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ 0 0"
  - save_blocks: "-4 -1 -1 4 5 4"
  - cmd: "fill ~-4 ~-1 ~-1 ~4 ~-1 ~4 minecraft:stone"
  - cmd: "fill ~-4 ~ ~-1 ~4 ~5 ~4 minecraft:air"
  - cmd: "fill ~-3 ~ ~2 ~3 ~3 ~2 minecraft:deepslate"
  - cmd: "item replace entity @s weapon.mainhand with minecraft:iron_pickaxe"
  - aim_block: "0 0 2 NORTH"
  - wait: 2
  - cmd: "rpg mining remove"
  - cmd: "rpg mining place iron medium"
  - cmd: "rpg mining roll large"
  - cmd: "rpg mining roll huge"
  - cmd: "rpg mining roll medium"
  - wait: 2
  - aim_block: "0 0 2 NORTH"
  - wait: 2
  - cmd: "rpg mining remove"

