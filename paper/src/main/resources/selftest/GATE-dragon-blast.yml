# GATE-dragon-blast-2.md: the Phage's blast after the follow-up of 2026-11-17 (PLAN-dragon-mobs.md, RULINGS, "the 60
# and the 150, and knockback"), read from the SERVER. Its damage at ZERO distance is 60 (stage 1) to 150 (stage 5),
# x gear score / 100; out to the 6-block reach it falls off on vanilla's curve (MobBlast.falloff). Each victim is now
# PUSHED as a vanilla blast pushes: 1 - distance / 6, times content's multiplier (1.0), along the Phage's feet to the
# victim's eyes (MobBlast.knockbackStrength, pushVector).
#
# EVERY ROW HERE IS A NEW ROW, NAMED FOR THE GATE-dragon-blast.md ROW IT RE-PREDICTS, WITH THE NEXT SUFFIX (BL1 is now
# BL1R2, DS1R3 is now DS1R4, BQ1 is now BQ1R2). The old rows' predictions and readings stay in GATE-dragon-blast.md,
# under a dated note. SelfTestScenariosTest pairs this file with GATE-dragon-blast-2.md.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first, so the row-start clean and the run's restore put it back. A mob is spawned
# by stepping the player to its spot, spawning at the feet, and stepping back. The run's restore removes every mob
# tagged "selftest". A ROW IN WHICH HE IS PUSHED (BL1R2, BL2R2, BL9R2, DS1R4, BQ1R2) LAYS ITS FLOOR TO x - 12, as BL5's
# always did: the push throws him west, away from a Phage east of him, and he must land on the row's own floor.
#
# TWO WAYS A PHAGE BLOWS, AND THE ROWS USE BOTH:
#   - LIVE (BL1R2, BL2R2): AI on, two blocks from the player. Vanilla's swell starts inside 3 blocks and fills in the
#     content's 30 ticks; its prime is then ours.
#   - FROZEN, by DETONATE (BL3R2, BL4R2, BL6R2, BL7R2, BL9R2, BQ1R2): NoAI, at a fixed spot, blown with
#     Creeper#explode(), which raises the same prime. Every distance is exact.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-blast-2.md, THE PLAYER CANNOT DIE): each row that can hit him first
# heals him to his maximum, which is at least 100, and the most any row can deal before his defence after one heal is
# under 100: BL1R2 60, BL2R2 90 (a stage 5 at GEAR SCORE 60), BL6R2 0.508, BL9R2 22.5, DS1R4 36 + 49.5 = 85.5 (its
# parent at GEAR SCORE 60), BQ1R2 33.333, then 83.333 (both blown at exactly 2 blocks).

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# BL1R2: a LIVE stage-1 Phage two blocks east blows on the player: 60 x the falloff before defence, a push, the Phage
# gone, the floor whole.
BL1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl1 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 120
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

# BL2R2: a LIVE stage-5 Phage, at GEAR SCORE 60 so that its worst case is under the player's floor, blows on him: 90 x
# the falloff before defence, a push, and NO children, no split.
BL2R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl2 live phage stage 5 60"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 120
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

# BL3R2: a frozen stage-1 Phage blown SEVEN blocks east (the player is outside its 6-block reach) grows a stage-1
# Phage 3.00 away to stage 2; the Phage that blew never grows and is gone.
BL3R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~7 ~ ~"
  - spawn: "bl3x frozen phage 100"
  - cmd: "tp @s ~ ~ ~3"
  - spawn: "bl3b frozen phage 100"
  - cmd: "tp @s ~-7 ~ ~-3 -90 0"
  - wait: 5
  - detonate: bl3x
  - wait: 5
  - probe_body: bl3b
  - probe_body: bl3x
  - probe_entities: "creeper 16"

# BL4R2: a frozen husk and a frozen stage-5 Phage, each 2.00 from a frozen stage-1 Phage blown seven blocks east, keep
# their health AND ARE NOT PUSHED: their velocity is read in the blast's own tick. A frozen mob cannot travel, so its
# POSITION could not show a push (PLAN-dragon-mobs.md section 7 F-B); its velocity can. THE CONTROL: a third frozen
# husk (bl4c), given a velocity by a vanilla data merge, reads that velocity back, so the probe can see one.
BL4R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~7 ~ ~"
  - spawn: "bl4x frozen phage 100"
  - cmd: "tp @s ~ ~ ~2"
  - spawn: "bl4h frozen husk 100"
  - cmd: "tp @s ~ ~ ~-4"
  - spawn: "bl4p frozen phage stage 5 100"
  - cmd: "tp @s ~-9 ~ ~2"
  - spawn: "bl4c frozen husk 100"
  - cmd: "tp @s ~2 ~ ~ -90 0"
  - wait: 5
  - probe: bl4h
  - probe: bl4p
  - probe_motion: bl4h
  - probe_motion: bl4p
  - cmd: "execute as @e[tag=bl4c] run data merge entity @s {Motion:[0.0d,0.0d,0.5d]}"
  - probe_motion: bl4c
  - detonate: bl4x
  - probe_motion: bl4h
  - probe_motion: bl4p
  - wait: 5
  - probe: bl4h
  - probe: bl4p
  - probe_entities: "creeper 16"

# BL5R2: a LIVE stage-1 Phage's fuse is a third full when the player steps nine blocks west: the swell falls, nothing
# blows. Then it is killed (a stage 1 does not split), so it cannot follow him into the next row.
BL5R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl5 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - await_fuse: "bl5 10 200"
  - cmd: "tp @s ~-9 ~ ~ -90 0"
  - wait: 5
  - probe_fuse: bl5
  - probe_entities: "creeper 16"
  - cmd: "kill @e[tag=bl5]"
  - probe_entities: "creeper 16"

# BL6R2: a frozen stage-1 Phage blown 5.90 blocks east, just inside the 6-block reach, hits the player for a sliver
# and pushes him by one sixtieth.
BL6R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~5.9 ~ ~"
  - spawn: "bl6 frozen phage 100"
  - cmd: "tp @s ~-5.9 ~ ~ -90 0"
