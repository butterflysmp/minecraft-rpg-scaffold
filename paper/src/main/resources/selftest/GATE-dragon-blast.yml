# --- THE SPLIT ROWS (GATE-dragon-blast-2.md's, re-predicted) ----------------------------------------------------------
# A frozen parent's children are born frozen (SelfTestSnapshot.freezeSplitChild). DS1R5 is the one row that wants them
# live, and thaws them with the instrument's THAW step, which reads their AI back.

# DS1R5: a stage 5 at GEAR SCORE 60, killed by the PLAYER'S emberblade at 1 custom health, splits into two frozen stage
# 1s (S1). He is healed, the children are THAWED, and each walks in, lights inside its own trigger and blows (S2),
# PULLING him. If the second has grown from the first's blast, its GROWTH line's distance EQUALS the first's BLAST
# line's spared distance, both decided at the blast.
DS1R5:
  - cmd: "rpg give emberblade"
  - hold: emberblade
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds1 frozen phage stage 5 60"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - aim: ds1
  - wait: 2
  - cmd: "rpg mobdamage 95"
  - wait: 40
  - attack: ds1
  - wait: 30
  - probe_entities: "creeper 16"
  - probe_body: ds1
  - cmd: "rpg heal 1000000"
  - thaw: ds1
  - wait: 200
  - probe_entities: "creeper 16"

