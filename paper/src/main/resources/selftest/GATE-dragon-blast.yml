# GATE-void-implosion.md: the Phage's blast as a VOID IMPLOSION (PLAN-dragon-mobs.md, RULINGS of 2026-11-17, "swap the
# push for the pull"), and the Knell's slab defect (F19), read from the SERVER. The file keeps its name so the run sheet's
# command is unchanged (`/rpg selftest dragon-blast`). Its damage is unchanged: 60 (stage 1) to 150 (stage 5) at ZERO
# distance, x gear score / 100, vanilla's curve out to the 6-block reach. Each victim is now PULLED toward the Phage's
# feet: (1 - distance / 6) x 1.25 x (1 - its explosion knockback resistance), HORIZONTAL, capped so the slide the jar's
# friction gives it stops half a block short (core.shape.Implosion). The look is the content visual void_implosion.
#
# EVERY ROW HERE IS A NEW ROW, NAMED FOR THE GATE-dragon-blast-2.md ROW IT RE-PREDICTS, WITH THE NEXT SUFFIX (BL1R2 is now
# BL1R3, DS1R4 is now DS1R5, BQ1R2 is now BQ1R3), and the new rows IM1-IM4 and KS1. The old rows' predictions and
# readings stay in GATE-dragon-blast-2.md, under a dated note. SelfTestScenariosTest pairs this file with
# GATE-void-implosion.md.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first, so the row-start clean and the run's restore put it back. A mob is spawned
# by stepping the player to its spot, spawning at the feet (tagged in the same step), and stepping back. The run's
# restore removes every mob tagged "selftest". A pull carries him EAST, toward a Phage east of him, and never past it,
# so every row's own floor holds him.
#
# EVERY DETONATION IS FOLLOWED BY AT LEAST 12 TICKS IN ITS OWN ROW: the swirl is drawn over 10 ticks as pending work,
# and work still pending at the next row's start would read in that row's LINGER line.
#
# TWO WAYS A PHAGE BLOWS, AND THE ROWS USE BOTH:
#   - LIVE (BL1R3, BL2R3): AI on, two blocks from the player. Vanilla's swell starts inside 3 blocks and fills in the
#     content's 30 ticks; its prime is then ours.
#   - FROZEN, by DETONATE (BL3R3, BL4R3, BL6R3, BL7R3, BL9R3, IM1-IM4, BQ1R3): NoAI, at a fixed spot, blown with
#     Creeper#explode(), which raises the same prime. Every distance is exact.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-void-implosion.md, THE PLAYER CANNOT DIE): each row that can hit him first
# heals him to his maximum, which is at least 100, and the most any row can deal before his defence after one heal is
# under 100: BL1R3 60, BL2R3 90 (a stage 5 at GEAR SCORE 60), BL6R3 0.508, BL9R3 22.5, IM1 1.271, IM3 33.333, IM4
# 55.575, KS1 65 (a Knell's beam), DS1R5 36 + 49.5 = 85.5 (its parent at GEAR SCORE 60), BQ1R3 33.333, then 83.333.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# BL1R3: a LIVE stage-1 Phage two blocks east blows on the player: 60 x the falloff before defence, a PULL toward it, the
# Phage gone, the floor whole.
BL1R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl1 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 120
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

# BL2R3: a LIVE stage-5 Phage, at GEAR SCORE 60 so that its worst case is under the player's floor, blows on him: 90 x
