# --- THE SPLIT ROWS (GATE-dragon-blast.md's R3 rows, re-predicted) -----------------------------------------------------
# A frozen parent's children are born frozen (SelfTestSnapshot.freezeSplitChild). DS1R4 is the one row that wants them
# live, and thaws them with the instrument's THAW step, which reads their AI back.

# DS1R4: a stage 5 at GEAR SCORE 60, killed by the PLAYER'S emberblade at 1 custom health, splits into two frozen stage
# 1s (S1). He is healed, the children are THAWED, and each comes for him and blows (S2). If the second has grown from
# the first's blast, its GROWTH line's distance EQUALS the first's BLAST line's spared distance, both decided at the
# blast (the reading that failed on 2026-11-17).
DS1R4:
  - cmd: "rpg give emberblade"
  - hold: emberblade
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds1 frozen phage stage 5 60"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - aim: ds1
  - wait: 2
  - cmd: "rpg mobdamage 95"
  - wait: 40
  - attack: ds1
  - wait: 30
  - probe_entities: "creeper 16"
  - probe_body: ds1
  - cmd: "rpg heal 1000000"
  - thaw: ds1
  - wait: 200
  - probe_entities: "creeper 16"

# DS2R4: a stage 5 killed by /kill splits; its two children are born frozen.
DS2R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds2 frozen phage stage 5 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=ds2]"
  - wait: 5
  - probe_entities: "creeper 16"
  - probe_body: ds2

# DS5R4: once only: after a split the count is 2, and it is still 2 forty ticks later (frozen children cannot blow).
DS5R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "ds5 frozen phage stage 5 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=ds5]"
  - wait: 5
  - probe_entities: "creeper 16"
  - wait: 40
  - probe_entities: "creeper 16"

# DS6R4: the row-start clean removes DS5R4's two children (they carry DS5R4's tags), so this row starts with none. It
# MUST follow DS5R4 directly.
DS6R4:
  - probe_entities: "creeper 16"

# DG6R4: a stage 5 killed 2 blocks from a stage-2 Phage splits; its two frozen children stay at 1, the bystander goes
# to 3. The growth gate's staging: the floor runs to x + 12.
DG6R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg6b frozen phage stage 2 300"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "dg6p frozen phage stage 5 300"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=dg6p]"
  - wait: 2
  - probe_body: dg6b
  - probe_body: dg6p
  - probe_entities: "creeper 16"

# DG9R4: a stage-4 Phage grown to 5 by a death, then killed, splits into two frozen children.
DG9R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 12 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~12 ~5 ~4 air"
  - cmd: "tp @s ~3 ~ ~"
  - spawn: "dg9 frozen phage stage 4 300"
  - cmd: "tp @s ~-3 ~ ~ -90 0"
  - wait: 5
  - cmd: 'summon enderman ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,Tags:["dg9e","t","selftest"]}'
  - cmd: "kill @e[tag=dg9e]"
  - wait: 2
  - probe_body: dg9
  - cmd: "kill @e[tag=dg9]"
  - wait: 2
  - probe_body: dg9
  - probe_entities: "creeper 16"

# BQ1R2: Ben's three questions, by the ASK step. A frozen stage-1 Phage is blown exactly 2 blocks east of him, then,
# after he is put back and healed, a frozen stage-5 one: both at gear score 100, so the authored 60 and 150, times the
# falloff at 2 blocks. Blown, not live, so the distance is fixed and the worst case is under his floor (live, a stage 5
# at his feet would deal 150). 2 blocks is where every live Phage of 2026-11-17 blew (d=2.000, six times).
BQ1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bq1small frozen phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 40
  - detonate: bq1small
  - wait: 40
  - ask: "1 1200 Did the blast push you back?"
  - ask: "2 1200 Your design says the small Phage explodes 'dealing a little damage'. Watch your health bar: did that feel like a little?"
  - return: ""
  - wait: 2
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bq1big frozen phage stage 5 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 40
  - detonate: bq1big
  - wait: 40
  - ask: "3 1200 Your design says the big Phage explodes 'dealing a lot of damage'. Watch your health bar: did that feel like a lot?"
