  - wait: 5

# BL7R2: a frozen stage-1 Phage blown 6.05 blocks east, just beyond the reach, neither hits nor pushes him.
BL7R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~6.05 ~ ~"
  - spawn: "bl7 frozen phage 100"
