# GATE-void-implosion.md: the Phage's blast as a VOID IMPLOSION, ITS OWN FUSE, AND ITS DISTANCES BY STAGE (PLAN-dragon-
# mobs.md, RULINGS of 2026-11-17; the seat's two rulings on #204), and the Knell's slab defect (F19), read from the
# SERVER. The file keeps its name so the run sheet's command is unchanged (`/rpg selftest dragon-blast`).
#
# 2026-11-18, THE DRAG (GATE-implosion-drag.md): every row here that BLOWS A PHAGE was MOVED to
# selftest/GATE-implosion-drag.yml and re-predicted there with the next suffix (BL1R3-BL4R3, BL6R3, BL7R3, BL9R3,
# IM1-IM6, FZ1, FZ3, FZ5, DS1R5): every BLAST line's head now names the drag, and a victim is dragged. BQ1R3 was
# retired (Ben answered it; BQ2 there asks the drag's questions). The rows left here blow nothing, so the drag changes
# none of their lines, and they keep their readings in GATE-void-implosion.md. The header below describes the file as
# it was before the move.
#
# THE PHAGE NOW: vanilla's swell goal is removed and OUR fuse (core MobFuse) lights STRICTLY inside the stage's
# trigger with sight, turns back STRICTLY beyond its cancel, and blows 30 ticks after it lights; each light and turn is
# SHOWN to every viewer by a swell packet and one SWELL line. Its distances follow its height: trigger 1 to 3, cancel
# 7/3 to 7, reach 2 to 6 (stage 1 to stage 5). Its blast damages as before (60 to 150 at zero distance, x gear
# score / 100, vanilla's curve out to the STAGE's reach) and PULLS: 1.25 x the old push's horizontal part toward the
# Phage, and the old push's own lift, the horizontal scaled down so the modelled rest point stops half a block short.
#
# ROWS: BL1R3-BL9R3 and the split rows re-predict GATE-dragon-blast-2.md's (the next suffix); IM1-IM6 the implosion's
# edges, cap and centre; FZ1, FZ3 and FZ5 the fuse at stages 1, 3 and 5; KS1 the Knell on a slab; BQ1R3 Ben's four
# questions. SelfTestScenariosTest pairs this file with GATE-void-implosion.md.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and six blocks of
# air above it, every fill box SAVED first. A mob is spawned by stepping the player to its spot, spawning at the feet
# (tagged in the same step), and stepping back. A LIVE Phage that must not walk has its movement speed set to 0 in the
# same pass as its spawn (the Knell rows' way): its AI still targets and its fuse still runs. A pull carries him EAST,
# toward a Phage east of him, and never past it.
#
# EVERY DETONATION IS FOLLOWED BY AT LEAST 12 TICKS IN ITS OWN ROW (the swirl is pending work for 10 ticks), and every
# kill after a probe by 2.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-void-implosion.md, THE PLAYER CANNOT DIE): the most any row can deal before his
# defence after one heal is under 100. Every LIVE stage 3 or 5 is at GEAR SCORE 60, so even at its feet it deals 63 or 90.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# BL5R3: a LIVE stage-1 Phage walks in and lights; at a third of its fuse the player steps nine blocks west, beyond its
# 7/3-block cancel: it turns back, and its swell falls; nothing blows. Then it is killed (a stage 1 does not split).
BL5R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl5 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - await_fuse: "bl5 10 200"
  - cmd: "tp @s ~-9 ~ ~ -90 0"
  - wait: 5
  - probe_fuse: bl5
  - probe_entities: "creeper 16"
  - wait: 2
  - cmd: "kill @e[tag=bl5]"
  - probe_entities: "creeper 16"

# BL8R3: flint and steel's route (Creeper#ignite) still cannot light a Phage: refused, no fuse, no blast.
BL8R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "bl8 frozen phage 100"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - ignite: bl8
  - wait: 40
  - probe_fuse: bl8
  - probe_entities: "creeper 16"

# --- THE KNELL'S SLAB DEFECT, F19 (GATE-void-implosion.md) -----------------------------------------------------------

# KS1: the player stands ON A BOTTOM SLAB (his feet half a block up); a frozen Knell 8 blocks east beams him, and 24
# ticks after the fire it lands 50 degrees right on the stone floor beside him. The teleport rows' staging.
KS1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
  - cmd: "fill ~-10 ~ ~-10 ~12 ~7 ~10 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "ks1 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - cmd: "tp @s ~ ~0.5 ~ -90 0"
  - cmd: "setblock ~ ~-0.5 ~ smooth_stone_slab[type=bottom]"
  - wait: 5
  - probe_self: ""
  - probe_at: ks1
  - teleport_draw: "ks1 right 50"
  - beam: ks1
  - wait: 130
  - probe_at: ks1
  - probe_self: ""

