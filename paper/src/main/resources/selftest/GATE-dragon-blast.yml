# BL4R3: a frozen husk and a frozen stage-5 Phage, each 2.00 from a frozen stage-1 Phage blown seven blocks east, keep
# their health AND ARE NOT PULLED: their velocity is read in the blast's own tick. A frozen mob cannot travel, so its
# POSITION could not show a pull (PLAN-dragon-mobs.md section 7 F-B); its velocity can. THE CONTROL: a third frozen
# husk (bl4c), given a velocity by a vanilla data merge, reads that velocity back, so the probe can see one.
BL4R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 5 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "tp @s ~7 ~ ~"
  - spawn: "bl4x frozen phage 100"
  - cmd: "tp @s ~ ~ ~2"
  - spawn: "bl4h frozen husk 100"
  - cmd: "tp @s ~ ~ ~-4"
  - spawn: "bl4p frozen phage stage 5 100"
  - cmd: "tp @s ~-9 ~ ~2"
  - spawn: "bl4c frozen husk 100"
  - cmd: "tp @s ~2 ~ ~ -90 0"
  - wait: 5
  - probe: bl4h
  - probe: bl4p
  - probe_motion: bl4h
  - probe_motion: bl4p
  - cmd: "execute as @e[tag=bl4c] run data merge entity @s {Motion:[0.0d,0.0d,0.5d]}"
  - probe_motion: bl4c
  - detonate: bl4x
  - probe_motion: bl4h
  - probe_motion: bl4p
  - wait: 12
  - probe: bl4h
  - probe: bl4p
  - probe_entities: "creeper 16"

