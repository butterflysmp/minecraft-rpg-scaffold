  - cmd: "kill @e[tag=t]"
  - cmd: 'summon zombie ~2.819 ~ ~1.026 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~2.298 ~ ~1.928 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - wait: 60
  - probe_positions: "zombie 16"
  - use: right_click
  - wait: 10
  - probe: t

