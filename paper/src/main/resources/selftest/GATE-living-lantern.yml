  - probe: t

# LL6: THE TRAVEL. Zombies at 2 (n) and 5 (f): the front reaches 2 on its 3rd tick and 5 on its 6th, which is 4 and 7
# ticks after the press (the cast runs a tick after it). Probes either side of each, clear of the tick it lands on and
# the one after: n at 3 and 6 ticks after the press, f at 6 and 9. The game time is stamped with the press.
LL6:
  - cmd: "rpg give living_lantern"
  - hold: living_lantern
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=n]"
  - cmd: "kill @e[tag=f]"
  - cmd: 'summon zombie ~2 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["n","selftest"]}'
  - cmd: 'summon zombie ~5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["f","selftest"]}'
  - wait: 60
  - use: right_click
  - cmd: "time query gametime"
  - wait: 3
  - probe: n
  - wait: 3
  - probe: n
  - probe: f
  - wait: 3
  - probe: f

# LL7: A WALL. Two stone blocks (feet and eye height) 2 east, a zombie 4 east behind them. No hit. The blocks are saved
# first, so the next row's clean puts them back. LL2 is its control: the same kind of zombie, nearer, no wall, a hit.
LL7:
  - cmd: "rpg give living_lantern"
  - hold: living_lantern
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=t]"
  - save_blocks: "2 0 0 2 1 0"
  - cmd: "fill ~2 ~ ~ ~2 ~1 ~ minecraft:stone"
  - cmd: 'summon zombie ~4 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - wait: 60
  - use: right_click
  - wait: 12
  - probe: t

