# CR3 (owed, the craft and its tooltip half, carried since GATE-remove-dev-weapons): a crafting table, eight iron
# nuggets and a fire charge; he places the table and crafts ONE Living Lantern; then the row finds it, holds it and
# dumps it. If he did not craft, the hold is SKIPPED by name ("no hotbar slot holds living_lantern") and the row is
# UNREAD. The table he places stays in the world; the inventory restore takes the items back. EVERY LANTERN IN HIS
# INVENTORY IS CLEARED FIRST (the rows above gave him one each, and the inventory is restored only at the gate's end),
# so the one the row finds is the one he crafted; any lantern of his own is put back by the run's restore.
CR3:
  - cmd: "clear @s minecraft:lantern"
  - probe_inventory: living_lantern
  - cmd: "give @s minecraft:crafting_table 1"
  - cmd: "give @s minecraft:iron_nugget 8"
  - cmd: "give @s minecraft:fire_charge 1"
  - tell: "PLACE THE CRAFTING TABLE and craft ONE Living Lantern: eight iron nuggets round the fire charge (iron all round, fire charge in the middle). You have 60 seconds. Do not right-click with the fire charge."
  - wait: 1200
  - probe_inventory: living_lantern
  - hold: living_lantern
  - dump: held

# HF1R3 (owed, GATE-crystal-shard-staff.md HF1, a third time): held fire on the 14-tick staff, with ONLY that staff in
# his hotbar. The held item's id is logged at the start and the end of the wait; the row's own /rpg firerate clears
# the sample first and reads it after. The selftest's own presses are kept out of every sample. The lanterns and the
# Knell Beam the rows gave him are cleared first, to free inventory slots for HOLD_ONLY's moves (the run's restore puts
# back anything of his own those clears took).
HF1R3:
  - cmd: "clear @s minecraft:lantern"
  - cmd: "clear @s minecraft:echo_shard"
  - cmd: "rpg give crystal_shard_staff"
  - hold_only: crystal_shard_staff
  - cmd: "rpg mana refill"
  - cmd: "rpg firerate"
  - probe_held: ""
  - tell: "HOLD RIGHT-CLICK with the Crystal Shard Staff until your mana runs out (about 12 shots). It is the only thing in your hotbar: do not scroll. You have 15 seconds."
  - wait: 300
  - probe_held: ""
  - cmd: "rpg firerate"

# LL9: A FREE GO, THEN THE ONE QUESTION. Six frozen zombies 2 to 7 blocks out, the Living Lantern in hand, 30 seconds;
# then the zombies go and the question is put. No answer in 60 seconds is logged NOT STATED.
LL9:
  - cmd: "rpg give living_lantern"
  - hold: living_lantern
  - cmd: "rpg mana refill"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=t]"
  - cmd: 'summon zombie ~2.5 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~4 ~ ~1.5 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~4 ~ ~-2 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~5.5 ~ ~0.5 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~6.5 ~ ~-1 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - cmd: 'summon zombie ~3 ~ ~-4 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - tell: "30 seconds with the Living Lantern: face the zombies and right-click. A question follows."
  - wait: 600
  - cmd: "kill @e[tag=t]"
  - ask: "1 1200 words Did the flames reach as far and as wide as they looked?"
