# TQ1R3: Ben's two teleport questions. A frozen Knell 12 blocks east beams him once; its move is NOT fixed (the
# production draw). He listens for the ring after the hit and watches the Knell as it fades.
TQ1R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-14 -1 -14 14 7 14"
  - cmd: "fill ~-14 ~-1 ~-14 ~14 ~-1 ~14 stone"
  - cmd: "fill ~-14 ~ ~-14 ~14 ~7 ~14 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "tq1r3 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still. The bell strike and its ringing start together. After the beam hits you, watch the Knell and listen to the ringing fade.","color":"gold"}'
  - wait: 60
  - beam: tq1r3
  - wait: 130
  - ask: "1 1200 Did the Knell move about a second before the ringing faded?"
  - ask: "2 1200 Does the whole sequence feel timed right now?"
