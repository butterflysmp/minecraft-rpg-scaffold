# GATE-dragon-teleport.md: the Knell's teleport after its beam lands (PLAN-dragon-mobs.md step R6), read from the
# SERVER. 12 ticks after a beam HITS its target, the Knell moves to the circle around the target's feet at the
# horizontal distance it stood, turned 30 to 70 degrees to one side; it tries 5 spots on that side, then 5 on the
# other, and stays if none will do. A spot needs a loaded chunk, room for the Knell's scaled body, ground beneath,
# within 3 blocks of the target's feet height (the nearest standing height wins), and sight of the target.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor 23 x 21 and air
# 8 high above it, every fill box SAVED first, so the row-start clean and the run's restore put it back. A Knell is
# spawned FROZEN (NoAI: it cannot walk or melee) 8 blocks east, by stepping the player to its spot, spawning at the
# feet, and stepping back. Before the forced beam, TELEPORT_DRAW fixes its next decision's side and first angle, so
# every landing is an exact coordinate. KB11R2 is the one LIVE Knell, its walking speed set to 0 so it cannot reach
# him.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-teleport.md): every row heals him first and deals at most one 35
# before his defence; KB11R2 heals him every 100 ticks, and its beams are at least 112 ticks apart.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB10R2: re-predicts GATE-dragon-beam.md KB10. A forced hit; 12 ticks after the fire the Knell lands 50 degrees to
# the RIGHT (toward south), 8 blocks from him: (+5.142, 0, +6.128).
KB10R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
  - cmd: "fill ~-10 ~ ~-10 ~12 ~7 ~10 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb10r2 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - probe_at: kb10r2
  - teleport_draw: "kb10r2 right 50"
  - beam: kb10r2
  - wait: 40
  - probe_at: kb10r2

