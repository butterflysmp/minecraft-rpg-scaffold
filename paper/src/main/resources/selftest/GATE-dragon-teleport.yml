# THE KNELL'S TELEPORT, AS RE-PREDICTED BY GATE-dragon-knell-5.md (the shot in the middle, 2026-11-17). The file keeps
# its name so the run sheet's command is unchanged (`/rpg selftest dragon-teleport`). Every row is now
# GATE-dragon-knell-5.md's, named for the GATE-dragon-knell-4.md row it supersedes with the next suffix. The old
# readings stay in GATE-dragon-knell-4.md.
#
# THE TELEPORT NOW: 24 ticks after a beam HITS its target, 48 after its lock (Ben: "I want the shot to be in the
# middle"; the telegraph and the delay are a pair, 24 and 24), the Knell moves to the circle around the target's feet,
# at the horizontal distance it stood, 30 to 70 degrees around. The landing rules are unchanged.
#
# EVERY ROW WAITS PAST ITS MOVE: a forced beam's fire is at most 26 ticks after the BEAM step, so its move is at most
# 50 after it; each row waits 130 ticks after the step before its last read, so the TELEPORT line lands inside the
# row, never in the next one's bracket.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor 23 x 21 and air 8 high above it, every fill
# box SAVED first. A Knell is spawned FROZEN (NoAI: it cannot walk or melee) 8 blocks east. TELEPORT_DRAW fixes its next
# decision's side and first angle, so every landing is an exact coordinate. The live-cycle row's Knell is the one LIVE
# Knell, its walking speed set to 0 so it cannot reach him.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-knell-5.md): every row heals him before every beam that can land, at
# most 65 before his defence; the live-cycle row heals him every 100 ticks, and its beams are at least 124 ticks apart.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB10R6: re-predicts GATE-dragon-knell-4.md KB10R5. A forced hit; 24 ticks after the fire the Knell lands 50 degrees RIGHT (toward south), 8 blocks from him: (+5.142, 0, +6.128).
KB10R6:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
  - cmd: "fill ~-10 ~ ~-10 ~12 ~7 ~10 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb10r6 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - probe_at: kb10r6
  - teleport_draw: "kb10r6 right 50"
  - beam: kb10r6
  - wait: 130
  - probe_at: kb10r6

