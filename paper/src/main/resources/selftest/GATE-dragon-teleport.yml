# KB11R2: re-predicts GATE-dragon-beam.md KB11. The live cycle by bound, AND unbroken by a teleport. A LIVE Knell 8
# east whose walking speed is set to 0 (so it cannot reach him) begins its own first beam 100-200 ticks after it
# appears; the hit moves it (right 50, fixed); its NEXT own beam comes 100-200 ticks after the FIRST FIRE. A frozen
# Knell in range begins none. He is healed every 100 ticks.
KB11R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
