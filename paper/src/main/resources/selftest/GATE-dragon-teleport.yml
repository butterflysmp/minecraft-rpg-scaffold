# THE KNELL'S TELEPORT, AS RE-PREDICTED BY GATE-dragon-knell-2.md (the follow-up of 2026-11-17). The file keeps its
# name so the run sheet's command is unchanged (`/rpg selftest dragon-teleport`); its rows are now
# GATE-dragon-knell-2.md's, each named for the row it supersedes with the next suffix (KB10R2 -> KB10R3, TP2 -> TP2R2).
# The old rows' predictions and readings stay in GATE-dragon-teleport.md, untouched, under a dated note.
#
# THE TELEPORT NOW: 89 ticks after a beam HITS its target (Ben: "The teleport happens when the sound is fully finished,
# if a target is hit of course"; the seat's 89, from the resonance's measured length), the Knell moves to the circle
# around the target's feet, at the horizontal distance it stood, 30 to 70 degrees around. The landing rules are
# unchanged (5 spots a side, ground within 3 blocks, sight of the target).
#
# EVERY ROW WAITS PAST ITS MOVE: a forced beam's fire is at most 28 ticks after the BEAM step, so its move is at most
# 117 after it; each row waits 130 ticks after the step before its last read, so the TELEPORT line lands inside the
# row, never in the next one's bracket.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor 23 x 21 and air 8 high above it, every fill
# box SAVED first. A Knell is spawned FROZEN (NoAI: it cannot walk or melee) 8 blocks east. TELEPORT_DRAW fixes its next
# decision's side and first angle, so every landing is an exact coordinate. KB11R3 is the one LIVE Knell, its walking
# speed set to 0 so it cannot reach him.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-knell-2.md): every row heals him before every beam that can land, at
# most 65 before his defence; KB11R3 heals him every 100 ticks, and its beams are at least 126 ticks apart.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB10R3: re-predicts GATE-dragon-teleport.md KB10R2. A forced hit; 89 ticks after the fire the Knell lands 50 degrees RIGHT (toward south), 8 blocks from him: (+5.142, 0, +6.128).
KB10R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
  - cmd: "fill ~-10 ~ ~-10 ~12 ~7 ~10 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb10r3 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - probe_at: kb10r3
  - teleport_draw: "kb10r3 right 50"
  - beam: kb10r3
  - wait: 130
  - probe_at: kb10r3

