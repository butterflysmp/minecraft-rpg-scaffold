# TQ1: Ben's three questions. A frozen Knell 12 blocks east beams him once; its move afterwards is NOT fixed (the
# production draw), as a fight would have it.
TQ1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-14 -1 -14 14 7 14"
  - cmd: "fill ~-14 ~-1 ~-14 ~14 ~-1 ~14 stone"
  - cmd: "fill ~-14 ~ ~-14 ~14 ~7 ~14 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "tq1 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still. The Knell to your east will beam you. After the hit, watch where it goes.","color":"gold"}'
  - wait: 60
  - beam: tq1
  - wait: 50
  - ask: "1 1200 After it hit you, did it move to a new spot?"
  - ask: "2 1200 Could you find it again straight away?"
  - ask: "3 1200 Does that feel fair to someone fighting it with a bow?"
