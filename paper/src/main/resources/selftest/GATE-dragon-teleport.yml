# THE KNELL'S TELEPORT, AS RE-PREDICTED BY GATE-dragon-knell-3.md (Ben's re-timing, 2026-11-17). The file keeps its
# name so the run sheet's command is unchanged (`/rpg selftest dragon-teleport`); its rows are now
# GATE-dragon-knell-3.md's, each named for the row it supersedes with the next suffix (KB10R3 -> KB10R4, TP2R2 ->
# TP2R3, TP14 -> TP14R2). The old rows' predictions and readings stay in GATE-dragon-knell-2.md, untouched, under a
# dated note.
#
# THE TELEPORT NOW: 44 ticks after a beam HITS its target (Ben: "change the teleport time to one second before the
# resonance sound ends"; the seat's 44, from the resonance's middle variant), the Knell moves to the circle around the
# target's feet, at the horizontal distance it stood, 30 to 70 degrees around. The landing rules are unchanged.
#
# EVERY ROW WAITS PAST ITS MOVE: a forced beam's fire is at most 22 ticks after the BEAM step, so its move is at most
# 66 after it; each row waits 130 ticks after the step before its last read, so the TELEPORT line lands inside the
# row, never in the next one's bracket.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor 23 x 21 and air 8 high above it, every fill
# box SAVED first. A Knell is spawned FROZEN (NoAI: it cannot walk or melee) 8 blocks east. TELEPORT_DRAW fixes its next
# decision's side and first angle, so every landing is an exact coordinate. KB11R4 is the one LIVE Knell, its walking
# speed set to 0 so it cannot reach him.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-knell-3.md): every row heals him before every beam that can land, at
# most 65 before his defence; KB11R4 heals him every 100 ticks, and its beams are at least 120 ticks apart.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB10R4: re-predicts GATE-dragon-knell-2.md KB10R3. A forced hit; 44 ticks after the fire the Knell lands 50 degrees RIGHT (toward south), 8 blocks from him: (+5.142, 0, +6.128).
KB10R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -5 -10 12 7 10"
  - cmd: "fill ~-10 ~-1 ~-10 ~12 ~-1 ~10 stone"
  - cmd: "fill ~-10 ~ ~-10 ~12 ~7 ~10 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb10r4 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - probe_at: kb10r4
  - teleport_draw: "kb10r4 right 50"
  - beam: kb10r4
  - wait: 130
  - probe_at: kb10r4

