  - dump: held
  - probe_inventory: boltor
  - cmd: "menu"
  - wait: 3
  - click: "Vault"
  - wait: 3
  - shift_click: "bottom boltor"
  - wait: 3
  - dump: menu
  - probe_inventory: boltor
  - click: "Back to the Nexus"
  - probe_inventory: boltor
  - dump: menu
  - wait: 3
  - dump: menu
  - close: ""
  - wait: 3
  - cmd: "menu"
  - wait: 3
  - click: "Vault"
  - wait: 3
  - dump: menu
  - probe_inventory: boltor
  - shift_click: "top boltor"
  - wait: 3
