# GATE-nexus-back.md: Back from the five input-slot menus (and Crafting's Recipe Book) no longer closes the screen
# first. Each row puts one boltor into the menu's input slot through the router's own shift-move, presses the menu's
# button, and reads where the boltor is: in the SAME tick as the click (no wait between the click and the probe), and
# again after the hop. An AUTO reading is a reading of the SERVER: whether the screen visibly closed, and where the
# pointer went, are Ben's (HAND rows H1-H3).
setup:
  - close: ""
  - cmd: "rpg playerxp set @s 20 levels"
  - wait: 20
  - cmd: "rpg give boltor"
  - wait: 2

# NB1: Anvil. The boltor into the anvil, Back, and it is in the inventory in the click's own tick.
NB1:
  - hold: boltor
  - dump: held
  - probe_inventory: boltor
  - cmd: "menu"
  - wait: 3
  - click: "Anvil"
  - wait: 3
  - shift_click: "bottom boltor"
  - wait: 2
  - dump: menu
  - probe_inventory: boltor
  - click: "Back to the Nexus"
  - probe_inventory: boltor
  - dump: menu
  - wait: 3
  - dump: menu
  - probe_inventory: boltor
  - close: ""
  - hold: boltor
  - dump: held

