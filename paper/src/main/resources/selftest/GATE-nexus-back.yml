  - click: "Recipe Book"
  - probe_inventory: boltor
  - dump: menu
  - wait: 3
  - dump: menu
  - click: "Back to crafting"
  - wait: 3
  - dump: menu
  - probe_inventory: boltor
  - close: ""

# NB7: a departing menu is inert. Back, then a shift-click in the SAME tick: the router never sees it, so the boltor
# stays in the inventory and the hub still opens once.
NB7:
  - probe_inventory: boltor
  - cmd: "menu"
  - wait: 3
  - click: "Anvil"
  - wait: 3
  - click: "Back to the Nexus"
  - shift_click: "bottom boltor"
  - probe_inventory: boltor
  - wait: 3
  - dump: menu
  - probe_inventory: boltor
  - close: ""
