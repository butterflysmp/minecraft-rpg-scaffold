# THE SKREEL AND ITS MOUNT, AND THE PHALANX'S BLINK COOLDOWN AND R3 (step R8, GATE-dragon-skreel.md). Run by
# `/rpg selftest dragon-skreel`.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and AIR 14 HIGH above it (the leap rises
# 8.19 blocks and the rider sits on top), every fill box SAVED first. Every mob is spawned at GS 100 unless the row says.
# A pair whose leap a row reads is LIVE (a frozen mount never moves, and is steered by nobody); every survivor that could
# reach the player is frozen or killed at once.
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row lets more than one 55 (50 after his defence), or
# two of the Phalanx's 40s, land between heals. His floor is 100. A push lifts him at most 1.15 blocks.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DB6R3 (re-predicts GATE-dragon-fix.md's DB6R2): ONE SPAWN MAKES TWO. A FROZEN Skreel at GS 300 in the overworld (which
# rolls 100), 5 east: the rider and its mount, the mount carrying the rider's 300.
DB6R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 6 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~6 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "db6 frozen skreel 300"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - probe_body: db6
  - probe_pair: db6
  - probe_entities: "spider 8"
  - cmd: "kill @e[tag=db6]"
  - wait: 5

# DB7R3 (re-predicts DB7R2): THE MOUNT ALONE. A frozen withered_mount: 160 health, the spider's own speed (no ridden
# modifier), no element, no rider.
DB7R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 6 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~6 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "db7 frozen withered_mount 100"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - probe_body: db7
  - probe_pair: db7
  - probe_entities: "wither_skeleton 8"
  - cmd: "kill @e[tag=db7]"
  - wait: 5

# PS3: THE POUNCE LANDS. A LIVE pair 10 east (in its band, so it stands). A forced wind-up aimed at his feet; he steps 1
# east during it, still inside the landing's 3: rooted 20 ticks, the leap, the landing at his old feet, a HURT of 55
# before defence, and the push east.
PS3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-16 -1 -12 18 14 12"
  - cmd: "fill ~-16 ~-1 ~-12 ~18 ~-1 ~12 stone"
  - cmd: "fill ~-16 ~ ~-12 ~18 ~14 ~12 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~10 ~ ~"
  - spawn: "ps3 live skreel 100"
  - cmd: "tp @s ~-10 ~ ~ -90 0"
  - wait: 5
  - probe_at: ps3
  - pounce: ps3
  - wait: 1
  - cmd: "tp @s ~1 ~ ~ -90 0"
  - wait: 10
  - probe_at: ps3
  - wait: 50
  - probe_self: ""
  - cmd: "kill @e[tag=ps3]"
  - wait: 5

# PS4: OUT OF THE WAY IN TIME, AND A MOB AT THE LANDING. As PS3, but he steps 4 east during the wind-up, out of the 3;
# a frozen husk stands 1 south of the aim. The landing: no victim, the husk spared, no HURT.
PS4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-16 -1 -12 18 14 12"
  - cmd: "fill ~-16 ~-1 ~-12 ~18 ~-1 ~12 stone"
  - cmd: "fill ~-16 ~ ~-12 ~18 ~14 ~12 air"
  - cmd: "rpg heal 1000000"
  - cmd: 'summon husk ~ ~ ~1 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["ps4h","t","selftest"]}'
  - cmd: "tp @s ~10 ~ ~"
  - spawn: "ps4 live skreel 100"
  - cmd: "tp @s ~-10 ~ ~ -90 0"
  - wait: 5
  - pounce: ps4
  - wait: 1
  - cmd: "tp @s ~4 ~ ~ -90 0"
  - wait: 60
  - probe: ps4h
  - probe_self: ""
  - cmd: "kill @e[tag=ps4]"
  - cmd: "kill @e[tag=ps4h]"
  - wait: 5

# PS5: SEPARATED BY A COMMAND. A FROZEN pair; /ride dismounts the rider: the pair breaks (separated), the mount keeps
# its ridden speed and is widowed, and neither is in a pair again.
PS5:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 6 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~6 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "ps5 frozen skreel 100"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - cmd: "ride @e[tag=ps5,type=wither_skeleton,limit=1] dismount"
  - wait: 3
  - probe_pair: ps5
  - cmd: "kill @e[tag=ps5]"
  - wait: 5

# PS6: THE LIVE CYCLE. A forced wind-up he dodges (4 east); the pair backs off to its band, and its OWN next wind-up
# begins 120 ticks after the first began, at his feet. He is healed before that one lands.
PS6:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-16 -1 -12 18 14 12"
  - cmd: "fill ~-16 ~-1 ~-12 ~18 ~-1 ~12 stone"
  - cmd: "fill ~-16 ~ ~-12 ~18 ~14 ~12 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~10 ~ ~"
  - spawn: "ps6 live skreel 100"
  - cmd: "tp @s ~-10 ~ ~ -90 0"
  - wait: 5
  - pounce: ps6
  - wait: 1
  - cmd: "tp @s ~4 ~ ~ -90 0"
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 80
  - probe_pair: ps6
  - probe_self: ""
  - cmd: "kill @e[tag=ps6]"
  - wait: 5

# PS7: THE MOUNT DIES FIRST. A live pair 10 east and a FROZEN stage-1 Phage 2 south of it. The mount is killed: the rider
# dismounts where it is, the pair's loop ends, and the Phage does NOT grow (the mount has no element). The rider is
# frozen at once (on foot it would fight him), then killed: its death DOES grow the Phage, the row's positive control.
PS7:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-16 -1 -12 18 14 12"
  - cmd: "fill ~-16 ~-1 ~-12 ~18 ~-1 ~12 stone"
  - cmd: "fill ~-16 ~ ~-12 ~18 ~14 ~12 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~10 ~ ~"
  - spawn: "ps7 live skreel 100"
  - cmd: "tp @s ~ ~ ~2"
  - spawn: "ps7p frozen phage 100"
  - cmd: "tp @s ~-10 ~ ~-2 -90 0"
  - wait: 5
  - probe_body: ps7p
  - cmd: "kill @e[tag=ps7,type=spider]"
  - wait: 3
  - cmd: "data merge entity @e[tag=ps7,type=wither_skeleton,limit=1] {NoAI:1b}"
  - wait: 2
  - probe_pair: ps7
  - probe_body: ps7p
  - cmd: "kill @e[tag=ps7,type=wither_skeleton]"
  - wait: 5
  - probe_body: ps7p
  - cmd: "kill @e[tag=ps7p]"
  - wait: 5

# PS8: THE RIDER DIES FIRST. As PS7, the rider killed: the Phage DOES grow (the rider is Void), the mount carries on alone,
# keeping its 1.3x, widowed, its AI on, with no further wind-up though he stands in its band for 140 ticks.
PS8:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-16 -1 -12 18 14 12"
  - cmd: "fill ~-16 ~-1 ~-12 ~18 ~-1 ~12 stone"
  - cmd: "fill ~-16 ~ ~-12 ~18 ~14 ~12 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~10 ~ ~"
  - spawn: "ps8 live skreel 100"
  - cmd: "tp @s ~ ~ ~2"
  - spawn: "ps8p frozen phage 100"
  - cmd: "tp @s ~-10 ~ ~-2 -90 0"
  - wait: 5
  - cmd: "kill @e[tag=ps8,type=wither_skeleton]"
  - wait: 25
  - probe_body: ps8p
  - probe_pair: ps8
  - wait: 140
  - probe_pair: ps8
  - cmd: "kill @e[tag=ps8]"
  - cmd: "kill @e[tag=ps8p]"
  - wait: 5

# PB1: THE COOLDOWN. A LIVE Phalanx 8 east, rooted by a movement speed of 0 so it cannot walk out of reach. A forced
# blink lands it 8 south; he steps to 3 west of where it landed, inside its trigger box, and stays. It fires (visible
# again at its first shot) and decides NO blink for 239 ticks; on the 240th after the landing it decides one.
PB1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-6 -1 -18 30 6 18"
  - cmd: "fill ~-6 ~-1 ~-18 ~30 ~-1 ~18 stone"
  - cmd: "fill ~-6 ~ ~-18 ~30 ~6 ~18 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "pb1 live phalanx 100"
  - cmd: "attribute @e[tag=pb1,limit=1] minecraft:movement_speed base set 0"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 2
  - blink: "pb1 90 8"
  - wait: 3
  - cmd: "tp @s ~5 ~ ~8 -90 0"
  - wait: 140
  - cmd: "rpg heal 1000000"
  - wait: 120
  - cmd: "rpg heal 1000000"
  - wait: 20
  - cmd: "kill @e[tag=pb1]"
  - wait: 5

# PB2: A FAILED ATTEMPT DOES NOT START IT. A LIVE Phalanx 8 east (speed 0), he stands 8 west of it, outside its box. A
# forced blink over a pit: all eight refused, nothing lands. He steps to 3 west of it: on the next tick it decides its
# OWN blink, which it could not do if the failure had started a cooldown.
PB2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-6 -6 -18 30 6 18"
  - cmd: "fill ~-6 ~-1 ~-18 ~30 ~-1 ~18 stone"
  - cmd: "fill ~-6 ~ ~-18 ~30 ~6 ~18 air"
  - cmd: "fill ~7 ~-6 ~7 ~9 ~-1 ~9 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "pb2 live phalanx 100"
  - cmd: "attribute @e[tag=pb2,limit=1] minecraft:movement_speed base set 0"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 2
  - blink: "pb2 90 8"
  - wait: 3
  - cmd: "tp @s ~5 ~ ~ -90 0"
  - wait: 5
  - cmd: "kill @e[tag=pb2]"
  - wait: 5

# PB3: R3, A BLINK DECIDED AT A FRACTIONAL HEIGHT LANDS. A FROZEN Phalanx standing on a bottom stone slab, its feet half
# a block up. A forced blink 8 south onto the flat floor lands, at the floor's height. Then a second forced blink, 8
# west, during the cooldown the first started: it ignores it, says so, and lands.
PB3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-4 -1 -4 12 6 12"
  - cmd: "fill ~-4 ~-1 ~-4 ~12 ~-1 ~12 stone"
  - cmd: "fill ~-4 ~ ~-4 ~12 ~6 ~12 air"
  - cmd: "setblock ~8 ~ ~ stone_slab[type=bottom]"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~0.5 ~"
  - spawn: "pb3 frozen phalanx 100"
  - cmd: "tp @s ~-8 ~-0.5 ~ -90 0"
  - wait: 5
  - probe_at: pb3
  - blink: "pb3 90 8"
  - wait: 5
  - blink: "pb3 180 8"
  - wait: 5
  - probe_at: pb3
  - cmd: "kill @e[tag=pb3]"
  - wait: 5

# PQ1: BEN'S ROW, THE SKREEL. A live pair 14 east, his to watch for 30 seconds: let it wind up, then get out of the way;
# let one landing hit him. He does not attack it. Healed every 5 seconds.
PQ1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-18 -1 -18 30 14 18"
  - cmd: "fill ~-18 ~-1 ~-18 ~30 ~-1 ~18 stone"
  - cmd: "fill ~-18 ~ ~-18 ~30 ~14 ~18 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~14 ~ ~"
  - spawn: "pq1 live skreel 100"
  - cmd: "tp @s ~-14 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"A Skreel on its mount, 14 blocks east, pounces every 6 seconds. Watch it crouch and spark for a second before it leaps: get out of the way of a few, and let one land on you. Do not attack it. 30 seconds.","color":"gold"}'
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 100
  - cmd: "rpg heal 1000000"
  - wait: 100
  - cmd: "kill @e[tag=pq1]"
  - wait: 5
  - ask: "1 1200 Could you see the Skreel wind up before it leapt?"
  - ask: "2 1200 Could you get out of the way in time?"
  - ask: "3 1200 Did the landing hit feel right for a pounce?"

# PQ2: BEN'S ROW, THE PHALANX'S COOLDOWN. A live Phalanx 12 east, his to fight for 40 seconds with the sword in his
# hand, as BQ1; healed every 10 seconds.
PQ2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-6 -1 -18 30 6 18"
  - cmd: "fill ~-6 ~-1 ~-18 ~30 ~-1 ~18 stone"
  - cmd: "fill ~-6 ~ ~-18 ~30 ~6 ~18 air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg give emberblade"
  - hold: emberblade
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "pq2 live phalanx 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"A Phalanx 12 blocks east. Walk up to it: it blinks away, and now it cannot blink again for 12 seconds. Chase it and hit it. 40 seconds.","color":"gold"}'
  - wait: 200
  - cmd: "rpg heal 1000000"
  - wait: 200
  - cmd: "rpg heal 1000000"
  - wait: 200
  - cmd: "rpg heal 1000000"
  - wait: 200
  - ask: "1 1200 Does the Phalanx's blink feel right with the 12-second cooldown?"
  - cmd: "kill @e[tag=pq2]"
  - wait: 5
