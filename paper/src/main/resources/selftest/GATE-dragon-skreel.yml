# THE SKREEL AND ITS MOUNT, AND THE PHALANX'S BLINK (step R8, GATE-dragon-skreel.md). Run by
# `/rpg selftest dragon-skreel`.
#
# SECOND BOOT (after the boot of 45bc33ce, 2026-11-17). Only the rows that FAILED or CHANGE are here, each under its
# re-predicted name: the band edge fixed (DB6R4, PS6R2, PS9, PS10, PS11), Ben's 12-24 blink (PB1R2, PB2R2, PB4, BB4R2), and
# Ben's two rows (PQ3, PQ4). The rows that read as predicted at 45bc33ce and whose lines do not change are not re-run:
# DB7R3, PS3, PS4, PS5, PS7, PS8, PB3.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and AIR above it (14 high where a Skreel
# leaps: it rises 8.19 blocks and the rider sits on top), every fill box SAVED first. Every mob is spawned at GS 100
# unless the row says. Where a Phalanx blinks of its own, the floor reaches 25 blocks round it every way: its blink
# lands 12 to 24 out.
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row lets more than one Skreel landing (55, 50
# after his defence) or two of the Phalanx's 40s land between heals. His floor is 100. A push lifts him at most 1.15
# blocks.
#
# THE PROBE LAG (step R8): a probe_pair or probe_shot reads on the mob's own scheduler, a tick later, so every such
# probe is followed by `wait: 2` before any kill. The loader refuses a row that does not.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# DB6R4 (re-predicts DB6R3, whose PAIR lines were read a tick late, after the kill): ONE SPAWN MAKES TWO, read live. A
# FROZEN Skreel at GS 300, 5 east. The pair probe now has its 2 ticks before the kill.
DB6R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-3 -1 -4 8 6 4"
  - cmd: "fill ~-3 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-3 ~ ~-4 ~8 ~6 ~4 air"
  - cmd: "tp @s ~5 ~ ~"
  - spawn: "db6r4 frozen skreel 300"
  - cmd: "tp @s ~-5 ~ ~ -90 0"
  - wait: 5
  - probe_body: db6r4
  - probe_pair: db6r4
  - probe_entities: "spider 8"
  - wait: 2
  - cmd: "kill @e[tag=db6r4]"
  - wait: 5

