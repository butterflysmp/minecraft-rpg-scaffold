# GATE-sword-convert.md: CONVERT ON ARRIVAL (feat/sword-convert, 2026-11-20). `/rpg selftest sword-convert`.
# This file's gate carries the ONE R0 and run sheet for the three sword PRs. Nothing here can hurt him: the one mob is a
# NoAI zombie that never swings.
setup:
  - trace: on
  - difficulty: normal
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "rpg playerxp set @s 1 levels"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - close: ""

# SCA1: a PLAIN vanilla iron sword given by /give arrives in his inventory and is minted the next tick; then it is held,
# its tooltip dumped, and it hits a fresh frozen zombie at full charge.
SCA1:
  - cmd: "give @s minecraft:iron_sword 1"
  - wait: 5
  - probe_inventory: iron_sword
  - hold: iron_sword
  - dump: held
  - cmd: "kill @e[tag=t]"
  - cmd: 'summon zombie ~2 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","selftest"]}'
  - wait: 40
  - attack: t
  - wait: 5
  - cmd: "kill @e[tag=t]"

# SCA2: a plain NETHERITE sword (loot's case: it is not crafted) converts too, claimed as its upgrade's result.
SCA2:
  - cmd: "give @s minecraft:netherite_sword 1"
  - wait: 5
  - probe_inventory: netherite_sword
  - hold: netherite_sword
  - dump: held

# SCA3: a plain diamond sword carrying a VANILLA enchantment and vanilla wear: the wear carries, the vanilla enchantment does not.
SCA3:
  - cmd: "give @s minecraft:diamond_sword[minecraft:enchantments={'minecraft:sharpness':5},minecraft:damage=40] 1"
  - wait: 5
  - hold: diamond_sword
  - dump: held
  - cmd: "rpg enchant show"
  - cmd: "rpg durability damage 1"

# SCA4: a MINTED sword (ironblade, on iron_sword) arriving is left alone: no ARRIVAL line names it.
SCA4:
  - cmd: "rpg give ironblade"
  - wait: 5
  - probe_inventory: ironblade

# SCA5: an unclaimed item (a stick) is left alone.
SCA5:
  - cmd: "give @s minecraft:stick 1"
  - wait: 5

# SCB1-SCB3: Ben's three questions, asked at the end of the boot (after he has crafted, smithed and seen SCA1).
SCB1:
  - ask: "1 2400 words Is the crafted Iron Sword's name, colour and tooltip what you expect?"
SCB2:
  - ask: "2 2400 yesno Did the smithed Netherite Sword keep its enchantments, as far as you can see?"
SCB3:
  - ask: "3 2400 yesno When the plain sword you were given turned into an Iron Sword in your inventory, was it clear what happened?"
