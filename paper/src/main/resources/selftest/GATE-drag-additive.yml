# GATE-drag-additive.md: THE DRAG, ADDITIVE (feat/drag-additive, 2026-11-18; the seat's ruling: the drag must not
# depend on packet timing). `/rpg selftest drag-additive`.
#
# THE PHAGE NOW: its blast damages as before, ONCE, at the instant it blows; then for the 20 ticks after it, every player
# it is hostile to inside the stage's reach is DRAGGED toward where it stood. Each tick his OWN CLIENT is sent an add,
# which it adds to whatever he is doing (an explosion packet's knockback, with no sound and nothing to see): the smaller
# of 0.33 x (1 - d / reach) and the hold, 0.04067 x (his distance - 0.5) on stone. The server never reads, estimates or
# rebuilds how he is moving. At or inside half a block of the Phage's feet nothing is added.
#
# ROWS: every row of GATE-implosion-drag.yml, RE-PREDICTED with the next suffix (their staging is unchanged); SD5 (a
# still player from 5); CS1 (the consistency row: the same staging from 4, FIVE times); BQ3, Ben's six questions.
# GATE-implosion-drag.yml is retired with this file: its rows are these. SelfTestScenariosTest pairs this file with
# GATE-drag-additive.md.
#
# THE INSTRUMENT: the setup turns DRAGTICK on (one line per player victim per drag tick: where the server saw him, his
# move packets since the last tick, the add, its bound, his ping, his keys); the run's end turns it off.
#
# THE STAGING, the same as the blast gate's: the player at a block centre facing east (+x); a stone floor and air above
# it, every fill box SAVED first; a mob spawned by stepping to its spot and back. A drag carries him EAST, toward a
# Phage east of him.
#
# EVERY DETONATION IS FOLLOWED BY AT LEAST 24 TICKS IN ITS OWN ROW: the drag and the swirl are pending work for 20, and
# the DRAG lines print when the drag's last tick runs. A row that reads his feet after a blast reads them 45 ticks after.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-drag-additive.md, THE PLAYER CANNOT DIE): the most any row can deal before his
# defence after one heal is under 100. The drag itself deals nothing.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""
  - drag_tick: "on"

# BL1R5: a LIVE stage-1 Phage two blocks east walks in, lights inside its 1-block trigger, blows, and drags him in.
BL1R5:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-12 -1 -4 8 5 4"
  - cmd: "fill ~-12 ~-1 ~-4 ~8 ~-1 ~4 stone"
  - cmd: "fill ~-12 ~ ~-4 ~8 ~5 ~4 air"
  - cmd: "rpg heal 1000000"
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"
  - cmd: "tp @s ~2 ~ ~"
  - spawn: "bl1 live phage 100"
  - cmd: "tp @s ~-2 ~ ~ -90 0"
  - wait: 150
  - probe_entities: "creeper 16"
  - return: ""
  - wait: 2
  - probe_blocks: "STONE -12 -1 -4 8 -1 4"

