# MG2 WAS REPLACED BY MG2R, 2026-11-24 (the seat's gate fix): MG2 set "rpg playerxp set @s 30 levels", which writes the RPG
# profile's lifetime XP and NOT the vanilla bar the table charges (READ: EnchantMenu's wallet is XpCurve.totalPoints(
# getLevel(), getExp()); RpgCommand.playerXp writes ProfileService.setLifetimeXp and nothing else), so it leaned on his
# own vanilla wallet. MG2R stages that wallet by the vanilla command that sets it (the run's snapshot restores it, READ:
# SelfTestSnapshot writes back setLevel and setExp) and reads it with "xp query" (READ by javap: levels is
# experienceLevel, points is floor(experienceProgress x getXpNeededForNextLevel())).
# MG2R: THE FIX, THROUGH THE TABLE, ON A STAGED WALLET. Wallet 1395 (level 30, 0 into it); the unlock costs 352; 1043
# after it (level 26, 46 into it: progress 0.5 of 92); the activate costs nothing.
MG2R:
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give lapis_staff"
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - cmd: "rpg enchant candidate 0 polished_scepter"
  - cmd: "rpg enchant candidate 0 lapis_crystal"
  - cmd: "rpg enchant level 0 1 1"
  - cmd: "rpg enchant active 0 1"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: "xp set @s 30 levels"
  - cmd: "xp set @s 0 points"
  - wait: 2
  - cmd: "xp query @s levels"
  - cmd: "xp query @s points"
  - wait: 20
  - reload: ""
  - wait: 20
  - clear_state: ""
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom lapis_staff"
  - wait: 2
  - dump: menu
  - click: "Polished Scepter"
  - wait: 2
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "xp query @s levels"
  - cmd: "xp query @s points"
  - hold: lapis_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg mana refill"
  - reload: ""
  - wait: 20
  - clear_state: ""
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom lapis_staff"
  - wait: 2
  - click: "Lapis Crystal"
  - wait: 2
  - dump: menu
  - close: ""
  - wait: 2
  - cmd: "xp query @s levels"
  - cmd: "xp query @s points"
  - hold: lapis_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg mana refill"
  - reload: ""
  - wait: 20
  - clear_state: ""

