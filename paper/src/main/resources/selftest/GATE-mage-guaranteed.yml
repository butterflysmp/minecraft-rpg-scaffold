# GATE-mage-guaranteed (docs/gates/GATE-mage-guaranteed.md): the seat's brief of 2026-11-24 -- the press tick (PR A),
# the content changes (PR C), the guaranteed candidate and the five cast tunes (PR D), Wildfire (PR E). PR B (the Volley
# Stone) and PR F (Mana Burn) are STOPPED and have no row. `/rpg selftest mage-guaranteed`. SURVIVAL, every row; ALL AUTO,
# no ASK. On the pad, facing east; the preflight measures east 0..42 and z -6..10, so every summon stands inside it.
# Night (18000), no natural spawns, no phantoms, difficulty normal, each put back by the run's restore. Every mob a frozen
# NoAI zombie, at vanilla max 200 (1000 health) or 400 (2000 health) as the row says; nothing here dies. Every row
# self-contained: it empties his storage, gives a fresh weapon, sets his level to 1 (the level bonus 0; the table row 30),
# its score 100, its enchant state, mana, a cleared cooldown and a fresh record, turns him and waits before the press, and
# probes only its own mobs, in reach.
setup:
  - pad: ""
  - preflight: "0 -6 42 10"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 2
  - probe_self: ""

# MG1: THE POOLS. A FRESH roll of each weapon (rpg give rolls on acquire): its slot 0 shown, then 500 rolls tallied. No mob.
MG1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give flint_staff"
  - wait: 2
  - hold: flint_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give crystal_shard_staff"
  - wait: 2
  - hold: crystal_shard_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give lapis_staff"
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give living_lantern"
  - wait: 2
  - hold: living_lantern
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give cursed_emerald"
  - wait: 2
  - hold: cursed_emerald
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give knell_beam"
  - wait: 2
  - hold: knell_beam
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give blaze_kings_staff"
  - wait: 2
  - hold: blaze_kings_staff
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - clear_inventory: ""
  - cmd: "rpg give breacher"
  - wait: 2
  - hold: breacher
  - cmd: "rpg enchant show"
  - cmd: "rpg enchant rollstats 500"
  - wait: 2

# MG2: THE FIX, THROUGH THE TABLE. The Lapis Staff's slot 0 staged as a roll makes it (Polished Scepter first, locked; Lapis
# Crystal beside it, bought at I and active). A left click throws (ORB rest). Then the table: Polished Scepter clicked
# (UNLOCK: 352 XP, active); the left click throws nothing. Then Lapis Crystal clicked (ACTIVATE: no XP); it throws again.
# clear_state between the throws clears the crystal's own 600-tick cooldown and removes the orb (cause=selftest).
MG2:
  - cmd: "rpg playerxp set @s 30 levels"
  - wait: 40
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give lapis_staff"
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - cmd: "rpg enchant candidate 0 polished_scepter"
  - cmd: "rpg enchant candidate 0 lapis_crystal"
  - cmd: "rpg enchant level 0 1 1"
  - cmd: "rpg enchant active 0 1"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 20
  - probe_self: ""
  - reload: ""
  - wait: 20
  - clear_state: ""
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom lapis_staff"
  - wait: 2
  - dump: menu
  - click: "Polished Scepter"
  - wait: 2
  - dump: menu
  - close: ""
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg enchant show"
  - probe_self: ""
  - cmd: "rpg mana refill"
  - reload: ""
  - wait: 20
  - clear_state: ""
  - cmd: "enchanting"
  - wait: 3
  - shift_click: "bottom lapis_staff"
  - wait: 2
  - click: "Lapis Crystal"
  - wait: 2
  - dump: menu
  - close: ""
  - wait: 2
  - hold: lapis_staff
  - cmd: "rpg enchant show"
  - probe_self: ""
  - cmd: "rpg mana refill"
  - reload: ""
  - wait: 20
  - clear_state: ""

