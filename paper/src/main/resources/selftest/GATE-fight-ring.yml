# GATE-fight-ring.md: STEPS F4 + F5, THE RING DRAWN AND THE LIGHTNING, IN AN ORDINARY WORLD (feat/fight-ring,
# 2026-11-18). `/rpg selftest fight-ring`.
#
# THE FIXTURE: `/rpg fight start` puts C at the block the command runs at (the player's, or `execute positioned`'s);
# `land <dx> <dz>`, `mage-die` and `stop` drive core's MageCycle. Its lines: RINGTICK (every 4 ticks), FIGHTPHASE (each
# phase change, on its tick), STRIKE (each participant, each 40th tick), FIGHTKILL, FIGHT land|die|stop|FAILED_*.
# The fight clock is 0 at the start; the first tick is 1, the first RINGTICK 4 and the first strike tick 40.
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-fight-ring.md, THE PLAYER CANNOT DIE): every row that can strike him heals him
# to full before each strike tick it can reach, and no strike is larger than 80 (his maximum is at least 100). The rows
# that only watch the ring keep him at the Mage's point, which is inside every ring the cycle draws. Every row ends with
# `rpg fight stop`; the run's end stops any fixture a row left running.
#
# THE STAGING: the player at a block centre facing east (+x); where he moves, a stone floor and air above it, every fill
# box SAVED first. A mob is spawned by stepping to its spot and back.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# FR1: start; the ring is the border at C, IDLE.
FR1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - wait: 9
  - cmd: "rpg fight stop"

# FR2: land 0 0; the radius falls from 48 to 12 in exactly 144 ticks, and SLOW_CLOSE begins on that tick.
FR2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - wait: 20
  - cmd: "rpg fight land 0 0"
  - wait: 160
  - cmd: "rpg fight stop"

# FR3: land 18 0; 216 ticks, the centre on the straight line from C to M. He steps onto M, inside every ring.
FR3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-1 -1 -1 19 3 1"
  - cmd: "fill ~-1 ~-1 ~-1 ~19 ~-1 ~1 stone"
  - cmd: "fill ~-1 ~ ~-1 ~19 ~3 ~1 air"
  - cmd: "rpg heal 1000000"
  - cmd: "rpg fight start"
  - wait: 20
  - cmd: "rpg fight land 18 0"
  - cmd: "tp @s ~18 ~ ~ -90 0"
  - wait: 232
  - cmd: "rpg fight stop"

