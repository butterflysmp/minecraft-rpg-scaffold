# GATE-sunder.md (Melee M2): every row the instrument can drive. SU3 (a held movement key) and SU8 (the player's own
# death) are Ben's hand rows and have no scenario (the gate says why). Each casting row opens with `wait: 240`,
# Sunder's PROVISIONAL cooldown, and stages around wherever the player stands: aligned to a block centre, facing east,
# every fill box SAVED first so the run's restore puts it back. The instrument reads; it never judges.
setup:
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# SU1: the Left picker offers Sunder and not the thrust; pick it, and the Build screen shows it. THIS SAVES Left =
# Sunder in the profile, and the restore does not undo a saved loadout (the gate says so before the boot).
SU1:
  - expect_cell: "melee fire"
  - cmd: "build"
  - wait: 3
  - dump: menu
  - click: "Left: "
  - wait: 3
  - dump: menu
  - click: "Sunder"
  - wait: 3
  - dump: menu
  - close: ""

# SU2: flat ground; sa beside the take-off point, sb beside the landing.
SU2:
  - expect_cell: "melee fire"
  - wait: 240
  - cmd: "kill @e[tag=t]"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-1 -1 -4 12 4 4"
  - cmd: "fill ~-1 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-1 ~ ~-4 ~12 ~4 ~4 air"
  - cmd: 'summon zombie ~0 ~ ~-2.5 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","sa","selftest"]}'
  - cmd: 'summon zombie ~5 ~ ~2 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["t","sb","selftest"]}'
  - wait: 5
  - probe: sa
  - probe: sb
  - probe_self: ""
  - hold: stone
  - cmd: "rpg mana refill"
  - swing: HAND
  - wait: 60
  - probe_self: ""
  - probe: sa
  - probe: sb

