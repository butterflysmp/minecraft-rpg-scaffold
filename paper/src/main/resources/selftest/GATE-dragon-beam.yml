# KQ1R3: Ben's two beam questions. A frozen Knell 12 blocks east beams him twice: once while he stands still, once
# while he steps aside at the warning. The selftest tells him in chat before each. Each hit moves it 44 ticks later.
KQ1R3:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-14 -1 -14 16 6 14"
  - cmd: "fill ~-14 ~-1 ~-14 ~16 ~-1 ~14 stone"
  - cmd: "fill ~-14 ~ ~-14 ~16 ~6 ~14 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "kq1r3 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still and listen. The bell strike and its ringing start together; the beam fires one second later.","color":"gold"}'
  - wait: 60
  - beam: kq1r3
  - wait: 40
  - ask: "1 1200 Did the beam fire as the ringing became audible?"
  - cmd: "rpg heal 1000000"
  - cmd: 'tellraw @s {"text":"Now: as soon as you hear the bell strike, step sideways out of the purple line.","color":"gold"}'
  - wait: 100
  - beam: kq1r3
  - wait: 40
  - ask: "2 1200 With 1 second, could you still step out of the way in time?"
  - cmd: "kill @e[tag=kq1r3]"
  - wait: 5
