# GATE-dragon-beam.md: the Knell's beam (PLAN-dragon-mobs.md step R5), read from the SERVER. Ben, 2026-11-17, to the
# old game's numbers: "yes". Every 100 to 200 ticks a Knell locks a line from its EYE through its target's aim point
# (0.6 of the target's height), telegraphs for 12 ticks, rooted, then fires along that fixed line, out to 40 blocks or
# the first block. Only the locked target is hit, and only if its box grown by 1.0 on every side meets the segment:
# 35 x gear score / 100 before defence. A hit raises the report (E5); a miss raises nothing. The teleport after a hit
# (step R6) is NOT built: a hit moves nothing.
#
# THE STAGING, the same in every row: the player at a block centre facing east (+x); a stone floor and air above it,
# every fill box SAVED first, so the row-start clean and the run's restore put it back. A mob is spawned by stepping
# the player to its spot, spawning at the feet, and stepping back. The run's restore removes every mob tagged
# "selftest" within 48 blocks.
#
# TWO KINDS OF KNELL, AND THE ROWS USE BOTH:
#   - FROZEN (NoAI): it cannot walk or melee, and its OWN cycle never begins a beam (I23). The BEAM step forces one
#     NOW, at its normal choice of target. Every distance is exact. KB1, KB3-KB9, KQ1.
#   - LIVE, PENNED: AI on, inside a two-high glass pen whose near wall is 4.5 blocks from the player, so it can never
#     reach him (no melee, so no Wither effect). KB2 (forced, to read the root). (KB11, its own cycle, moved to GATE-dragon-teleport.yml as KB11R2.)
#
# THE PLAYER CANNOT DIE IN ANY ROW (GATE-dragon-beam.md, THE PLAYER CANNOT DIE): each row that can hit him first
# heals him to his maximum, at least 100, and no row can deal more than 35 before his defence after one heal.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB1: a forced beam at a still player, from a frozen Knell 8 blocks east: the telegraph, the fire 12 ticks later
# naming him hit, the report, and one HURT line for 35 before defence.
KB1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-8 -1 -4 12 6 4"
  - cmd: "fill ~-8 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-8 ~ ~-4 ~12 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb1 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - beam: kb1
  - wait: 20

# KB2: the root. A LIVE Knell, penned 14 blocks east, walking toward the player; forced mid-walk. Its feet at the
# telegraph and at the fire are the same; the two AT reads before the force are the control that it was walking.
KB2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -1 -4 17 6 4"
  - cmd: "fill ~-10 ~-1 ~-4 ~17 ~-1 ~4 stone"
  - cmd: "fill ~-10 ~ ~-4 ~17 ~6 ~4 air"
  - cmd: "fill ~5 ~ ~-3 ~16 ~1 ~3 glass"
  - cmd: "fill ~6 ~ ~-2 ~15 ~1 ~2 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~14 ~ ~"
  - spawn: "kb2 live knell 100"
  - cmd: "tp @s ~-14 ~ ~ -90 0"
  - wait: 15
  - probe_at: kb2
  - wait: 5
  - probe_at: kb2
  - beam: kb2
  - wait: 20
  - probe_at: kb2

