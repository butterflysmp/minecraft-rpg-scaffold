# KQ1R5: Ben's first question. A frozen Knell 12 blocks east beams him once while he stands still: the bell and the
# ringing at the warning, the higher bell and the chime at the shot 24 ticks later, and its move 24 ticks after that
# (the production draw); then the row asks, and kills the Knell.
KQ1R5:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-14 -1 -14 16 6 14"
  - cmd: "fill ~-14 ~-1 ~-14 ~16 ~-1 ~14 stone"
  - cmd: "fill ~-14 ~ ~-14 ~16 ~6 ~14 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "kq1r5 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still and listen: the bell and the ringing at the warning, the higher bell at the shot, the Knell moving as long again after it.","color":"gold"}'
  - wait: 60
  - beam: kq1r5
  - wait: 60
  - ask: "1 1200 Is the shot in the middle now, the way you wanted?"
  - cmd: "kill @e[tag=kq1r5]"
  - wait: 5
