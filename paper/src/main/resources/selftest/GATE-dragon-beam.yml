# THE KNELL'S BEAM, AS RE-PREDICTED BY GATE-dragon-knell-5.md (the shot in the middle, 2026-11-17). The file keeps its
# name so the run sheet's command is unchanged (`/rpg selftest dragon-beam`); its rows are now GATE-dragon-knell-5.md's,
# each named for the GATE-dragon-knell-4.md row it supersedes with the next suffix. The old rows' predictions and
# readings stay in GATE-dragon-knell-4.md, untouched, under a dated note.
#
# THE BEAM NOW: every 100 to 200 ticks a Knell locks a line from its EYE through its target's aim point; the bell, at
# pitch 1.0, and the RESONANCE start at the lock; it telegraphs for 24 ticks, rooted; then fires along that fixed line,
# out to 40 blocks or the first block, with a SECOND bell at pitch 1.5 and the amethyst chime. Only the locked target
# is hit, when its box grown by 1.0 meets the segment: 65 x gear score / 100 before defence. A hit moves the Knell 24
# ticks after the fire, 48 after the lock.
#
# EVERY ROW ENDS ITSELF: after its fire (or its none), the row KILLS its Knell and waits for the death to settle, so a
# hit's pending teleport is skipped INSIDE the row (`TELEPORT skipped ... reason=knell-gone`): the kill is 40 ticks
# after the force, the fire at 25 or 26, the move would fall due at 49 or 50.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and air above it, every fill box SAVED
# first. A mob is spawned by stepping the player to its spot, spawning at the feet, and stepping back.
#
# TWO KINDS OF KNELL:
#   - FROZEN (NoAI): it cannot walk or melee, and its OWN cycle never begins a beam (I23). The BEAM step forces one.
#     Every row but the two live rows.
#   - LIVE, IN THE OPEN (the root row and the walk-again row): AI on, 15 blocks east on an open floor, so it SEES him.
#     It walks toward him at most 0.0947 blocks a tick (read from the jar), so it cannot reach him before the row
#     kills it.
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row deals more than one 65 before his defence
# after a heal.

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB1R5: a forced beam at a still player, from a frozen Knell 8 blocks east: the strike and the resonance at the
# lock, the fire 24 ticks later with the higher bell and the chime, dealt 65; then the row kills the Knell and its
# pending teleport is skipped.
KB1R5:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -1 -4 12 6 4"
  - cmd: "fill ~-10 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-10 ~ ~-4 ~12 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb1r5 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - beam: kb1r5
  - wait: 40
  - cmd: "kill @e[tag=kb1r5]"
  - wait: 5

