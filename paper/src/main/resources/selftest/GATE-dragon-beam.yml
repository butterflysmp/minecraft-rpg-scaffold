# KQ1R4: Ben's two bell questions. A frozen Knell 12 blocks east beams him once while he stands still: the lower bell
# and the ringing at the warning, the higher bell and the chime at the shot. Its hit moves it 28 ticks later (the
# production draw); then the row asks, and kills the Knell.
KQ1R4:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-14 -1 -14 16 6 14"
  - cmd: "fill ~-14 ~-1 ~-14 ~16 ~-1 ~14 stone"
  - cmd: "fill ~-14 ~ ~-14 ~16 ~6 ~14 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "kq1r4 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still and listen: a low bell and the ringing at the warning, a higher bell at the shot one second later.","color":"gold"}'
  - wait: 60
  - beam: kq1r4
  - wait: 60
  - ask: "1 1200 Does the higher bell at the shot give it what was missing?"
  - ask: "2 1200 Is the lower first bell better than before?"
  - cmd: "kill @e[tag=kq1r4]"
  - wait: 5
