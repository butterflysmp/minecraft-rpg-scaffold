# KB10 AND KB11 LEFT THIS FILE, 2026-11-17, step R6 (GATE-dragon-teleport.md, THE ROWS ALREADY STACKED). KB10 read
# "the Knell does NOT move after a hit", which R6 makes false. KB11's live penned Knell, once its beam hits, would
# teleport OUT of its pen within reach of the player. Neither was ever booted; each is re-predicted as KB10R2 and KB11R2
# in selftest/GATE-dragon-teleport.yml, and their predictions stay in GATE-dragon-beam.md under a dated note.

# KQ1: Ben's three questions. A frozen Knell 12 blocks east beams him twice: once while he stands still, once while he
# steps aside at the warning. The selftest tells him in chat before each.
KQ1:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-8 -1 -6 16 6 6"
  - cmd: "fill ~-8 ~-1 ~-6 ~16 ~-1 ~6 stone"
  - cmd: "fill ~-8 ~ ~-6 ~16 ~6 ~6 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~12 ~ ~"
  - spawn: "kq1 frozen knell 100"
  - cmd: "tp @s ~-12 ~ ~ -90 0"
  - cmd: 'tellraw @s {"text":"Stand still and watch the Knell to your east. It will warn you, then fire.","color":"gold"}'
  - wait: 60
  - beam: kq1
  - wait: 40
  - ask: "1 1200 Did you see a warning before the beam hit you?"
  - ask: "2 1200 Did the hit feel fair for a single shot?"
  - cmd: "rpg heal 1000000"
  - cmd: 'tellraw @s {"text":"Now: when you see the purple warning line, step sideways out of it.","color":"gold"}'
  - wait: 60
  - beam: kq1
  - wait: 40
  - ask: "3 1200 Was it possible to step out of the way in time?"
