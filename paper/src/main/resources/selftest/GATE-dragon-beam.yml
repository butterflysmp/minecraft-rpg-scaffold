# THE KNELL'S BEAM, AS RE-PREDICTED BY GATE-dragon-knell-2.md (the follow-up of 2026-11-17). The file keeps its name so
# the run sheet's command is unchanged (`/rpg selftest dragon-beam`); its rows are now GATE-dragon-knell-2.md's, each
# a new row named for the GATE-dragon-beam.md row it supersedes, with the next suffix (KB1 -> KB1R2). The old rows'
# predictions and readings stay in GATE-dragon-beam.md, untouched, under a dated note (SelfTestScenariosTest.docOf).
#
# THE BEAM NOW: every 100 to 200 ticks a Knell locks a line from its EYE through its target's aim point, telegraphs
# for 26 ticks (Ben's 1.3 s), rooted, with the bell STRIKE at the lock; then fires along that fixed line, out to 40
# blocks or the first block, with the RESONANCE and the chime. Only the locked target is hit, when its box grown by
# 1.0 meets the segment: 65 x gear score / 100 before defence (Ben's 65). A hit moves the Knell 89 ticks later.
#
# EVERY ROW ENDS ITSELF: after its fire (or its none), the row KILLS its Knell and waits for the death to settle, so a
# hit's pending teleport is skipped INSIDE the row (`TELEPORT skipped ... reason=knell-gone`), never in the next row's
# bracket. On 2026-11-17 KB4's Knell moved in KB5's bracket because the row's end rested on the runner's tick count.
#
# THE STAGING: the player at a block centre facing east (+x); a stone floor and air above it, every fill box SAVED
# first. A mob is spawned by stepping the player to its spot, spawning at the feet, and stepping back.
#
# TWO KINDS OF KNELL:
#   - FROZEN (NoAI): it cannot walk or melee, and its OWN cycle never begins a beam (I23). The BEAM step forces one.
#     Every row but KB2R2.
#   - LIVE, IN THE OPEN (KB2R2 only): AI on, 15 blocks east on an open floor, so it SEES him (vanilla targeting needs
#     sight: LivingEntity.hasLineOfSight clips eye to eye with COLLIDER blocks, which is why KB2's glass pen kept its
#     Knell blind). It walks toward him at most 0.0947 blocks a tick (read from the jar), so it cannot reach him before
#     the row kills it (GATE-dragon-knell-2.md, THE PLAYER CANNOT DIE).
#
# THE PLAYER CANNOT DIE IN ANY ROW: each row heals him first, and no row deals more than one 65 before his defence
# after a heal (KQ1R2 heals between its two beams).

setup:
  - difficulty: normal
  - wait: 2
  - cmd: "time set 6000"
  - cmd: "gamerule spawn_mobs false"
  - close: ""

# KB1R2: a forced beam at a still player, from a frozen Knell 8 blocks east: the strike at the lock, the fire 26 ticks
# later with the resonance and the chime, dealt 65; then the row kills the Knell and its pending teleport is skipped.
KB1R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -1 -4 12 6 4"
  - cmd: "fill ~-10 ~-1 ~-4 ~12 ~-1 ~4 stone"
  - cmd: "fill ~-10 ~ ~-4 ~12 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~8 ~ ~"
  - spawn: "kb1r2 frozen knell 100"
  - cmd: "tp @s ~-8 ~ ~ -90 0"
  - wait: 5
  - beam: kb1r2
  - wait: 40
  - cmd: "kill @e[tag=kb1r2]"
  - wait: 5

# KB2R2: the root, READ ON A WALKING KNELL (KB2 was hollow). A LIVE Knell 15 blocks east, in the open, sees him and
# walks toward him; two AT reads 5 ticks apart are the control that it is walking; the force; its feet at the
# telegraph and at the fire 26 ticks later are the same; 12 ticks after the fire it has walked again. Then killed.
KB2R2:
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - save_blocks: "-10 -1 -4 17 6 4"
  - cmd: "fill ~-10 ~-1 ~-4 ~17 ~-1 ~4 stone"
  - cmd: "fill ~-10 ~ ~-4 ~17 ~6 ~4 air"
  - cmd: "rpg heal 1000000"
  - cmd: "tp @s ~15 ~ ~"
  - spawn: "kb2r2 live knell 100"
  - cmd: "tp @s ~-15 ~ ~ -90 0"
  - wait: 60
  - probe_at: kb2r2
  - wait: 5
  - probe_at: kb2r2
  - beam: kb2r2
  - wait: 40
  - probe_at: kb2r2
  - cmd: "kill @e[tag=kb2r2]"
  - wait: 5

