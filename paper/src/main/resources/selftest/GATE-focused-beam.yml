# GATE-focused-beam (docs/gates/GATE-focused-beam.md): the owed weapon filter (PR 1, feat/behaviour-weapon-filter) and
# Focused Beam, the Cursed Emerald's weapon-specific enchant (PR 2, feat/focused-beam), 2026-11-24. `/rpg selftest
# focused-beam`. SURVIVAL, every row; ALL AUTO, no ASK. On the pad: the setup's FIRST step stands him on it facing east,
# the SECOND measures the ground every summon stands on (east 0..42, so the zombie 40 out stands inside it). Night
# (18000), no natural spawns, no phantoms, difficulty normal, each put back by the run's restore. Every mob a frozen NoAI
# zombie at vanilla max 200 (so 1000 health; nothing here dies), on his aim line unless the row says otherwise. Every row
# self-contained under ScenarioLint's rules: it empties his storage, gives a fresh weapon, sets his level, its score, its
# enchant state, mana, a cleared cooldown and a fresh record, turns him east and waits before the press, and probes only
# its own mobs, in reach.
setup:
  - pad: ""
  - preflight: "0 -6 42 10"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 2
  - probe_self: ""

# FB0: THE CONTROL, NO ENCHANT: a zombie 10 out takes the plain volley's six bolts of 27; 40 mana once.
FB0:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give cursed_emerald"
  - wait: 2
  - hold: cursed_emerald
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: 'summon zombie ~10 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["m","selftest"],attributes:[{id:"minecraft:max_health",base:200.0}],Health:200.0f}'
  - wait: 40
  - probe_mana: ""
  - use: right_click
  - probe_mana: ""
  - wait: 60
  - probe_mana: ""
  - probe: m

