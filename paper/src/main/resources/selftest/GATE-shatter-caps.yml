# GATE-shatter-caps (docs/gates/GATE-shatter-caps.md): the Breacher's reach of 18 (PR 1, feat/breacher-reach) and Shatter
# Caps, its weapon-specific enchant (PR 2, feat/shatter-caps), 2026-11-24. `/rpg selftest shatter-caps`. SURVIVAL, every
# row; ALL AUTO, no ASK. On the pad (Ben's ruling A): the setup's FIRST step stands him on it facing east, the SECOND
# measures the ground every summon stands on. Night (18000), no natural spawns, no phantoms, difficulty normal, each put
# back by the run's restore. Every mob a frozen NoAI zombie at vanilla max 200 (so 1000 health; nothing here dies), one
# per row, on his aim line, so no mob shadows another. Every row self-contained under ScenarioLint's rules: it empties
# his storage, gives a fresh Breacher (a full quiver of 2), sets his level, its score, its enchant state, mana, a
# cleared cooldown and a fresh record, turns him east and waits before the press, and probes only its own mob, in reach.
setup:
  - pad: ""
  - preflight: "0 -6 32 10"
  - difficulty: normal
  - trace: on
  - cmd: "time set 18000"
  - cmd: "gamerule spawn_mobs false"
  - cmd: "gamerule spawn_phantoms false"
  - close: ""
  - cmd: "kill @e[type=minecraft:zombie,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:skeleton,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:spider,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:creeper,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:enderman,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:witch,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:slime,distance=..64,tag=!selftest]"
  - cmd: "kill @e[type=minecraft:phantom,distance=..64,tag=!selftest]"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - wait: 2
  - probe_self: ""

# SR1: THE REACH, NO ENCHANT: a zombie 17 out takes the centre chunk (the only one at that distance).
SR1:
  - cmd: "rpg playerxp set @s 1 levels"
  - clear_inventory: ""
  - clear_state: ""
  - cmd: "rpg give breacher"
  - wait: 2
  - hold: breacher
  - cmd: "rpg gearscore set 100"
  - cmd: "rpg mana refill"
  - cmd: "rpg enchant clear"
  - wait: 2
  - cmd: "rpg enchant show"
  - cmd: "execute align xz positioned ~0.5 ~ ~0.5 run tp @s ~ ~ ~ -90 0"
  - cmd: "kill @e[tag=selftest,distance=..64]"
  - cmd: 'summon zombie ~17 ~ ~0 {NoAI:1b,PersistenceRequired:1b,IsBaby:0b,Tags:["f","selftest"],attributes:[{id:"minecraft:max_health",base:200.0}],Health:200.0f}'
  - wait: 40
  - use: right_click
  - wait: 20
  - probe: "f 19"

