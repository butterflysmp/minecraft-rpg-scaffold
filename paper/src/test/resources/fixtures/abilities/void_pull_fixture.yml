# TEST-ONLY FIXTURE. NOT SHIPPED: it lives under src/test/resources, which is never packaged into the plugin jar.
#
# The void implosion's SECOND USE (PLAN-dragon-mobs.md, the 2026-11-17 brief, Part D 1): proof that an ability can
# name the same shape the Phage's blast uses, from content alone. It pulls MOBS toward where the cast lands and deals
# NO damage (no `damage:` key). AbilityLoaderTest loads it with the real loader.

id: void_pull_fixture
display_name: "<dark_purple>Void Pull (fixture)</dark_purple>"
element: void
cooldown_ticks: 40
cast:
  type: self
on_hit:
  - type: implosion
    reach: 5                      # BLOCKS, origin to feet, inclusive
    falloff: vanilla_explosion    # the share of `damage` at distance d; inert here, no damage is authored
    pull: 0                       # a single pull's MULTIPLIER of vanilla's push: 0, since this one drags
    resistance: knockback         # the attribute that cuts it: explosion_knockback | knockback | none
    affects: mobs                 # or players
    lift: 0                       # a multiplier of the push's lift: a drag has none
    duration_ticks: 20            # 2026-11-18: TICKS it drags for after it lands (1 would be a single pull)
    drag: 0.28                    # BLOCKS PER TICK added toward the origin each tick, at the origin, x (1 - d / reach)
    visual: void_implosion        # drawn at the reach
